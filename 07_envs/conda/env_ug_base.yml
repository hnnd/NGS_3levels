# 本科生 · 环境 1/4：通用与质控比对
# 覆盖单元：u01 Linux+Conda ｜ u02 R 与可视化 ｜ u03 数据格式
#           u04 质控与预处理 ｜ u05 比对与 BAM ｜ u07 IGV 部分
#
# 创建：conda env create -f env_ug_base.yml
# 激活：conda activate ngs_ug_base
#
# 【版本策略】已在旧环境中验证过的工具保留原有 pin；本轮新增的工具暂不 pin，
# 待首次成功 solve 后用 `conda env export --no-builds` 回填精确版本。

name: ngs_ug_base
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # 【生态性断裂】setuptools 82.0.0（2026-02-08）移除了 pkg_resources（81.x 仍含），而 bioconda 上
  # 2023-2024 年的 Python 工具（multiqc 1.14、macs2、部分 deeptools 子命令等）仍 import 它，
  # 表现为 `ModuleNotFoundError: No module named 'pkg_resources'`。全课程统一钉 <81（比必要的 <82 多保守一档，已实测可用）。
  - setuptools<81
  # ---- 质量控制与预处理（u04）----
  - fastqc=0.12.1
  - multiqc=1.14
  - fastp=1.3.6        # 钉到集群 /d3/lab/envs/ngs_ug_base 实装版本（2026-11-05 核对）

  # ---- 序列比对与 BAM 处理（u05）----
  - bwa=0.7.17
  - bowtie2=2.5.1
  - samtools=1.17
  - bedtools=2.31.0

  # ---- 基因组浏览（u07）----
  - igv

  # ---- R 环境与报告（u02，贯穿全部单元）----
  - r-base=4.3.1
  - r-tidyverse
  - r-ggplot2=3.4.2
  - r-rmarkdown=2.23
