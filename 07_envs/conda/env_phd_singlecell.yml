# 博士生 · 环境 2/6：单细胞与空间转录组
# 覆盖专题：p02
# 创建：conda env create -f env_phd_singlecell.yml  激活：conda activate ngs_phd_sc
#
# 【为什么单独】Seurat（R）与 scanpy（Python）两套生态的依赖极重，
# 与其他专题共存会大幅拖慢 solve；且单细胞包版本迭代快，需独立锁版本。
# 【版本来源】下列 pin 取自集群已建环境 /d3/lab/envs/ngs_phd_sc 的实装版本（2026-11-05 核对）。

name: ngs_phd_sc
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # 【生态性断裂】setuptools 82.0.0（2026-02-08）移除了 pkg_resources（81.x 仍含），而 bioconda 上
  # 2023-2024 年的 Python 工具（multiqc 1.14、macs2、部分 deeptools 子命令等）仍 import 它，
  # 表现为 `ModuleNotFoundError: No module named 'pkg_resources'`。全课程统一钉 <81（比必要的 <82 多保守一档，已实测可用）。
  - setuptools<81
  # ---- R 侧 ----
  - r-base=4.3.1
  - r-seurat=5.3.0
  - r-harmony=1.2.3
  - r-ggplot2=3.4.2
  - bioconductor-singler=2.4.0
  - bioconductor-complexheatmap=2.18.0
  # 02_pseudobulk_de.R 必需；版本与 ngs_phd_base 一致
  - bioconductor-deseq2=1.42.0
  # 02_spatial_visium.R 用到；原为传递依赖，显式声明以免漂移
  - r-patchwork=1.3.2
  - r-circlize=0.4.16

  # ---- Python 侧 ----
  - python=3.10
  - scanpy=1.11.5
  - anndata=0.11.4
  - leidenalg=0.10.2
  - harmonypy=2.0.0
  - squidpy=1.6.5    # 空间转录组（Visium）分析
