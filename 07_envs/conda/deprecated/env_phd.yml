# 博士生 Conda 环境配置
# 课程：高通量测序技术与数据分析（高级）
# 创建命令：conda env create -f env_phd.yml
# 激活命令：conda activate ngs_phd

name: ngs_phd
channels:
  - bioconda
  - conda-forge
  - defaults

dependencies:
  # ============ 单细胞分析 ============
  - r-seurat=4.3.0
  - scanpy=1.9.3
  - leidenalg=0.10.1
  - scvi-tools=0.20.3
  
  # ============ GWAS 分析 ============
  - plink=1.90b6.21
  - plink2=2.00a3.7
  - gemma=0.98.5
  - bcftools=1.17
  - vcftools=0.1.16
  
  # ============ 多组学整合 ============
  - r-wgcna=1.72
  
  # ============ 工作流开发 ============
  - nextflow=23.04.1
  - snakemake=7.28.1
  - singularity=3.8.6
  
  # ============ 高级可视化 ============
  - r-complexheatmap=2.14.0
  - r-circlize=0.4.15
  - r-patchwork=1.1.2
  - r-ggrepel=0.9.3
  - r-ggsci=3.0.0
  
  # ============ R 语言环境 ============
  - r-base=4.3.1
  - r-tidyverse=2.0.0
  - r-ggplot2=3.4.2
  - r-rmarkdown=2.23
  - r-devtools=2.4.5
  
  # Bioconductor 包
  - bioconductor-singlecellexperiment=1.22.0
  - bioconductor-scater=1.28.0
  - bioconductor-scran=1.28.0
  
  # ============ Python 环境 ============
  - python=3.10
  - numpy=1.24.3
  - pandas=2.0.2
  - matplotlib=3.7.1
  - seaborn=0.12.2
  - scikit-learn=1.2.2
  
  # ============ Jupyter ============
  - jupyter=1.0.0
  - notebook=7.0.0
  - jupyterlab=4.0.2
  - r-irkernel=1.3.2
  
  # ============ 其他工具 ============
  - parallel=20230722
  - pigz=2.7
