# 硕士生 Conda 环境配置
# 课程：高通量测序技术与数据分析（进阶）
# 创建命令：conda env create -f env_master.yml
# 激活命令：conda activate ngs_master

name: ngs_master
channels:
  - bioconda
  - conda-forge
  - defaults

dependencies:
  # ============ 通用工具 ============
  - fastp=0.23.4
  - multiqc=1.14
  - samtools=1.17
  - bedtools=2.31.0
  
  # ============ 基因组组装 ============
  - flye=2.9.2
  - quast=5.2.0
  - busco=5.4.7
  - prokka=1.14.6
  
  # ============ 重测序分析 ============
  - bwa-mem2=2.2.1
  - gatk4=4.4.0.0
  - bcftools=1.17
  - snpeff=5.1
  
  # ============ 转录组分析 ============
  - star=2.7.10b
  - salmon=1.10.0
  - subread=2.0.4
  - stringtie=2.2.1
  
  # ============ 扩增子分析 ============
  # QIIME2 建议单独安装
  # conda create -n qiime2 qiime2
  
  # ============ 宏基因组分析 ============
  - megahit=1.2.9
  - metabat2=2.15
  - checkm-genome=1.2.2
  - eggnog-mapper=2.1.11
  
  # ============ 泛基因组分析 ============
  - orthofinder=2.5.5
  - mafft=7.520
  - iqtree=2.2.2
  
  # ============ R 语言环境 ============
  - r-base=4.3.1
  - r-tidyverse=2.0.0
  - r-ggplot2=3.4.2
  - r-rmarkdown=2.23
  - r-pheatmap=1.0.12
  
  # Bioconductor 包
  - bioconductor-deseq2=1.40.0
  - bioconductor-edger=3.42.0
  - bioconductor-clusterprofiler=4.8.0
  - bioconductor-org.hs.eg.db=3.17.0
  
  # ============ 其他工具 ============
  - jupyter=1.0.0
  - notebook=7.0.0
  - parallel=20230722
