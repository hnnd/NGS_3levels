<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<rect width="800" height="700" fill="#FAFAF7"/>

<rect x="60" y="66" width="680" height="92" fill="#3C5488" rx="14"/>
<text x="400" y="126" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">下单量 = 基因组×深度÷有效</text>
<rect x="60" y="210" width="320" height="220" fill="#D8EEE9" rx="16" stroke="#00A087" stroke-width="5"/>
<text x="220" y="276" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#00A087" text-anchor="middle" font-weight="bold">基准例：</text>
<text x="220" y="330" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#33332E" text-anchor="middle" font-weight="bold">13.77 Gb</text>
<text x="220" y="368" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle">380 Mb × 30×</text>
<text x="220" y="406" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle">÷ 0.828</text>
<rect x="420" y="210" width="320" height="220" fill="#FBEEE7" rx="16" stroke="#F39B7F" stroke-width="5"/>
<text x="580" y="276" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#33332E" text-anchor="middle" font-weight="bold">高重复例：</text>
<text x="580" y="330" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#33332E" text-anchor="middle" font-weight="bold">16.76 Gb</text>
<text x="580" y="396" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle">分母 0.68</text>
<rect x="170" y="492" width="460" height="72" fill="#E64B35" rx="14"/>
<text x="400" y="539" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="bold">分母三项须有来源</text>
</svg>
