<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<rect width="800" height="700" fill="#FAFAF7"/>

<rect x="250" y="60" width="300" height="70" fill="#3C5488" rx="12"/>
<text x="400" y="106" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">padj = NA ?</text>
<line x1="400" y1="130" x2="130" y2="208" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="130,208 139.93262140750397,199.61292470671725 142.87503346648504,209.79819721857478" fill="#6B6B66"/>
