<line x1="195.0" y1="250" x2="375.0" y2="250" stroke="#00A087" stroke-width="5" stroke-linecap="butt"/>
<line x1="195.0" y1="250" x2="195.0" y2="270" stroke="#00A087" stroke-width="5" stroke-linecap="butt"/>
<line x1="375.0" y1="250" x2="375.0" y2="270" stroke="#00A087" stroke-width="5" stroke-linecap="butt"/>
<text x="285.0" y="238" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#00A087" text-anchor="middle" font-weight="bold">TGC = [2, 4]，长 3 bp</text>
<text x="60" y="438" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#8491B4" text-anchor="start" font-weight="bold">0-based 半开（BED）</text>
