<line x1="330" y1="444" x2="330" y2="480" stroke="#8491B4" stroke-width="4" stroke-linecap="butt"/>
<text x="330" y="512" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#8491B4" text-anchor="middle" font-weight="bold">3</text>
<line x1="420" y1="444" x2="420" y2="480" stroke="#8491B4" stroke-width="4" stroke-linecap="butt"/>
<text x="420" y="512" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#8491B4" text-anchor="middle" font-weight="bold">4</text>
<line x1="510" y1="444" x2="510" y2="480" stroke="#8491B4" stroke-width="4" stroke-linecap="butt"/>
<text x="510" y="512" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#8491B4" text-anchor="middle" font-weight="bold">5</text>
<line x1="150" y1="548" x2="420" y2="548" stroke="#8491B4" stroke-width="5" stroke-linecap="butt"/>
<line x1="150" y1="548" x2="150" y2="528" stroke="#8491B4" stroke-width="5" stroke-linecap="butt"/>
<line x1="420" y1="548" x2="420" y2="528" stroke="#8491B4" stroke-width="5" stroke-linecap="butt"/>
<text x="285.0" y="590" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#8491B4" text-anchor="middle" font-weight="bold">TGC = [1, 4)，长 3 bp</text>
<rect x="540" y="250" width="240" height="200" fill="#F6D8D2" rx="14" stroke="#E64B35" stroke-width="5"/>
<text x="660" y="296" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#E64B35" text-anchor="middle" font-weight="bold">照抄进 BED</text>
<text x="660" y="344" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#33332E" text-anchor="middle" font-weight="bold">chr1 1000 1200</text>
<text x="660" y="392" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="24" fill="#E64B35" text-anchor="middle" font-weight="bold">→ 第 1001–1200 号</text>
</svg>
