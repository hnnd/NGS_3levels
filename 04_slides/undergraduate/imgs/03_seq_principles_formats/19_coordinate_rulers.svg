<text x="195.0" y="282" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#00A087" text-anchor="middle" font-weight="bold">2</text>
<line x1="285.0" y1="290" x2="285.0" y2="330" stroke="#00A087" stroke-width="4" stroke-linecap="butt"/>
<text x="285.0" y="282" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#00A087" text-anchor="middle" font-weight="bold">3</text>
<line x1="375.0" y1="290" x2="375.0" y2="330" stroke="#00A087" stroke-width="4" stroke-linecap="butt"/>
<text x="375.0" y="282" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#00A087" text-anchor="middle" font-weight="bold">4</text>
<line x1="465.0" y1="290" x2="465.0" y2="330" stroke="#00A087" stroke-width="4" stroke-linecap="butt"/>
