<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<rect width="800" height="700" fill="#FAFAF7"/>

<text x="400" y="50" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#3C5488" text-anchor="middle" font-weight="bold">半开与闭标尺对照</text>
<text x="400" y="92" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle" font-weight="bold">起点必须减一终点不变</text>
<rect x="60" y="340" width="90" height="70" fill="#00A087" rx="6"/>
<text x="105.0" y="388" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">A</text>
<rect x="150" y="340" width="90" height="70" fill="#8491B4" rx="6"/>
<text x="195.0" y="388" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">T</text>
<rect x="240" y="340" width="90" height="70" fill="#F39B7F" rx="6"/>
<text x="285.0" y="388" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">G</text>
<rect x="330" y="340" width="90" height="70" fill="#4DBBD5" rx="6"/>
<text x="375.0" y="388" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">C</text>
<rect x="420" y="340" width="90" height="70" fill="#00A087" rx="6"/>
<text x="465.0" y="388" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">A</text>
<rect x="150" y="340" width="270" height="70" fill="none" rx="6" stroke="#E64B35" stroke-width="5"/>
<text x="60" y="150" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#00A087" text-anchor="start" font-weight="bold">1-based 闭（GFF3/VCF）</text>
<line x1="105.0" y1="290" x2="105.0" y2="330" stroke="#00A087" stroke-width="4" stroke-linecap="butt"/>
