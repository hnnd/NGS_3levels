<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<rect width="800" height="700" fill="#FAFAF7"/>

<text x="400" y="50" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#3C5488" text-anchor="middle" font-weight="bold">排查三道闸门</text>
<text x="400" y="92" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle" font-weight="bold">类型魔数首字符，解压看结构</text>
<rect x="50" y="130" width="700" height="128" fill="#F0F9FF" rx="16" stroke="#3C5488" stroke-width="4"/>
<circle cx="100" cy="194" r="30" fill="#3C5488"/>
<text x="100" y="205" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<rect x="150" y="148" width="560" height="48" fill="#1E293B" rx="8"/>
<text x="170" y="182" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#FFFFFF" text-anchor="start" font-weight="bold">file &quot;$F&quot;</text>
<text x="170" y="238" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#00A087" text-anchor="start" font-weight="bold">→ ASCII text ｜ gzip compressed</text>
<rect x="50" y="290" width="700" height="128" fill="#F0F9FF" rx="16" stroke="#3C5488" stroke-width="4"/>
<circle cx="100" cy="354" r="30" fill="#3C5488"/>
<text x="100" y="365" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<rect x="150" y="308" width="560" height="48" fill="#1E293B" rx="8"/>
<text x="170" y="342" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#FFFFFF" text-anchor="start" font-weight="bold">head -c 2 &quot;$F&quot; | od -An -tx1</text>
<text x="170" y="398" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#00A087" text-anchor="start" font-weight="bold">→ 1f 8b = gzip ｜ 其他</text>
<rect x="50" y="450" width="700" height="128" fill="#F0F9FF" rx="16" stroke="#3C5488" stroke-width="4"/>
<circle cx="100" cy="514" r="30" fill="#3C5488"/>
<text x="100" y="525" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<rect x="150" y="468" width="560" height="48" fill="#1E293B" rx="8"/>
<text x="170" y="502" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#FFFFFF" text-anchor="start" font-weight="bold">zcat &quot;$F&quot; | head -1 ｜ head -1 &quot;$F&quot;</text>
<text x="170" y="558" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C8DAD" text-anchor="start" font-weight="bold">→ 首字符 &gt; 或 @</text>
<rect x="40" y="606" width="720" height="60" fill="#E64B35" rx="12"/>
<text x="400" y="646" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">非 gzip 直接 zcat：必报 not in gzip format</text>
</svg>
