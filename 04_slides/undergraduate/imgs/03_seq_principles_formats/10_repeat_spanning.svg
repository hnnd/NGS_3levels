<text x="400" y="92" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle" font-weight="bold">长读两端锚定独特序列</text>
<rect x="70" y="250" width="190" height="46" fill="#E3E8F2" rx="8"/>
