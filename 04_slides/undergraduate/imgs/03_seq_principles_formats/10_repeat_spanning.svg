<text x="400" y="388" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#00A087" text-anchor="middle" font-weight="bold">15 kb（设例）：长度 ≥ R + a + b</text>
<polyline points="184,544 196,558 220,528" fill="none" stroke="#00A087" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="584,544 596,558 620,528" fill="none" stroke="#00A087" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="584" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#00A087" text-anchor="middle" font-weight="bold">a（5 kb）</text>
<text x="600" y="584" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#00A087" text-anchor="middle" font-weight="bold">b（5 kb）</text>
