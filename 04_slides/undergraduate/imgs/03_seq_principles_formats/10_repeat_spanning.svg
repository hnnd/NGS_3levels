<text x="425" y="178" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#E64B35" text-anchor="middle" font-weight="bold">150 bp</text>
<text x="425" y="236" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="44" fill="#E64B35" text-anchor="middle" font-weight="bold">?</text>
