<text x="230" y="170" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="bold">无法锚定</text>
<line x1="280" y1="190" x2="380" y2="218" stroke="#E64B35" stroke-width="5" stroke-linecap="round"/>
<polygon points="380,218 362.1941080956534,220.63632575580564 366.1521072368373,206.50061453729174" fill="#E64B35"/>
<rect x="70" y="470" width="190" height="46" fill="#E3E8F2" rx="8"/>
