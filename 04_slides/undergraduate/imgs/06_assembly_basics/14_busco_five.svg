<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<rect width="800" height="700" fill="#FAFAF7"/>

<rect x="60" y="230" width="340" height="90" fill="#4DBBD5"/>
<rect x="400" y="230" width="170" height="90" fill="#8491B4"/>
<rect x="570" y="230" width="68" height="90" fill="#F39B7F"/>
<rect x="638" y="230" width="102" height="90" fill="#E9E9E5"/>
<text x="84" y="288" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#FFFFFF" text-anchor="start" font-weight="bold">S 单拷贝</text>
<text x="424" y="288" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#FFFFFF" text-anchor="start" font-weight="bold">D 多拷贝</text>
<text x="689" y="288" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle" font-weight="bold">M 缺失</text>
<line x1="604" y1="320" x2="604" y2="348" stroke="#6B6B66" stroke-width="3" stroke-linecap="butt"/>
<text x="604" y="380" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle" font-weight="bold">F 碎片</text>
<line x1="60" y1="196" x2="570" y2="196" stroke="#00A087" stroke-width="5" stroke-linecap="butt"/>
<line x1="60" y1="196" x2="60" y2="216" stroke="#00A087" stroke-width="5" stroke-linecap="butt"/>
<line x1="570" y1="196" x2="570" y2="216" stroke="#00A087" stroke-width="5" stroke-linecap="butt"/>
<text x="315" y="180" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#00A087" text-anchor="middle" font-weight="bold">C 完整</text>
<rect x="50" y="410" width="200" height="70" fill="#FFFFFF" rx="12" stroke="#E9E9E5" stroke-width="3"/>
<text x="150" y="456" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#3C5488" text-anchor="middle" font-weight="bold">C = S + D</text>
<rect x="280" y="410" width="270" height="70" fill="#FFFFFF" rx="12" stroke="#E9E9E5" stroke-width="3"/>
<text x="415" y="456" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#3C5488" text-anchor="middle" font-weight="bold">C + F + M = 100%</text>
<rect x="580" y="410" width="180" height="70" fill="#FFFFFF" rx="12" stroke="#E64B35" stroke-width="5"/>
<text x="670" y="456" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#E64B35" text-anchor="middle" font-weight="bold">n = 分母</text>
</svg>
