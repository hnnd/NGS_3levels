<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<rect width="800" height="700" fill="#FAFAF7"/>

<text x="140" y="60" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#33332E" text-anchor="middle" font-weight="bold">筛选后 levels 不缩</text>
<rect x="20" y="84" width="240" height="400" fill="#FFFFFF" rx="8" stroke="#3C5488" stroke-width="4"/>
<line x1="40" y1="430" x2="250" y2="430" stroke="#33332E" stroke-width="3" stroke-linecap="butt"/>
<rect x="60" y="150" width="80" height="280" fill="none" stroke="#E64B35" stroke-width="4" stroke-dasharray="12 9"/>
<rect x="160" y="150" width="80" height="280" fill="#00A087"/>
<text x="200" y="132" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#00A087" text-anchor="middle" font-weight="bold">trt = 4</text>
<text x="100" y="466" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="middle">ctrl</text>
<text x="200" y="466" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle">trt</text>
<text x="140" y="528" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#3C5488" text-anchor="middle" font-weight="bold">nlevels = 2</text>
<text x="400" y="60" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#33332E" text-anchor="middle" font-weight="bold">table() 计数</text>
<rect x="280" y="84" width="240" height="400" fill="#FFFFFF" rx="8" stroke="#3C5488" stroke-width="4"/>
<line x1="310" y1="250" x2="490" y2="250" stroke="#E9E9E5" stroke-width="3" stroke-linecap="butt"/>
<line x1="310" y1="360" x2="490" y2="360" stroke="#E9E9E5" stroke-width="3" stroke-linecap="butt"/>
<text x="400" y="216" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#E64B35" text-anchor="middle" font-weight="bold">ctrl = 0</text>
<text x="400" y="326" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#33332E" text-anchor="middle" font-weight="bold">trt = 4</text>
<text x="660" y="60" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#33332E" text-anchor="middle" font-weight="bold">droplevels() 后剩</text>
<rect x="540" y="84" width="240" height="400" fill="#FFFFFF" rx="8" stroke="#3C5488" stroke-width="4"/>
<line x1="560" y1="430" x2="770" y2="430" stroke="#33332E" stroke-width="3" stroke-linecap="butt"/>
<rect x="620" y="150" width="80" height="280" fill="#00A087"/>
<text x="660" y="132" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#00A087" text-anchor="middle" font-weight="bold">trt = 4</text>
<text x="660" y="466" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle">trt</text>
<text x="660" y="528" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#3C5488" text-anchor="middle" font-weight="bold">nlevels = 1</text>
<rect x="20" y="596" width="760" height="60" fill="#E9E9E5" rx="10"/>
</svg>
