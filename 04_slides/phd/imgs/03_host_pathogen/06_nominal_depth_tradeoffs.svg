<circle cx="102" cy="468" r="28" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="4"/>
<text x="102" y="479" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#4DBBD5" text-anchor="middle" font-weight="bold">2</text>
<text x="152" y="480" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#4DBBD5" text-anchor="start" font-weight="bold">探针捕获带偏好</text>
<rect x="520" y="448" width="200" height="40" fill="#FFFFFF" rx="8" stroke="#4DBBD5" stroke-width="3"/>
