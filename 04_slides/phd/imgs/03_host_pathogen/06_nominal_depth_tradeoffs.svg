<text x="102" y="361" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle" font-weight="bold">1</text>
<text x="152" y="362" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="start" font-weight="bold">高密点接种控同步</text>
<rect x="520" y="330" width="200" height="40" fill="#FFFFFF" rx="8" stroke="#3C5488" stroke-width="3"/>
