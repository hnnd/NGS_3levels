<text x="400" y="240" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#E64B35" text-anchor="middle" font-weight="bold">名义深度超千倍</text>
<rect x="44" y="300" width="712" height="100" fill="#E3E8F2" rx="14" stroke="#3C5488" stroke-width="4"/>
