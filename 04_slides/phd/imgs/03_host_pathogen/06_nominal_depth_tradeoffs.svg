<text x="232" y="106" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#6B6B66" text-anchor="start">/</text>
<text x="262" y="106" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#33332E" text-anchor="start" font-weight="bold">4×10<tspan dy="-0.32em">9</tspan></text>
<text x="78" y="156" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="start">0.41 Gb · 150 bp</text>
<text x="722" y="106" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#E64B35" text-anchor="end" font-weight="bold">732×</text>
