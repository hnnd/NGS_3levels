<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<title>Back-calculating the required depth</title>
<rect width="800" height="700" fill="#FAFAF7"/>

<rect x="50" y="46" width="700" height="92" fill="#FFFFFF" rx="14" stroke="#3C5488" stroke-width="4"/>
<text x="400" y="108" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="36" fill="#3C5488" text-anchor="middle" font-weight="bold">D_used = P / f_P</text>
<text x="126" y="200" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#F39B7F" text-anchor="middle" font-weight="bold">病原需千万读段</text>
<text x="330" y="200" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle" font-weight="bold">占比千分之五</text>
<text x="750" y="200" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="end" font-weight="bold">总归属需二十亿</text>
<line x1="50" y1="220" x2="750" y2="220" stroke="#E9E9E5" stroke-width="4" stroke-linecap="butt"/>
<rect x="52" y="256" width="210" height="80" fill="#FBE6DF" rx="12" stroke="#F39B7F" stroke-width="4"/>
<text x="78" y="307" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#F39B7F" text-anchor="start" font-weight="bold">1×10<tspan dy="-0.32em">7</tspan></text>
<line x1="272" y1="296" x2="306" y2="296" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="306,296 293.2167548356277,301.70864634283396 293.2167548356277,290.29135365716604" fill="#6B6B66"/>
<text x="320" y="307" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="start">÷ 0.005</text>
<rect x="438" y="262" width="107.0" height="68" fill="#3C5488" rx="10"/>
<text x="557.0" y="307" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="start" font-weight="bold">2×10<tspan dy="-0.32em">9</tspan></text>
<rect x="52" y="396" width="210" height="80" fill="#FBE6DF" rx="12" stroke="#F39B7F" stroke-width="4"/>
<text x="78" y="447" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#F39B7F" text-anchor="start" font-weight="bold">2×10<tspan dy="-0.32em">7</tspan></text>
<line x1="272" y1="436" x2="306" y2="436" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="306,436 293.2167548356277,441.70864634283396 293.2167548356277,430.29135365716604" fill="#6B6B66"/>
<text x="320" y="447" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="start">÷ 0.005</text>
<rect x="438" y="402" width="214.0" height="68" fill="#3C5488" rx="10"/>
<text x="664.0" y="447" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="start" font-weight="bold">4×10<tspan dy="-0.32em">9</tspan></text>
<rect x="120" y="556" width="560" height="80" fill="#E64B35" rx="12"/>
<text x="400.0" y="607.2" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">常规预算不可行</text>
</svg>
