<text x="400" y="654" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#E64B35" text-anchor="middle" font-weight="bold">人类阈值严格四十倍自交作物假阴性灾难</text>
<text x="400" y="690" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#00A087" text-anchor="middle" font-weight="bold">建议按有效检验定界</text>
