<line x1="740" y1="162.6135255745225" x2="740" y2="374.8864744254775" stroke="#6B6B66" stroke-width="4" stroke-linecap="round"/>
<polygon points="740,374.8864744254775 734.6991141102255,363.0163182014175 745.3008858897745,363.0163182014175" fill="#6B6B66"/>
