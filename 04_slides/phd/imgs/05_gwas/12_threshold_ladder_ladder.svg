<line x1="200.0" y1="374.8864744254775" x2="560" y2="374.8864744254775" stroke="#00A087" stroke-width="5" stroke-linecap="butt" stroke-dasharray="14 9"/>
<text x="462.5" y="406.8864744254775" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#00A087" text-anchor="start" font-weight="bold">2×10<tspan dy="-11" font-size="21">−6</tspan></text>
<line x1="200.0" y1="547.272948850955" x2="690.0" y2="547.272948850955" stroke="#F39B7F" stroke-width="5" stroke-linecap="butt"/>
