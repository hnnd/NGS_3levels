<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<title>Failure modes redistribute, not disappear</title>
<rect width="800" height="700" fill="#FAFAF7"/>

<polygon points="100,44 700,44 440,306 360,306" fill="#E3E8F2" stroke="#3C5488" stroke-width="4" stroke-linejoin="round"/>
<text x="400" y="100" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle" font-weight="bold">syntax · missing_API · deps</text>
<text x="400" y="196" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle">retries → fewer</text>
<rect x="360" y="306" width="80" height="20" fill="#00A087" rx="4" stroke="#00A087" stroke-width="2"/>
<text x="470" y="322" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#00A087" text-anchor="start" font-weight="bold">residual</text>
<line x1="400" y1="330" x2="400" y2="392" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="400,392 394.29135365716604,379.2167548356277 405.70864634283396,379.2167548356277" fill="#6B6B66"/>
<rect x="140" y="398" width="520" height="132" fill="#F6D8D2" rx="12" stroke="#E64B35" stroke-width="5"/>
<text x="400" y="444" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#E64B35" text-anchor="middle" font-weight="bold">silent_semantic_errors</text>
<text x="400" y="498" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#E64B35" text-anchor="middle">0-based · batch · no FDR · units</text>
<rect x="32.0" y="552" width="736" height="118" fill="#FFFFFF" rx="14" stroke="#E9E9E5" stroke-width="3"/>
<text x="400.0" y="596" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle">智能体消除语法报错，错误向静默语义集中。</text>
<text x="400.0" y="640" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle">验证重心转移，不会消亡。</text>
