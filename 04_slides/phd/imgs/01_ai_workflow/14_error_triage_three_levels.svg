<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<title>Error triage: three levels of danger</title>
<rect width="800" height="700" fill="#FAFAF7"/>

<rect x="36" y="44" width="480" height="118" fill="#D8EEE9" rx="12" stroke="#00A087" stroke-width="3"/>
<text x="62" y="90" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#00A087" text-anchor="start" font-weight="bold">env</text>
<text x="490" y="90" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="end">switch_machine → gone</text>
<text x="62" y="142" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start">command_not_found</text>
<rect x="60" y="176" width="540" height="118" fill="#FBE6DF" rx="12" stroke="#F39B7F" stroke-width="6"/>
<text x="86" y="222" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#F39B7F" text-anchor="start" font-weight="bold">data</text>
<text x="574" y="222" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="end">switch_input → gone</text>
<text x="86" y="274" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start">not integers / NAs</text>
<rect x="84" y="308" width="600" height="118" fill="#F6D8D2" rx="12" stroke="#E64B35" stroke-width="9"/>
<text x="110" y="354" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#E64B35" text-anchor="start" font-weight="bold">logic</text>
<text x="658" y="354" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="end">still_there</text>
<text x="110" y="406" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start">not_full_rank</text>
<line x1="754" y1="74" x2="754" y2="400" stroke="#6B6B66" stroke-width="4" stroke-linecap="round"/>
<polygon points="754,400 748.291353657166,387.2167548356277 759.708646342834,387.2167548356277" fill="#6B6B66"/>
<text x="754" y="434" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#E64B35" text-anchor="middle" font-weight="bold">high</text>
<rect x="32.0" y="470" width="736" height="152" fill="#FFFFFF" rx="14" stroke="#E9E9E5" stroke-width="3"/>
<text x="400.0" y="510" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle">报错三分法：环境层低危，</text>
<text x="400.0" y="552" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle">数据层高危抹杀线索，</text>
<text x="400.0" y="594" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="middle">逻辑层最高危掩盖混杂。</text>
</svg>
