<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<title>Haploid parameter reconstruction</title>
<rect width="800" height="700" fill="#FAFAF7"/>

<rect x="60" y="36" width="680" height="78" fill="#3C5488" rx="12"/>
<text x="400.0" y="86.2" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">单倍体重构四参数</text>
<text x="175" y="152" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#6B6B66" text-anchor="middle" font-weight="bold">2n</text>
<text x="460" y="152" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#6B6B66" text-anchor="middle" font-weight="bold">1n</text>
<rect x="60" y="178" width="230" height="88" fill="#E3E8F2" rx="12" stroke="#3C5488" stroke-width="4"/>
<text x="175" y="234" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle" font-weight="bold">AA / Aa / aa</text>
<line x1="304" y1="222" x2="348" y2="222" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="348,222 336.12984377594,227.3008858897744 336.12984377594,216.6991141102256" fill="#6B6B66"/>
<rect x="360" y="178" width="200" height="88" fill="#E7F5F8" rx="12" stroke="#3C8DAD" stroke-width="4"/>
<text x="460" y="234" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C8DAD" text-anchor="middle" font-weight="bold">0 / 1</text>
<text x="580" y="234" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start" font-weight="bold">无杂合状态</text>
<rect x="60" y="296" width="230" height="88" fill="#E3E8F2" rx="12" stroke="#3C5488" stroke-width="4"/>
<text x="175" y="352" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle" font-weight="bold">θ = 4Neμ</text>
<line x1="304" y1="340" x2="348" y2="340" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="348,340 336.12984377594,345.3008858897744 336.12984377594,334.6991141102256" fill="#6B6B66"/>
<rect x="360" y="296" width="200" height="88" fill="#E7F5F8" rx="12" stroke="#3C8DAD" stroke-width="4"/>
<text x="460" y="352" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C8DAD" text-anchor="middle" font-weight="bold">θ = 2Neμ</text>
<text x="580" y="352" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#E64B35" text-anchor="start" font-weight="bold">突变参数减半</text>
<rect x="60" y="414" width="230" height="88" fill="#E3E8F2" rx="12" stroke="#3C5488" stroke-width="4"/>
<text x="175" y="470" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle" font-weight="bold">HWE</text>
<line x1="304" y1="458" x2="348" y2="458" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="348,458 336.12984377594,463.3008858897744 336.12984377594,452.6991141102256" fill="#6B6B66"/>
<rect x="360" y="414" width="200" height="88" fill="#E7F5F8" rx="12" stroke="#3C8DAD" stroke-width="4"/>
<text x="460" y="470" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C8DAD" text-anchor="middle" font-weight="bold">—</text>
<text x="580" y="470" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start" font-weight="bold">平衡无对象</text>
<rect x="60" y="532" width="230" height="88" fill="#E3E8F2" rx="12" stroke="#3C5488" stroke-width="4"/>
<text x="175" y="588" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="middle" font-weight="bold">1/(2n−1)</text>
<line x1="304" y1="576" x2="348" y2="576" stroke="#6B6B66" stroke-width="5" stroke-linecap="round"/>
<polygon points="348,576 336.12984377594,581.3008858897745 336.12984377594,570.6991141102255" fill="#6B6B66"/>
<rect x="360" y="532" width="200" height="88" fill="#E7F5F8" rx="12" stroke="#3C8DAD" stroke-width="4"/>
<text x="460" y="588" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C8DAD" text-anchor="middle" font-weight="bold">1/n = 0.025</text>
<text x="580" y="588" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start" font-weight="bold">染色体定基线</text>
</svg>
