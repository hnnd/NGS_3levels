<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<title>D, D prime and r squared answer different questions</title>
<rect width="800" height="700" fill="#FAFAF7"/>

<rect x="30" y="44" width="740" height="126" fill="#E3E8F2" rx="14" stroke="#3C5488" stroke-width="4"/>
<circle cx="96" cy="107" r="44" fill="#FFFFFF" stroke="#3C5488" stroke-width="4"/>
<text x="96" y="120" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#3C5488" text-anchor="middle" font-weight="bold">D</text>
<text x="160" y="98" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start">D = p_AB − p_A p_B</text>
<text x="744" y="154" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="end" font-weight="bold">偏离独立期望多少</text>
<rect x="30" y="198" width="740" height="126" fill="#E7F5F8" rx="14" stroke="#3C8DAD" stroke-width="4"/>
<circle cx="96" cy="261" r="44" fill="#FFFFFF" stroke="#3C8DAD" stroke-width="4"/>
<text x="96" y="274" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#3C8DAD" text-anchor="middle" font-weight="bold">D′</text>
<text x="160" y="252" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start">D′ = D / D_max</text>
<text x="744" y="308" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C8DAD" text-anchor="end" font-weight="bold">历史上重组过没有</text>
<rect x="30" y="352" width="740" height="126" fill="#E3E8F2" rx="14" stroke="#3C5488" stroke-width="4"/>
<circle cx="96" cy="415" r="44" fill="#FFFFFF" stroke="#3C5488" stroke-width="4"/>
<text x="96" y="428" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="34" fill="#3C5488" text-anchor="middle" font-weight="bold">r²</text>
<text x="160" y="406" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#33332E" text-anchor="start">r² = D² / (p_A p_a p_B p_b)</text>
<text x="744" y="462" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#3C5488" text-anchor="end" font-weight="bold">替代因果位点程度</text>
<rect x="30" y="500" width="740" height="66" fill="#FFFFFF" rx="12" stroke="#E9E9E5" stroke-width="3"/>
<text x="52" y="545" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#6B6B66" text-anchor="start" font-weight="bold">MAF 0.02 / 0.48 → D′ = 1, r² = 0.0221</text>
<rect x="120" y="594" width="560" height="78" fill="#00A087" rx="12"/>
<text x="400.0" y="644.2" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">只认相关平方</text>
</svg>
