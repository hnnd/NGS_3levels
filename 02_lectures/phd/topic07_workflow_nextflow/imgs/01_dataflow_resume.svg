<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">Nextflow dataflow 与 -resume：只算没算过的</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">process / channel ｜ 内容 hash 缓存 —— 依据 07_workflow_nextflow_lecture.md ④4.2 · ④4.5</text>
  <!-- 图例 -->
  <rect x="926" y="36" width="12" height="12" fill="#00A087"/>
  <text x="946" y="46" font-size="12" fill="#33332E">缓存命中（复用上次结果）</text>
  <rect x="926" y="58" width="12" height="12" fill="#F39B7F"/>
  <text x="946" y="68" font-size="12" fill="#33332E">因上游改动需重算</text>
  <rect x="926" y="80" width="12" height="12" fill="#E64B35"/>
  <text x="946" y="90" font-size="12" fill="#33332E">本次修改的参数 / process</text>
  <rect x="926" y="102" width="12" height="12" fill="#4DBBD5"/>
  <text x="946" y="112" font-size="12" fill="#33332E">channel（数据流）</text>

  <!-- ============ 面板 A：DAG ============ -->
  <rect x="48" y="120" width="704" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="154" font-size="17" font-weight="bold" fill="#3C5488">教学流程的 DAG：改一处，只重算它的下游</text>
  <text x="72" y="176" font-size="12.5" fill="#6B6B66">4×FASTP + 1×SALMON_INDEX + 4×SALMON_QUANT + 1×MERGE（-stub-run 应得 completed=10）</text>
  <line x1="72" y1="190" x2="728" y2="190" stroke="#E9E9E5"/>

  <!-- FASTQ channel -->
  <rect x="88" y="222" width="168" height="56" rx="8" fill="#4DBBD5"/>
  <text x="172" y="246" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FASTQ ×4</text>
  <text x="172" y="265" font-size="10" fill="#FFFFFF" text-anchor="middle">queue channel · 逐样本</text>
  <line x1="256" y1="250" x2="320" y2="250" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="326,250 318,246 318,254" fill="#6B6B66"/>

  <!-- FASTP 任务栈（本次修改） -->
  <rect x="342" y="210" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#E64B35" stroke-width="1.5"/>
  <rect x="336" y="216" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#E64B35" stroke-width="1.5"/>
  <rect x="330" y="222" width="180" height="56" rx="8" fill="#E64B35"/>
  <text x="420" y="246" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FASTP ×4</text>
  <text x="420" y="265" font-size="10" fill="#FFFFFF" text-anchor="middle">逐样本质控</text>
  <line x1="420" y1="278" x2="420" y2="294" stroke="#E64B35" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="320" y="296" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="420" y="316" font-size="11.5" fill="#E64B35" text-anchor="middle">--fastp_qual 30（本次修改）</text>

  <!-- 参考转录组 channel -->
  <rect x="88" y="372" width="168" height="56" rx="8" fill="#4DBBD5"/>
  <text x="172" y="396" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">参考转录组 ×1</text>
  <text x="172" y="415" font-size="10" fill="#FFFFFF" text-anchor="middle">value channel · 可重复消费</text>
  <line x1="256" y1="400" x2="320" y2="400" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="326,400 318,396 318,404" fill="#6B6B66"/>

  <!-- SALMON_INDEX（缓存命中） -->
  <rect x="330" y="372" width="180" height="56" rx="8" fill="#00A087"/>
  <text x="420" y="396" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SALMON_INDEX</text>
  <text x="420" y="415" font-size="10" fill="#DFF3EE" text-anchor="middle">缓存命中 · 复用 work/ 结果</text>

  <!-- 汇入 SALMON_QUANT -->
  <polyline points="510,250 536,250 536,376 550,376" fill="none" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="556,376 548,372 548,380" fill="#6B6B66"/>
  <polyline points="510,400 536,400 536,408 550,408" fill="none" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="556,408 548,404 548,412" fill="#6B6B66"/>
  <text x="534" y="446" font-size="10.5" fill="#6B6B66" text-anchor="middle">索引经 value channel</text>
  <text x="534" y="462" font-size="10.5" fill="#6B6B66" text-anchor="middle">被 N 个样本重复消费</text>

  <!-- SALMON_QUANT 任务栈（需重算） -->
  <rect x="572" y="352" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#F39B7F" stroke-width="1.5"/>
  <rect x="566" y="358" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#F39B7F" stroke-width="1.5"/>
  <rect x="560" y="364" width="160" height="56" rx="8" fill="#F39B7F"/>
  <text x="640" y="388" font-size="12.5" font-weight="bold" fill="#33332E" text-anchor="middle">SALMON_QUANT ×4</text>
  <text x="640" y="407" font-size="10" fill="#33332E" text-anchor="middle">逐样本定量 · 需重算</text>

  <!-- MERGE_COUNTS -->
  <polyline points="640,420 640,486 630,486 630,540" fill="none" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="630,548 626,540 634,540" fill="#6B6B66"/>
  <rect x="540" y="548" width="180" height="60" rx="8" fill="#F39B7F"/>
  <text x="630" y="572" font-size="12.5" font-weight="bold" fill="#33332E" text-anchor="middle">MERGE_COUNTS</text>
  <text x="630" y="591" font-size="10" fill="#33332E" text-anchor="middle">toSortedList 汇总 · 需重算</text>
  <text x="630" y="630" font-size="10" fill="#6B6B66" text-anchor="middle">结果经 publishDir 进 results/</text>

  <!-- 缓存判据注 -->
  <text x="88" y="484" font-size="11" fill="#6B6B66">缓存判据：输入的“内容 hash”，</text>
  <text x="88" y="502" font-size="11" fill="#6B6B66">不是时间戳——touch 一下不会让</text>
  <text x="88" y="520" font-size="11" fill="#6B6B66">任务失效（④4.1），这点比时间戳稳</text>
  <text x="88" y="560" font-size="12.5" fill="#33332E">改 --fastp_qual：FASTP 及其全部下游</text>
  <text x="88" y="580" font-size="12.5" fill="#33332E">重跑（橙），SALMON_INDEX 仍命中（绿）</text>

  <!-- ============ 面板 B：缓存键 ============ -->
  <rect x="776" y="120" width="376" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="800" y="154" font-size="17" font-weight="bold" fill="#3C5488">-resume：缓存键 = 任务 hash</text>
  <text x="800" y="176" font-size="12.5" fill="#6B6B66">任一成分改变 → 该任务及其全部下游重跑</text>
  <line x1="800" y1="190" x2="1128" y2="190" stroke="#E9E9E5"/>

  <!-- 五成分 -->
  <rect x="800" y="212" width="18" height="18" rx="3" fill="#3C5488"/>
  <text x="809" y="226" font-size="11" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="828" y="226" font-size="12.5" fill="#33332E">process 的脚本文本（插值后）</text>
  <rect x="800" y="244" width="18" height="18" rx="3" fill="#3C5488"/>
  <text x="809" y="258" font-size="11" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="828" y="258" font-size="12.5" fill="#33332E">每个输入文件的内容 hash</text>
  <rect x="800" y="276" width="18" height="18" rx="3" fill="#3C5488"/>
  <text x="809" y="290" font-size="11" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="828" y="290" font-size="12.5" fill="#33332E">脚本里实际引用的 params 值</text>
  <rect x="800" y="308" width="18" height="18" rx="3" fill="#3C5488"/>
  <text x="809" y="322" font-size="11" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="828" y="322" font-size="12.5" fill="#33332E">container / conda 声明</text>
  <rect x="800" y="340" width="18" height="18" rx="3" fill="#3C5488"/>
  <text x="809" y="354" font-size="11" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="828" y="354" font-size="12.5" fill="#33332E">bin/ 目录内容</text>
  <text x="800" y="384" font-size="11" fill="#6B6B66">不含 cpus / memory：改资源不触发重跑（④4.5）</text>

  <!-- 为什么 INDEX 仍命中 -->
  <rect x="800" y="404" width="4" height="74" rx="2" fill="#00A087"/>
  <rect x="800" y="404" width="328" height="74" rx="6" fill="#FAFAF7"/>
  <text x="816" y="428" font-size="12" fill="#33332E">为什么改了 fastp_qual，SALMON_INDEX</text>
  <text x="816" y="446" font-size="12" fill="#33332E">仍命中？——该参数不出现在它的脚本里，</text>
  <text x="816" y="464" font-size="12" fill="#33332E">hash 不变（⑤步骤 5 的验收问题）</text>

  <!-- 陷阱 -->
  <rect x="800" y="494" width="4" height="74" rx="2" fill="#F39B7F"/>
  <rect x="800" y="494" width="328" height="74" rx="6" fill="#FAFAF7"/>
  <text x="816" y="518" font-size="12" fill="#33332E">陷阱：汇总用 collect()（无序）→ 输入列表</text>
  <text x="816" y="536" font-size="12" fill="#33332E">每次都不同 → hash 每次都变 → 缓存永不</text>
  <text x="816" y="554" font-size="12" fill="#33332E">命中；汇总必须 toSortedList()（④4.2）</text>

  <!-- 诊断 -->
  <rect x="800" y="584" width="4" height="74" rx="2" fill="#3C5488"/>
  <rect x="800" y="584" width="328" height="74" rx="6" fill="#FAFAF7"/>
  <text x="816" y="608" font-size="12" fill="#33332E">诊断：不改任何东西连跑两次 -resume，</text>
  <text x="816" y="626" font-size="12" fill="#33332E">第二次应全 cached——不等于任务总数，</text>
  <text x="816" y="644" font-size="12" fill="#33332E">缓存就是坏的（⑥）</text>

  <!-- ============ 底部结语 ============ -->
  <rect x="48" y="696" width="4" height="58" rx="2" fill="#3C5488"/>
  <rect x="48" y="696" width="1104" height="58" rx="6" fill="#FAFAF7"/>
  <text x="66" y="718" font-size="12.5" fill="#33332E">断点续跑只算没算过的：hash 没变的任务直接复用 work/&lt;hash&gt;/ 里的结果；改一个 params，只重跑引用它的任务及其下游。</text>
  <text x="66" y="740" font-size="12.5" fill="#33332E">重跑范围由 dataflow 依赖自动推出——不必人工指定“从哪一步接着跑”（③：断点续跑不可靠，正是四堵墙之一）。</text>
  <text x="1152" y="778" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
