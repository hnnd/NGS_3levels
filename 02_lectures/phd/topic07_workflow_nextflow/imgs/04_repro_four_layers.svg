<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">环境可复现 ≠ 分析可复现：容器只锁住四层里的一层</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">conda=换 PATH ｜ container=换整个用户态 —— 依据 07_workflow_nextflow_lecture.md ④4.4</text>
  <!-- 图例 -->
  <rect x="926" y="36" width="12" height="12" fill="#F39B7F"/>
  <text x="946" y="46" font-size="12" fill="#33332E">conda：只换 PATH</text>
  <rect x="926" y="58" width="12" height="12" fill="#00A087"/>
  <text x="946" y="68" font-size="12" fill="#33332E">container：换整个用户态</text>
  <rect x="926" y="80" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="90" font-size="12" fill="#33332E">分析的四层结构</text>
  <rect x="926" y="102" width="12" height="12" fill="#E64B35"/>
  <text x="946" y="112" font-size="12" fill="#33332E">容器无能为力</text>

  <!-- ============ 面板 A：两条指令 ============ -->
  <rect x="48" y="124" width="544" height="556" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="156" font-size="17" font-weight="bold" fill="#3C5488">两条指令各改变什么</text>
  <text x="72" y="178" font-size="12" fill="#6B6B66">可写进同一个 process，由 profile 决定启用哪个</text>
  <line x1="72" y1="192" x2="568" y2="192" stroke="#E9E9E5"/>

  <!-- conda -->
  <text x="72" y="224" font-size="13.5" font-weight="bold" fill="#F39B7F">conda "bioconda::fastp=0.23.4" —— 只改 PATH</text>
  <rect x="72" y="238" width="496" height="120" rx="6" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="84" y="258" font-size="10.5" fill="#6B6B66">宿主机</text>
  <rect x="88" y="266" width="464" height="26" rx="4" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="320" y="284" font-size="11.5" fill="#33332E" text-anchor="middle">PATH 指向 conda 环境——工具换了，系统库没换</text>
  <rect x="88" y="300" width="220" height="44" rx="4" fill="#FAFAF7" stroke="#6B6B66" stroke-dasharray="4 3"/>
  <text x="198" y="318" font-size="11.5" fill="#33332E" text-anchor="middle">宿主系统库 glibc</text>
  <text x="198" y="336" font-size="10.5" fill="#E64B35" text-anchor="middle">仍是宿主的</text>
  <rect x="324" y="300" width="228" height="44" rx="4" fill="#F39B7F"/>
  <text x="438" y="318" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">conda env：fastp 0.23.4</text>
  <text x="438" y="336" font-size="10" fill="#FFFFFF" text-anchor="middle">只覆盖用户态的这一块</text>
  <text x="72" y="382" font-size="11.5" fill="#E64B35">遇到 GLIBC_2.29 not found：conda 无能为力——那是系统库</text>

  <!-- container -->
  <text x="72" y="420" font-size="13.5" font-weight="bold" fill="#00A087">container "…/fastp:0.23.4--h5f740d0_0" —— 换整个用户态</text>
  <rect x="72" y="434" width="496" height="120" rx="6" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="84" y="454" font-size="10.5" fill="#6B6B66">宿主机</text>
  <rect x="88" y="462" width="464" height="52" rx="4" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="320" y="484" font-size="11.5" font-weight="bold" fill="#00A087" text-anchor="middle">镜像自带整个用户态</text>
  <text x="320" y="502" font-size="11" fill="#33332E" text-anchor="middle">系统库 glibc + 工具链 + 全部依赖，一起换掉</text>
  <rect x="88" y="522" width="464" height="24" rx="4" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="320" y="539" font-size="11" fill="#6B6B66" text-anchor="middle">宿主内核（容器与宿主共享）</text>
  <text x="72" y="576" font-size="11.5" fill="#6B6B66">Singularity/Apptainer：无守护进程、以你自己的身份运行，可直接拉 Docker 镜像</text>

  <rect x="72" y="592" width="496" height="68" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="72" y="592" width="4" height="68" rx="2" fill="#3C5488"/>
  <text x="92" y="616" font-size="12" fill="#33332E">同一份流程代码：本机 -profile conda，集群 -profile singularity，</text>
  <text x="92" y="638" font-size="12" fill="#33332E">不用改一行——镜像 tag 必须写死（不是 latest）</text>

  <!-- ============ 面板 B：四层 ============ -->
  <rect x="616" y="124" width="536" height="556" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="640" y="156" font-size="17" font-weight="bold" fill="#3C5488">能被第三方重跑的分析 = 四层 + 引擎</text>
  <text x="640" y="178" font-size="12" fill="#6B6B66">容器解决“软件环境”层，而且解决得最彻底</text>
  <line x1="640" y1="192" x2="1128" y2="192" stroke="#E9E9E5"/>

  <rect x="640" y="210" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="652" y="228" width="20" height="20" rx="4" fill="#3C5488"/>
  <text x="662" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="682" y="234" font-size="12.5" font-weight="bold" fill="#33332E">工作流代码</text>
  <text x="682" y="254" font-size="10.5" fill="#6B6B66">.nf 模块 / main.nf / bin/</text>
  <rect x="640" y="278" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="652" y="296" width="20" height="20" rx="4" fill="#3C5488"/>
  <text x="662" y="311" font-size="11" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="682" y="302" font-size="12.5" font-weight="bold" fill="#33332E">参数与阈值</text>
  <text x="682" y="322" font-size="10.5" fill="#6B6B66">params / conf / 命令行</text>
  <rect x="640" y="346" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="652" y="364" width="20" height="20" rx="4" fill="#3C5488"/>
  <text x="662" y="379" font-size="11" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="682" y="370" font-size="12.5" font-weight="bold" fill="#33332E">参考 / 输入数据</text>
  <text x="682" y="390" font-size="10.5" fill="#6B6B66">参考基因组版本、哪一次下载</text>
  <rect x="640" y="414" width="320" height="56" rx="8" fill="#00A087"/>
  <rect x="652" y="432" width="20" height="20" rx="4" fill="#FFFFFF"/>
  <text x="662" y="447" font-size="11" fill="#00A087" text-anchor="middle">4</text>
  <text x="682" y="438" font-size="12.5" font-weight="bold" fill="#FFFFFF">软件环境</text>
  <text x="682" y="458" font-size="10.5" fill="#DFF3EE">container / conda 声明</text>

  <!-- 括注 -->
  <line x1="972" y1="224" x2="972" y2="388" stroke="#E64B35" stroke-width="1.5"/>
  <line x1="966" y1="224" x2="972" y2="224" stroke="#E64B35" stroke-width="1.5"/>
  <line x1="966" y1="388" x2="972" y2="388" stroke="#E64B35" stroke-width="1.5"/>
  <text x="988" y="296" font-size="11.5" font-weight="bold" fill="#E64B35">容器锁不住</text>
  <text x="988" y="316" font-size="10.5" fill="#E64B35">换了版本、改了阈值，</text>
  <text x="988" y="334" font-size="10.5" fill="#E64B35">容器里的分析照样变</text>
  <line x1="972" y1="428" x2="972" y2="456" stroke="#00A087" stroke-width="1.5"/>
  <line x1="966" y1="428" x2="972" y2="428" stroke="#00A087" stroke-width="1.5"/>
  <line x1="966" y1="456" x2="972" y2="456" stroke="#00A087" stroke-width="1.5"/>
  <text x="988" y="438" font-size="11.5" font-weight="bold" fill="#00A087">容器覆盖</text>
  <text x="988" y="458" font-size="10.5" fill="#00A087">解决得最彻底</text>

  <rect x="640" y="482" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#8491B4" stroke-dasharray="4 3"/>
  <text x="800" y="500" font-size="11.5" font-weight="bold" fill="#8491B4" text-anchor="middle">⑤ 引擎自身（第五层）</text>
  <text x="800" y="518" font-size="10.5" fill="#6B6B66" text-anchor="middle">版本与严格解析器——⑨-1/⑨-2 的坑在这层</text>

  <rect x="640" y="546" width="488" height="38" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="640" y="546" width="4" height="38" rx="2" fill="#3C5488"/>
  <text x="660" y="570" font-size="12" fill="#33332E">交付物四件套：.nf 模块 + conf/ + 容器声明 + 参考数据清单</text>
  <rect x="640" y="590" width="488" height="38" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="640" y="590" width="4" height="38" rx="2" fill="#3C5488"/>
  <text x="660" y="614" font-size="12" fill="#33332E">写死 tag 只是下限：tag 是可变指针，存档要记镜像 digest</text>
  <rect x="640" y="634" width="488" height="38" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="640" y="634" width="4" height="38" rx="2" fill="#E64B35"/>
  <text x="660" y="658" font-size="12" font-weight="bold" fill="#E64B35">环境可复现 ≠ 分析可复现——别把容器声明当成全部</text>

  <!-- ============ 底部结语 ============ -->
  <rect x="48" y="696" width="1104" height="58" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="48" y="696" width="4" height="58" rx="2" fill="#3C5488"/>
  <text x="66" y="718" font-size="12.5" fill="#33332E">排错二分：“本机好好的、集群上坏了”——换一种 profile 还能复现吗？能，问题在代码 / 参数层；只在特定执行方式下出现，问题在环境 / 挂载层。</text>
  <text x="66" y="740" font-size="12.5" fill="#33332E">Docker 与 Singularity 都不在课程环境里（系统级容器运行时，契约 env_exempt_tools 豁免）；无 root 的 HPC 上给你的是 Singularity/Apptainer。</text>
  <text x="1152" y="778" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
