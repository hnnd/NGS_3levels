<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">效应子预测三步：每一步各自漏掉什么</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">SignalP ｜ 跨膜排除 ｜ EffectorP —— 依据 03_host_pathogen_lecture.md ④4.7 / 4.9</text>
  <!-- 图例 -->
  <rect x="940" y="42" width="12" height="12" fill="#00A087"/>
  <text x="960" y="53" font-size="12" fill="#33332E">保留 / 正确做法</text>
  <rect x="1064" y="42" width="12" height="12" fill="#E64B35"/>
  <text x="1084" y="53" font-size="12" fill="#33332E">陷阱 / 红线</text>
  <rect x="940" y="64" width="12" height="12" fill="#F39B7F"/>
  <text x="960" y="75" font-size="12" fill="#33332E">信号肽（将被切除）</text>

  <!-- ============ 面板 1：SignalP ============ -->
  <rect x="48" y="120" width="344" height="380" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="84" cy="152" r="13" fill="#3C5488"/>
  <text x="84" y="157" font-size="13" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="106" y="158" font-size="16" font-weight="bold" fill="#3C5488">SignalP 6.0</text>
  <text x="72" y="186" font-size="12" fill="#6B6B66">假设：效应子走 Sec / Tat 经典分泌通路</text>
  <line x1="72" y1="200" x2="368" y2="200" stroke="#E9E9E5"/>
  <!-- 蛋白条 -->
  <rect x="72" y="220" width="60" height="26" rx="4" fill="#F39B7F"/>
  <text x="102" y="237" font-size="11" fill="#33332E" text-anchor="middle">信号肽</text>
  <rect x="132" y="220" width="236" height="26" rx="4" fill="#3C5488"/>
  <text x="250" y="237" font-size="11" fill="#FFFFFF" text-anchor="middle">成熟蛋白</text>
  <line x1="132" y1="212" x2="132" y2="254" stroke="#6B6B66" stroke-dasharray="3 2"/>
  <text x="132" y="270" font-size="10.5" fill="#6B6B66" text-anchor="middle">切割位点</text>
  <text x="72" y="298" font-size="12.5" fill="#33332E">第一步问：N 端有无可切割的信号肽？</text>
  <!-- 漏掉块 -->
  <rect x="64" y="314" width="312" height="128" rx="6" fill="#FAFAF7"/>
  <text x="80" y="338" font-size="13" font-weight="bold" fill="#33332E">系统性漏掉：</text>
  <text x="80" y="364" font-size="12.5" fill="#33332E">· 非经典分泌（leaderless）整批漏掉</text>
  <text x="80" y="388" font-size="12.5" fill="#33332E">· 真菌效应子里这类占比不低</text>
  <text x="80" y="412" font-size="12.5" fill="#33332E">· 细菌 T3SS 效应子不走 Sec 通路</text>
  <text x="80" y="436" font-size="12.5" font-weight="bold" fill="#33332E">→ 细菌病原在第一步就被排除</text>
  <text x="72" y="470" font-size="11.5" fill="#6B6B66">细菌分泌信号：N 端 15–30 aa，无切割位点</text>

  <!-- 箭头 1 -->
  <line x1="396" y1="310" x2="416" y2="310" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="428,310 416,304 416,316" fill="#4DBBD5"/>

  <!-- ============ 面板 2：跨膜排除 ============ -->
  <rect x="438" y="120" width="344" height="380" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="474" cy="152" r="13" fill="#3C5488"/>
  <text x="474" y="157" font-size="13" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="496" y="158" font-size="16" font-weight="bold" fill="#3C5488">跨膜排除</text>
  <text x="462" y="186" font-size="12" fill="#6B6B66">TMHMM 2.0 / DeepTMHMM / Phobius</text>
  <line x1="462" y1="200" x2="758" y2="200" stroke="#E9E9E5"/>
  <text x="462" y="224" font-size="12.5" fill="#33332E">假设：有跨膜螺旋＝膜蛋白≠分泌型效应子</text>
  <!-- Row A：全长上跑（错） -->
  <text x="462" y="250" font-size="11" fill="#6B6B66">在全长上跑：</text>
  <rect x="462" y="258" width="56" height="22" rx="3" fill="#F39B7F"/>
  <rect x="518" y="258" width="240" height="22" rx="3" fill="#4DBBD5"/>
  <line x1="482" y1="260" x2="498" y2="278" stroke="#E64B35" stroke-width="2.5"/>
  <line x1="498" y1="260" x2="482" y2="278" stroke="#E64B35" stroke-width="2.5"/>
  <text x="462" y="302" font-size="11" fill="#E64B35">信号肽 h 区被判成 TM → 真效应子被扔掉</text>
  <!-- Row B：成熟肽上判（对） -->
  <text x="462" y="330" font-size="11" fill="#6B6B66">正确：先切信号肽，在成熟肽上判：</text>
  <rect x="462" y="338" width="266" height="22" rx="3" fill="#4DBBD5"/>
  <circle cx="744" cy="349" r="10" fill="#00A087"/>
  <path d="M 739 349 L 743 353 L 750 345" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="462" y="382" font-size="11" fill="#00A087">成熟肽无 TM → 保留</text>
  <text x="462" y="410" font-size="13" font-weight="bold" fill="#33332E">陷阱：疏水 h 区本身就像一段跨膜螺旋</text>
  <text x="462" y="438" font-size="13" font-weight="bold" fill="#00A087">正确做法</text>
  <text x="462" y="462" font-size="12.5" fill="#33332E">按 SignalP 切割位点切出成熟肽再判 TM；</text>
  <text x="462" y="486" font-size="12.5" fill="#33332E">或只排除 TM 起点在 60 aa 之后的蛋白</text>

  <!-- 箭头 2 -->
  <line x1="786" y1="310" x2="806" y2="310" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="818,310 806,304 806,316" fill="#4DBBD5"/>

  <!-- ============ 面板 3：EffectorP ============ -->
  <rect x="828" y="120" width="344" height="380" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="864" cy="152" r="13" fill="#3C5488"/>
  <text x="864" y="157" font-size="13" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="886" y="158" font-size="16" font-weight="bold" fill="#3C5488">EffectorP 3.0</text>
  <text x="852" y="186" font-size="12" fill="#6B6B66">输出：效应子后验概率（不是 p 值）</text>
  <line x1="852" y1="200" x2="1148" y2="200" stroke="#E9E9E5"/>
  <text x="852" y="226" font-size="12.5" fill="#33332E">假设：效应子小、富半胱氨酸、缺已知</text>
  <text x="852" y="250" font-size="12.5" fill="#33332E">结构域——画像可被机器学习区分</text>
  <!-- 概率刻度 -->
  <line x1="852" y1="292" x2="1148" y2="292" stroke="#6B6B66" stroke-width="2"/>
  <line x1="852" y1="286" x2="852" y2="298" stroke="#6B6B66" stroke-width="2"/>
  <line x1="966" y1="286" x2="966" y2="298" stroke="#6B6B66" stroke-width="2"/>
  <line x1="1036" y1="286" x2="1036" y2="298" stroke="#6B6B66" stroke-width="2"/>
  <line x1="1148" y1="286" x2="1148" y2="298" stroke="#6B6B66" stroke-width="2"/>
  <text x="852" y="314" font-size="10.5" fill="#6B6B66" text-anchor="middle">0</text>
  <text x="966" y="314" font-size="10.5" fill="#6B6B66" text-anchor="middle">0.5</text>
  <text x="1036" y="314" font-size="10.5" fill="#6B6B66" text-anchor="middle">0.8</text>
  <text x="1148" y="314" font-size="10.5" fill="#6B6B66" text-anchor="middle">1</text>
  <line x1="1036" y1="272" x2="1036" y2="284" stroke="#8491B4" stroke-width="2"/>
  <text x="1036" y="266" font-size="11" fill="#8491B4" text-anchor="middle">更保守的切点</text>
  <text x="852" y="340" font-size="12" fill="#6B6B66">提阈值只是换切点，不产生 FDR 控制</text>
  <!-- 局限块 -->
  <rect x="844" y="356" width="312" height="128" rx="6" fill="#FAFAF7"/>
  <text x="860" y="380" font-size="13" font-weight="bold" fill="#33332E">系统性局限：</text>
  <text x="860" y="406" font-size="12.5" fill="#33332E">· 训练集＝已知效应子，集中在模式病原</text>
  <text x="860" y="430" font-size="12.5" fill="#33332E">· 非模式物种新颖效应子＝画像外失灵</text>
  <text x="860" y="454" font-size="12.5" fill="#33332E">· 阴性预测几乎没有信息量</text>
  <text x="860" y="478" font-size="12.5" font-weight="bold" fill="#33332E">阳性有一定信息量——仅此而已</text>

  <!-- ============ 底部左：三步之后 ============ -->
  <rect x="48" y="524" width="556" height="180" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="554" font-size="14" font-weight="bold" fill="#3C5488">三步之后：合成候选排序表（§5.6）</text>
  <text x="72" y="582" font-size="12.5" fill="#33332E">三证据取交集：侵染期表达强度 ＋ 分泌信号强度 ＋ 物种特异性</text>
  <text x="72" y="606" font-size="12.5" fill="#33332E">交集提高特异性、牺牲敏感性——任意一步漏掉就进不了表</text>
  <text x="72" y="630" font-size="12.5" fill="#33332E">量级自查：分泌组约占蛋白组 5–10%，候选数十至数百</text>
  <text x="72" y="654" font-size="12.5" fill="#33332E">三千个以上＝把全长喂给了 EffectorP 或核酸当蛋白（⑨-E8）</text>
  <text x="72" y="680" font-size="11.5" fill="#6B6B66">"鉴定"要补四类实验：YSST 分泌 ｜ 本氏烟功能 ｜ 定位 ｜ 敲除致病力</text>

  <!-- ============ 底部右：红线 ============ -->
  <rect x="628" y="524" width="544" height="180" rx="10" fill="#FFFFFF" stroke="#E64B35" stroke-width="1.5"/>
  <text x="652" y="554" font-size="14" font-weight="bold" fill="#E64B35">红线：细菌病原不能用这条流水线</text>
  <text x="652" y="582" font-size="12.5" fill="#33332E">T3SS 效应子无经典信号肽；EffectorP 训练集也不含它们</text>
  <text x="652" y="606" font-size="12.5" fill="#33332E">替代：T3SS N 端特征预测 ＋ hrp-box 启动子扫描</text>
  <text x="652" y="630" font-size="12.5" fill="#33332E">　　　　　　＋ 分泌相关基因簇的共线性分析</text>
  <text x="652" y="660" font-size="11.5" fill="#6B6B66">拿真菌分类器筛细菌效应子＝在特征空间里问一个从未训练过的问题</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="740" font-size="15" font-weight="bold" fill="#3C5488">预测不是鉴定：这条流水线产生假设，不产生机制——概率不是 p 值，表要靠实验收尾。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
