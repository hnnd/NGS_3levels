<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">D、D′、r²：三个度量，三个不同的问题</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">有没有重组过 ｜ 携带多少信息 ｜ 半衰距离定设计 —— 依据 04_popgen_lecture.md ④4.4 / ⑦7.3</text>
  <!-- 图例 -->
  <rect x="940" y="42" width="12" height="12" fill="#00A087"/>
  <text x="960" y="53" font-size="12" fill="#33332E">设计纪律</text>
  <rect x="1032" y="42" width="12" height="12" fill="#E64B35"/>
  <text x="1052" y="53" font-size="12" fill="#33332E">易错点</text>

  <!-- ============ 卡片 D ============ -->
  <rect x="48" y="120" width="352" height="196" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="152" font-size="16" font-weight="bold" fill="#3C5488">D</text>
  <text x="72" y="180" font-size="12.5" fill="#33332E">D = p_AB − p_A × p_B</text>
  <line x1="72" y1="194" x2="376" y2="194" stroke="#E9E9E5"/>
  <text x="72" y="220" font-size="12" fill="#33332E">配子频率偏离独立期望多少</text>
  <text x="72" y="244" font-size="12" fill="#33332E">取值范围随等位频率变化——</text>
  <text x="72" y="268" font-size="12" fill="#33332E">位点对之间不可比</text>
  <text x="72" y="296" font-size="11.5" fill="#6B6B66">→ 基本不单独报告</text>

  <!-- ============ 卡片 D′ ============ -->
  <rect x="424" y="120" width="352" height="196" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="448" y="152" font-size="16" font-weight="bold" fill="#3C5488">D′</text>
  <text x="448" y="180" font-size="12.5" fill="#33332E">D′ = D / D_max</text>
  <line x1="448" y1="194" x2="752" y2="194" stroke="#E9E9E5"/>
  <text x="448" y="220" font-size="12" fill="#33332E">回答：有没有发生过重组？</text>
  <text x="448" y="244" font-size="12" fill="#33332E">D′=1：未观测到四种配子全出现</text>
  <text x="448" y="268" font-size="12" fill="#33332E">低频等位＋小样本：系统性偏高</text>
  <text x="448" y="296" font-size="11.5" fill="#6B6B66">→ 适合划单倍型块、推断历史重组</text>

  <!-- ============ 卡片 r² ============ -->
  <rect x="800" y="120" width="352" height="196" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="824" y="152" font-size="16" font-weight="bold" fill="#3C5488">r²</text>
  <text x="824" y="180" font-size="12.5" fill="#33332E">r² = D² / (p_A p_a p_B p_b)</text>
  <line x1="824" y1="194" x2="1128" y2="194" stroke="#E9E9E5"/>
  <text x="824" y="220" font-size="12" fill="#33332E">等位指示变量的相关系数平方</text>
  <text x="824" y="244" font-size="12" fill="#33332E">"知道一个 ≈ 知道另一个"</text>
  <text x="824" y="268" font-size="12" fill="#33332E">GWAS 只认它：样本量放大 1/r² 倍</text>
  <text x="824" y="296" font-size="11.5" fill="#6B6B66">→ 有直接的功效含义</text>

  <!-- ============ 一句话 ============ -->
  <text x="48" y="348" font-size="12.5" fill="#33332E">一句话记住：D′=1 说"这两位点之间没重组过"；r²=1 说"知道一个就等于知道另一个"——前者成立而后者很小，是低频等位的常态。</text>

  <!-- ============ 左下：LD 衰减曲线 ============ -->
  <rect x="48" y="368" width="540" height="300" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="398" font-size="14" font-weight="bold" fill="#3C5488">LD 衰减曲线与半衰距离</text>
  <text x="72" y="420" font-size="11.5" fill="#6B6B66">图注必须写全：样本量 · 分箱宽度 · MAF 阈值——换任一条，读数就变</text>
  <!-- 坐标轴 -->
  <line x1="100" y1="440" x2="100" y2="600" stroke="#6B6B66" stroke-width="1.5"/>
  <line x1="100" y1="600" x2="560" y2="600" stroke="#6B6B66" stroke-width="1.5"/>
  <text x="92" y="452" font-size="11" fill="#6B6B66" text-anchor="end">r²</text>
  <text x="560" y="620" font-size="11" fill="#6B6B66" text-anchor="end">距离（kb）</text>
  <!-- 1/n 基线 -->
  <line x1="100" y1="560" x2="560" y2="560" stroke="#6B6B66" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="556" y="550" font-size="10.5" fill="#6B6B66" text-anchor="end">E[r²] ≈ 1/n（n=30 → 0.033）</text>
  <!-- 衰减曲线 -->
  <polyline points="100,455 120,478 140,497 160,512 180,524 200,533 220,540 240,546 260,550 280,553 300,555 320,556 340,557 360,558 380,559 400,560 440,560 480,560 520,560 560,560"
            fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <!-- 半衰距离 -->
  <line x1="150" y1="508" x2="150" y2="600" stroke="#00A087" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="150" y="618" font-size="11" font-weight="bold" fill="#00A087" text-anchor="middle">半衰距离</text>
  <circle cx="150" cy="508" r="4" fill="#00A087"/>
  <text x="162" y="504" font-size="10.5" fill="#00A087">r² 降到一半</text>
  <text x="72" y="648" font-size="11.5" fill="#E64B35">曲线尾部凭空消失＝忘了 --ld-window-r2 0（⑨-E5）</text>

  <!-- ============ 右下：两个硬指标 ============ -->
  <rect x="612" y="368" width="540" height="300" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="636" y="398" font-size="14" font-weight="bold" fill="#3C5488">LD 决定 GWAS 的两个硬指标</text>
  <text x="636" y="430" font-size="13" font-weight="bold" fill="#3C5488">① 分辨率上限</text>
  <text x="636" y="454" font-size="12.5" fill="#33332E">候选区间 ≈ 显著 SNP 周围 LD 未衰减的范围</text>
  <text x="636" y="478" font-size="12.5" fill="#33332E">半衰 100 kb：一个峰下躺着几十个基因</text>
  <text x="636" y="502" font-size="12.5" fill="#33332E">半衰 1–2 kb：能到基因级，但需极高标记密度</text>
  <text x="636" y="536" font-size="13" font-weight="bold" fill="#3C5488">② 标记密度下限</text>
  <text x="636" y="560" font-size="12.5" fill="#33332E">要让因果位点都有 r² ≥ 0.2 的标记连锁，</text>
  <text x="636" y="584" font-size="12.5" fill="#33332E">标记间距必须小于 r² 降到 0.2 的距离</text>
  <text x="636" y="618" font-size="13" font-weight="bold" fill="#00A087">先算 LD 衰减，再定测序 / 芯片密度——顺序不能反</text>
  <text x="636" y="646" font-size="11.5" fill="#6B6B66">半衰距离是拟合出来的读数：分箱与模型不同，可差 2–3 倍</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="740" font-size="15" font-weight="bold" fill="#3C5488">用标记检测因果位点，有效样本量变成 n·r²——r²=0.5 相当于样本量减半。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
