<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">coalescent 直觉：站在现在往回看</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">合流时间 T ｜ π = 2μE[T] ｜ D 的符号 —— 依据 04_popgen_lecture.md ④4.8 / 4.1</text>
  <!-- 图例 -->
  <rect x="940" y="42" width="12" height="12" fill="#3C5488"/>
  <text x="960" y="53" font-size="12" fill="#33332E">谱系 / 合流</text>
  <rect x="1032" y="42" width="12" height="12" fill="#F39B7F"/>
  <text x="1052" y="53" font-size="12" fill="#33332E">突变刻度</text>
  <rect x="940" y="64" width="12" height="12" fill="#4DBBD5"/>
  <text x="960" y="75" font-size="12" fill="#33332E">频率谱（示意）</text>

  <!-- ============ 左面板：回溯谱系 ============ -->
  <rect x="48" y="120" width="520" height="420" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="152" font-size="16" font-weight="bold" fill="#3C5488">站在现在往回看</text>
  <text x="72" y="176" font-size="12" fill="#6B6B66">两条序列随世代回溯，在过去的某一代"合流"到共同祖先</text>
  <line x1="72" y1="192" x2="544" y2="192" stroke="#E9E9E5"/>
  <!-- 现在基线 -->
  <line x1="90" y1="480" x2="440" y2="480" stroke="#E9E9E5" stroke-width="2"/>
  <!-- 谱系 -->
  <path d="M 110 480 L 110 425 L 150 405" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <path d="M 190 480 L 190 425 L 150 405" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <path d="M 150 405 L 150 330 L 260 255" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <path d="M 330 480 L 330 395 L 370 375" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <path d="M 410 480 L 410 395 L 370 375" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <path d="M 370 375 L 370 320 L 260 255" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <circle cx="150" cy="405" r="4" fill="#3C5488"/>
  <circle cx="370" cy="375" r="4" fill="#3C5488"/>
  <circle cx="260" cy="255" r="5" fill="#3C5488"/>
  <text x="260" y="240" font-size="11" fill="#3C5488" text-anchor="middle">共同祖先</text>
  <text x="110" y="497" font-size="10.5" fill="#6B6B66" text-anchor="middle">序列 1</text>
  <text x="190" y="497" font-size="10.5" fill="#6B6B66" text-anchor="middle">序列 2</text>
  <text x="330" y="497" font-size="10.5" fill="#6B6B66" text-anchor="middle">序列 3</text>
  <text x="410" y="497" font-size="10.5" fill="#6B6B66" text-anchor="middle">序列 4</text>
  <text x="66" y="486" font-size="11" fill="#6B6B66" text-anchor="end">现在</text>
  <!-- 突变刻度 -->
  <rect x="106" y="455" width="8" height="4" fill="#F39B7F"/>
  <rect x="326" y="440" width="8" height="4" fill="#F39B7F"/>
  <rect x="146" y="380" width="8" height="4" fill="#F39B7F"/>
  <rect x="146" y="320" width="8" height="4" fill="#F39B7F"/>
  <rect x="366" y="348" width="8" height="4" fill="#F39B7F"/>
  <text x="122" y="462" font-size="10.5" fill="#F39B7F">突变（示意）</text>
  <!-- T 箭头 -->
  <line x1="480" y1="262" x2="480" y2="473" stroke="#8491B4" stroke-width="2"/>
  <polygon points="480,255 475,267 485,267" fill="#8491B4"/>
  <polygon points="480,480 475,468 485,468" fill="#8491B4"/>
  <text x="480" y="246" font-size="11.5" font-weight="bold" fill="#8491B4" text-anchor="middle">T＝合流时间</text>
  <text x="494" y="278" font-size="10.5" fill="#8491B4">过去</text>
  <text x="494" y="478" font-size="10.5" fill="#8491B4">现在</text>
  <text x="72" y="526" font-size="12" fill="#33332E">一对序列的成对差异数＝两条回溯路径上突变刻度之和</text>

  <!-- ============ 右面板：T 的三种分布 ============ -->
  <rect x="592" y="120" width="560" height="420" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="616" y="152" font-size="16" font-weight="bold" fill="#3C5488">所有统计量都是 T 的函数</text>
  <text x="616" y="176" font-size="12" fill="#6B6B66">三种群体历史，三种 T 的分布——频率谱形状随之改变</text>
  <line x1="616" y1="192" x2="1128" y2="192" stroke="#E9E9E5"/>
  <!-- 行 1：恒定中性 -->
  <rect x="616" y="236" width="14" height="34" fill="#4DBBD5"/>
  <rect x="636" y="244" width="14" height="26" fill="#4DBBD5"/>
  <rect x="656" y="250" width="14" height="20" fill="#4DBBD5"/>
  <rect x="676" y="255" width="14" height="15" fill="#4DBBD5"/>
  <rect x="696" y="259" width="14" height="11" fill="#4DBBD5"/>
  <rect x="716" y="263" width="14" height="7" fill="#4DBBD5"/>
  <line x1="612" y1="270" x2="736" y2="270" stroke="#6B6B66" stroke-width="1.5"/>
  <text x="760" y="230" font-size="13" font-weight="bold" fill="#00A087">恒定群体 ＋ 中性</text>
  <text x="760" y="256" font-size="12" fill="#33332E">E[π] = E[θW] = 4Neμ　→　D ≈ 0</text>
  <line x1="616" y1="296" x2="1128" y2="296" stroke="#E9E9E5"/>
  <!-- 行 2：扩张 -->
  <rect x="616" y="330" width="14" height="46" fill="#4DBBD5"/>
  <rect x="636" y="356" width="14" height="20" fill="#4DBBD5"/>
  <rect x="656" y="364" width="14" height="12" fill="#4DBBD5"/>
  <rect x="676" y="368" width="14" height="8" fill="#4DBBD5"/>
  <rect x="696" y="371" width="14" height="5" fill="#4DBBD5"/>
  <rect x="716" y="373" width="14" height="3" fill="#4DBBD5"/>
  <line x1="612" y1="376" x2="736" y2="376" stroke="#6B6B66" stroke-width="1.5"/>
  <text x="760" y="336" font-size="13" font-weight="bold" fill="#3C5488">群体扩张</text>
  <text x="760" y="362" font-size="12" fill="#33332E">T 小而集中 → π 低、稀有等位多 → D &lt; 0</text>
  <line x1="616" y1="402" x2="1128" y2="402" stroke="#E9E9E5"/>
  <!-- 行 3：收缩/混样 -->
  <rect x="616" y="446" width="14" height="14" fill="#4DBBD5"/>
  <rect x="636" y="438" width="14" height="22" fill="#4DBBD5"/>
  <rect x="656" y="426" width="14" height="34" fill="#4DBBD5"/>
  <rect x="676" y="426" width="14" height="34" fill="#4DBBD5"/>
  <rect x="696" y="438" width="14" height="22" fill="#4DBBD5"/>
  <rect x="716" y="446" width="14" height="14" fill="#4DBBD5"/>
  <line x1="612" y1="460" x2="736" y2="460" stroke="#6B6B66" stroke-width="1.5"/>
  <text x="760" y="440" font-size="13" font-weight="bold" fill="#8491B4">收缩 / 混了分化亚群</text>
  <text x="760" y="466" font-size="12" fill="#33332E">跨亚群配对的 T 深 → π 偏高 → D &gt; 0</text>
  <text x="760" y="490" font-size="11.5" fill="#6B6B66">合并样本杂合缺失＝Wahlund（§7.1）</text>
  <text x="616" y="526" font-size="11" fill="#6B6B66">小图＝频率谱示意：横轴等位频率从稀有到常见，纵轴位点数</text>

  <!-- ============ 底部条：恒等式 ============ -->
  <rect x="48" y="580" width="1104" height="120" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="96" y="640" font-size="20" font-weight="bold" fill="#3C5488">π = 2μ · E[T]</text>
  <text x="96" y="672" font-size="12.5" fill="#33332E">平均成对差异＝两条线在合流前各自积累的突变</text>
  <text x="616" y="620" font-size="12.5" fill="#33332E">扩张把 T 压小（稀有等位多），收缩与分层把 T 拉深（中间频率多）——</text>
  <text x="616" y="646" font-size="12.5" fill="#33332E">§4.1 的"伪装者"表全部由此而来：频谱的一切扭曲，都是 T 的分布变了</text>
  <text x="616" y="676" font-size="12.5" font-weight="bold" fill="#3C5488">这正是"群体历史作用于全基因组，选择作用于局部"的机理根源</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="740" font-size="15" font-weight="bold" fill="#3C5488">D 的绝对值没有意义——有意义的是某窗口在全基因组 D 分布中的分位数。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
