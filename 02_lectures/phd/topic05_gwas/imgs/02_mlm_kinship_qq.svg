  <!-- 隐匿亲缘对标注：对称双格描边 -->
  <rect x="902" y="247" width="30" height="30" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <rect x="803" y="346" width="30" height="30" fill="none" stroke="#3C5488" stroke-width="2.5"/>
  <text x="770" y="518" font-size="12.5" fill="#33332E">对角线（i = j）与隐匿亲缘对 = 深格：同一亚群内的近亲</text>
  <text x="770" y="540" font-size="12.5" fill="#33332E">基因组越像，模型越预期表型像——“因亲缘近而像”</text>
  <text x="770" y="562" font-size="12.5" fill="#33332E">被随机效应吸收，剩下的才归给被检验的 SNP</text>
  <text x="770" y="584" font-size="11.5" fill="#6B6B66">实践：K 用 LD 剪枝集估计，不用全标记集（⑤5.4）</text>
  <text x="770" y="604" font-size="11.5" fill="#6B6B66">Q 吸粗尺度分层，K 吸细尺度亲缘——两者只需很少的 PC</text>

  <!-- ============ 底部结语 ============ -->
  <rect x="48" y="696" width="4" height="58" rx="2" fill="#3C5488"/>
  <rect x="48" y="696" width="1104" height="58" rx="6" fill="#FAFAF7"/>
  <text x="66" y="718" font-size="12.5" fill="#33332E">校正的是“结构造成的像”：不校正 → 系统性膨胀（假阳性）；过度校正 → 与结构共线的真信号被一起吸收（假阴性）——</text>
  <text x="66" y="740" font-size="12.5" fill="#33332E">两类错误方向相反（⑦7.2）。λ 必须与 QQ 图一起报，绝不单独作为“通过”标准。</text>
  <text x="1152" y="778" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
