<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">MLM + 亲缘矩阵 K：把 GWAS 假阳性压回对角线</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">QQ 图整体抬升 vs 尾部抬升 ｜ K 吸收细尺度亲缘 —— 依据 05_gwas_lecture.md ④4.2 · ⑦7.3</text>
  <!-- 图例 -->
  <rect x="926" y="36" width="12" height="12" fill="#E64B35"/>
  <text x="946" y="46" font-size="12" fill="#33332E">不校正（GLM）：膨胀假阳性</text>
  <rect x="926" y="58" width="12" height="12" fill="#00A087"/>
  <text x="946" y="68" font-size="12" fill="#33332E">MLM（Q + K）校正：受控</text>
  <rect x="926" y="80" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="90" font-size="12" fill="#33332E">亲缘高（对角线 i = j 与近亲对）</text>
  <rect x="926" y="102" width="12" height="12" fill="#C9D3E6"/>
  <text x="946" y="112" font-size="12" fill="#33332E">亲缘低</text>

  <!-- ============ 面板 A：QQ 图 ============ -->
  <rect x="48" y="120" width="640" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="154" font-size="17" font-weight="bold" fill="#3C5488">QQ 图：先判断这套 p 值可不可信</text>
  <text x="72" y="176" font-size="12.5" fill="#6B6B66">观测 −log₁₀p 对 期望 −log₁₀p（均匀分布分位数）</text>
  <line x1="72" y1="190" x2="664" y2="190" stroke="#E9E9E5"/>

  <!-- 坐标轴：x 0..8（150..640），y 0..12（570..210） -->
  <line x1="150" y1="210" x2="150" y2="570" stroke="#33332E" stroke-width="1.5"/>
  <line x1="150" y1="570" x2="640" y2="570" stroke="#33332E" stroke-width="1.5"/>
  <text x="150" y="206" font-size="11" fill="#6B6B66">观测 −log₁₀p</text>
  <text x="142" y="573" font-size="9" fill="#6B6B66" text-anchor="end">0</text>
  <text x="142" y="513" font-size="9" fill="#6B6B66" text-anchor="end">2</text>
  <text x="142" y="453" font-size="9" fill="#6B6B66" text-anchor="end">4</text>
  <text x="142" y="393" font-size="9" fill="#6B6B66" text-anchor="end">6</text>
  <text x="142" y="333" font-size="9" fill="#6B6B66" text-anchor="end">8</text>
  <text x="142" y="273" font-size="9" fill="#6B6B66" text-anchor="end">10</text>
  <text x="142" y="213" font-size="9" fill="#6B6B66" text-anchor="end">12</text>
  <line x1="150" y1="510" x2="156" y2="510" stroke="#33332E"/>
  <line x1="150" y1="450" x2="156" y2="450" stroke="#33332E"/>
  <line x1="150" y1="390" x2="156" y2="390" stroke="#33332E"/>
  <line x1="150" y1="330" x2="156" y2="330" stroke="#33332E"/>
  <line x1="150" y1="270" x2="156" y2="270" stroke="#33332E"/>
  <line x1="150" y1="210" x2="156" y2="210" stroke="#33332E"/>
  <text x="150" y="584" font-size="9" fill="#6B6B66" text-anchor="middle">0</text>
  <text x="272" y="584" font-size="9" fill="#6B6B66" text-anchor="middle">2</text>
  <text x="395" y="584" font-size="9" fill="#6B6B66" text-anchor="middle">4</text>
  <text x="517" y="584" font-size="9" fill="#6B6B66" text-anchor="middle">6</text>
  <text x="640" y="584" font-size="9" fill="#6B6B66" text-anchor="middle">8</text>
  <line x1="272" y1="570" x2="272" y2="564" stroke="#33332E"/>
  <line x1="395" y1="570" x2="395" y2="564" stroke="#33332E"/>
  <line x1="517" y1="570" x2="517" y2="564" stroke="#33332E"/>
  <line x1="640" y1="570" x2="640" y2="564" stroke="#33332E"/>
  <text x="395" y="602" font-size="11" fill="#6B6B66" text-anchor="middle">期望 −log₁₀p（均匀分布次序统计量）</text>
  <text x="395" y="620" font-size="11" fill="#6B6B66" text-anchor="middle">λ = median(χ²_obs) / 0.4549——只用中位数，对尾部不敏感</text>

  <!-- 期望线（对角线 y = x） -->
  <line x1="150" y1="570" x2="640" y2="330" stroke="#6B6B66" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="634" y="408" font-size="11" fill="#6B6B66" text-anchor="end">期望线（零假设全成立）</text>

  <!-- 朴素回归（GLM，不校正）：整体抬升 -->
  <polyline points="152,568 211,522 272,483 334,447 395,411 456,378 517,342 579,303 636,268"
            fill="none" stroke="#E64B35" stroke-width="3"/>
  <text x="168" y="420" font-size="13" font-weight="bold" fill="#E64B35">朴素回归（不校正）</text>
  <text x="168" y="440" font-size="12.5" fill="#E64B35">整体抬升：λ ≈ 1.3</text>
  <text x="168" y="460" font-size="12.5" fill="#E64B35">= 假阳性，不是发现</text>

  <!-- MLM（Q + K）：贴回对角线，尾部翘起 -->
  <polyline points="152,569 211,540 272,510 334,480 395,448 456,417 517,384 579,342 636,298"
            fill="none" stroke="#00A087" stroke-width="3"/>
  <text x="430" y="470" font-size="13" font-weight="bold" fill="#00A087">MLM（Q + K）校正后</text>
  <text x="430" y="490" font-size="12.5" fill="#00A087">贴回对角线：λ ≈ 1.0</text>
  <text x="430" y="510" font-size="12.5" fill="#00A087">尾部翘起 = 少量真关联候选</text>
  <line x1="500" y1="458" x2="524" y2="392" stroke="#00A087" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="320" y1="452" x2="318" y2="446" stroke="#E64B35" stroke-width="1"/>

  <text x="72" y="654" font-size="12.5" fill="#33332E">读法纪律：先 QQ、再 λ、最后曼哈顿——顺序不能反（④4.4）</text>

  <!-- ============ 面板 B：亲缘矩阵 K ============ -->
  <rect x="712" y="120" width="440" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="736" y="154" font-size="17" font-weight="bold" fill="#3C5488">K 亲缘矩阵：MLM 的随机效应先验</text>
  <text x="736" y="176" font-size="12.5" fill="#6B6B66">u ~ N(0, Kσ²_g)：个体 × 个体的亲缘关系（⑦7.2）</text>
  <line x1="736" y1="190" x2="1128" y2="190" stroke="#E9E9E5"/>

  <!-- 8×8 亲缘热格：cell 30 gap 3，起点 (770,214) -->
  <text x="770" y="206" font-size="10" fill="#6B6B66">行：个体 i</text>
  <text x="1031" y="206" font-size="10" fill="#6B6B66" text-anchor="end">列：个体 j</text>
