<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">显著 SNP ≠ 因果变异：峰是 LD 的影子</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">连锁不平衡尾 ｜ 孤峰反常 ｜ 候选区间 = 峰 ± LD 半衰距离 —— 依据 05_gwas_lecture.md ③ · ④4.4–4.5 · ⑤5.8</text>
  <!-- 图例 -->
  <polygon points="932,30 936,38 944,38 938,43 940,51 932,46 924,51 926,43 920,38 928,38" fill="#E64B35"/>
  <text x="952" y="45" font-size="12" fill="#33332E">因果变异（通常未被分型）</text>
  <polygon points="932,60 940,68 932,76 924,68" fill="#4DBBD5"/>
  <text x="952" y="72" font-size="12" fill="#33332E">lead SNP（p 值最小的标记）</text>
  <rect x="926" y="86" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="96" font-size="12" fill="#33332E">与 lead 连锁的 SNP（色浅 = r² 低）</text>

  <!-- ============ 面板 A：一段染色体区间 ============ -->
  <rect x="48" y="120" width="680" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="154" font-size="17" font-weight="bold" fill="#3C5488">一段染色体区间：你"显著"的是标记，不是原因</text>
  <text x="72" y="176" font-size="12.5" fill="#6B6B66">stem 高度 = −log10 p（示意）；不透明度 = 与 lead 的 r²（p04 4.4）</text>
  <line x1="72" y1="190" x2="704" y2="190" stroke="#E9E9E5"/>

  <!-- 显著线 -->
  <line x1="90" y1="300" x2="690" y2="300" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="688" y="292" font-size="10.5" fill="#6B6B66" text-anchor="end">曼哈顿显著线（示意）</text>

  <!-- p 值 stems：不透明度随与 lead 的 r² 衰减 -->
  <line x1="130" y1="470" x2="130" y2="462" stroke="#3C5488" stroke-width="5" stroke-opacity="0.06"/>
  <line x1="170" y1="470" x2="170" y2="452" stroke="#3C5488" stroke-width="5" stroke-opacity="0.15"/>
  <line x1="210" y1="470" x2="210" y2="425" stroke="#3C5488" stroke-width="5" stroke-opacity="0.30"/>
  <line x1="250" y1="470" x2="250" y2="365" stroke="#3C5488" stroke-width="5" stroke-opacity="0.80"/>
  <line x1="290" y1="470" x2="290" y2="285" stroke="#3C5488" stroke-width="5" stroke-opacity="0.95"/>
  <line x1="330" y1="470" x2="330" y2="255" stroke="#4DBBD5" stroke-width="6"/>
  <line x1="370" y1="470" x2="370" y2="300" stroke="#3C5488" stroke-width="5" stroke-opacity="0.75"/>
  <line x1="410" y1="470" x2="410" y2="370" stroke="#3C5488" stroke-width="5" stroke-opacity="0.55"/>
  <line x1="450" y1="470" x2="450" y2="420" stroke="#3C5488" stroke-width="5" stroke-opacity="0.35"/>
  <line x1="490" y1="470" x2="490" y2="448" stroke="#3C5488" stroke-width="5" stroke-opacity="0.20"/>
  <line x1="530" y1="470" x2="530" y2="460" stroke="#3C5488" stroke-width="5" stroke-opacity="0.12"/>
  <line x1="570" y1="470" x2="570" y2="464" stroke="#3C5488" stroke-width="5" stroke-opacity="0.08"/>
  <line x1="610" y1="470" x2="610" y2="466" stroke="#3C5488" stroke-width="5" stroke-opacity="0.06"/>

  <!-- lead SNP 菱形与标注 -->
  <polygon points="330,241 340,251 330,261 320,251" fill="#4DBBD5"/>
  <text x="330" y="228" font-size="12.5" font-weight="bold" fill="#3C8DAD" text-anchor="middle">lead SNP：p 值最小，与因果变异 r² ≈ 0.9</text>
  <!-- 超线的簇内邻居 -->
  <text x="290" y="272" font-size="10.5" fill="#6B6B66" text-anchor="middle">LD 内邻居也超线</text>

  <!-- 染色体基线 -->
  <rect x="90" y="466" width="600" height="8" rx="4" fill="#E9E9E5"/>

  <!-- 因果变异（星形，红） -->
  <polygon points="290,474 292.9,482 301.4,482.3 294.8,487.6 297.1,495.7 290,491 282.9,495.7 285.2,487.6 278.6,482.3 287.1,482" fill="#E64B35"/>
  <line x1="283" y1="490" x2="252" y2="520" stroke="#E64B35" stroke-width="1"/>
  <text x="248" y="532" font-size="12" font-weight="bold" fill="#E64B35" text-anchor="end">因果变异</text>
  <text x="248" y="548" font-size="10.5" fill="#E64B35" text-anchor="end">（未被分型或无注释）</text>

  <!-- 单倍型块 -->
  <line x1="250" y1="566" x2="250" y2="574" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="250" y1="570" x2="450" y2="570" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="450" y1="566" x2="450" y2="574" stroke="#3C5488" stroke-width="1.5"/>
  <text x="350" y="592" font-size="11.5" fill="#33332E" text-anchor="middle">单倍型块：一起遗传的一段（p04 4.4 的 r² 高值区）</text>

  <!-- 候选区间 -->
  <line x1="210" y1="616" x2="210" y2="626" stroke="#4DBBD5" stroke-width="3"/>
  <line x1="210" y1="621" x2="530" y2="621" stroke="#4DBBD5" stroke-width="3"/>
  <line x1="530" y1="616" x2="530" y2="626" stroke="#4DBBD5" stroke-width="3"/>
  <text x="370" y="646" font-size="12.5" font-weight="bold" fill="#3C8DAD" text-anchor="middle">候选区间 = lead ± LD 半衰距离（p04 交付的 HALF，⑤5.8）</text>
  <text x="370" y="668" font-size="11.5" fill="#6B6B66" text-anchor="middle">区间内几十个基因是长 LD 物种的物理常态，不是分析没做好（④4.5）</text>

  <!-- ============ 面板 B：连片峰 vs 孤峰 ============ -->
  <rect x="760" y="120" width="392" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="784" y="154" font-size="17" font-weight="bold" fill="#3C5488">两种峰形：连片峰可信，孤峰反常</text>
  <line x1="784" y1="190" x2="1128" y2="190" stroke="#E9E9E5"/>

  <!-- 连片峰 -->
  <text x="784" y="222" font-size="13" font-weight="bold" fill="#00A087">连片峰：可信信号的常见外观</text>
  <text x="784" y="242" font-size="11.5" fill="#6B6B66">峰值周围一批 p 值随 r² 递减的邻居（④4.4）</text>
  <line x1="790" y1="260" x2="1120" y2="260" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1120" y="252" font-size="10" fill="#6B6B66" text-anchor="end">显著线</text>
  <line x1="800" y1="380" x2="800" y2="372" stroke="#00A087" stroke-width="4"/>
  <line x1="812" y1="380" x2="812" y2="368" stroke="#00A087" stroke-width="4"/>
  <line x1="824" y1="380" x2="824" y2="360" stroke="#00A087" stroke-width="4"/>
  <line x1="836" y1="380" x2="836" y2="340" stroke="#00A087" stroke-width="4"/>
  <line x1="848" y1="380" x2="848" y2="305" stroke="#00A087" stroke-width="4"/>
  <line x1="860" y1="380" x2="860" y2="252" stroke="#00A087" stroke-width="5"/>
  <line x1="872" y1="380" x2="872" y2="295" stroke="#00A087" stroke-width="4"/>
  <line x1="884" y1="380" x2="884" y2="330" stroke="#00A087" stroke-width="4"/>
  <line x1="896" y1="380" x2="896" y2="348" stroke="#00A087" stroke-width="4"/>
  <line x1="908" y1="380" x2="908" y2="358" stroke="#00A087" stroke-width="4"/>
  <line x1="920" y1="380" x2="920" y2="364" stroke="#00A087" stroke-width="4"/>
  <line x1="932" y1="380" x2="932" y2="370" stroke="#00A087" stroke-width="4"/>
  <line x1="944" y1="380" x2="944" y2="374" stroke="#00A087" stroke-width="4"/>
  <line x1="956" y1="380" x2="956" y2="376" stroke="#00A087" stroke-width="4"/>
  <line x1="790" y1="380" x2="1120" y2="380" stroke="#33332E" stroke-width="1.2"/>

  <!-- 孤峰 -->
  <text x="784" y="446" font-size="13" font-weight="bold" fill="#E64B35">孤峰：优先怀疑数据有问题</text>
  <line x1="790" y1="480" x2="1120" y2="480" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1120" y="472" font-size="10" fill="#6B6B66" text-anchor="end">显著线</text>
  <line x1="800" y1="600" x2="800" y2="594" stroke="#6B6B66" stroke-width="4"/>
  <line x1="814" y1="600" x2="814" y2="596" stroke="#6B6B66" stroke-width="4"/>
  <line x1="828" y1="600" x2="828" y2="592" stroke="#6B6B66" stroke-width="4"/>
  <line x1="842" y1="600" x2="842" y2="595" stroke="#6B6B66" stroke-width="4"/>
  <line x1="856" y1="600" x2="856" y2="593" stroke="#6B6B66" stroke-width="4"/>
  <line x1="884" y1="600" x2="884" y2="592" stroke="#6B6B66" stroke-width="4"/>
  <line x1="898" y1="600" x2="898" y2="595" stroke="#6B6B66" stroke-width="4"/>
  <line x1="912" y1="600" x2="912" y2="593" stroke="#6B6B66" stroke-width="4"/>
  <line x1="926" y1="600" x2="926" y2="596" stroke="#6B6B66" stroke-width="4"/>
  <line x1="940" y1="600" x2="940" y2="594" stroke="#6B6B66" stroke-width="4"/>
  <line x1="954" y1="600" x2="954" y2="597" stroke="#6B6B66" stroke-width="4"/>
  <line x1="968" y1="600" x2="968" y2="595" stroke="#6B6B66" stroke-width="4"/>
  <line x1="982" y1="600" x2="982" y2="598" stroke="#6B6B66" stroke-width="4"/>
  <line x1="996" y1="600" x2="996" y2="596" stroke="#6B6B66" stroke-width="4"/>
  <line x1="1010" y1="600" x2="1010" y2="599" stroke="#6B6B66" stroke-width="4"/>
  <line x1="870" y1="600" x2="870" y2="466" stroke="#E64B35" stroke-width="5"/>
  <line x1="790" y1="600" x2="1120" y2="600" stroke="#33332E" stroke-width="1.2"/>
  <text x="884" y="458" font-size="11" fill="#E64B35">唯一超线，邻居毫无起色</text>
  <text x="784" y="628" font-size="12" fill="#E64B35">分型错误 / CNV / 比对伪影的概率远大于真信号</text>
  <text x="784" y="650" font-size="11.5" fill="#6B6B66">核查：HWE p · 缺失率 · 等位平衡 · IGV 看比对（④4.4）</text>
  <text x="784" y="672" font-size="11.5" fill="#6B6B66">LD 不为零的区域里，孤峰在统计上本身就是反常的</text>

  <!-- ============ 底部结语 ============ -->
  <rect x="48" y="696" width="4" height="58" rx="2" fill="#3C5488"/>
  <rect x="48" y="696" width="1104" height="58" rx="6" fill="#FAFAF7"/>
  <text x="66" y="718" font-size="12.5" fill="#33332E">显著的是与因果变异连锁的标记：GWAS 回答"哪个区间"，不直接回答"哪个基因"（③ 边界一：关联不是因果）；</text>
  <text x="66" y="740" font-size="12.5" fill="#33332E">阈值同样受 LD 影响：0.05/M 过度惩罚，分母应换成有效独立检验数 Meff——剪枝计数、simpleM 或置换法（④4.3）。</text>
  <text x="1152" y="778" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
