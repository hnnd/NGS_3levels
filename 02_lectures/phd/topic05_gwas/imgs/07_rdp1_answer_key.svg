<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">RDP1：自带"已发表答案"的 GWAS 练习数据</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">413 份种质 × 36,901 SNP ｜ 跑完 GEMMA 与 Zhao 2011 逐 SNP 对照 —— 依据 05_gwas_lecture.md 3.1 · ⑤5.1</text>
  <!-- 图例 -->
  <circle cx="932" cy="35" r="5" fill="#4DBBD5"/>
  <text x="946" y="39" font-size="12" fill="#33332E">逐 SNP 对照（贴对角线）</text>
  <circle cx="932" cy="61" r="5" fill="#6B6B66"/>
  <text x="946" y="65" font-size="12" fill="#33332E">偏离点：回查参数</text>

  <!-- ============ 面板 A：数据规格 ============ -->
  <rect x="48" y="120" width="320" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="154" font-size="17" font-weight="bold" fill="#3C5488">数据规格（⑤5.1 实测）</text>
  <line x1="72" y1="172" x2="344" y2="172" stroke="#E9E9E5"/>
  <rect x="72" y="200" width="10" height="10" fill="#4DBBD5"/>
  <text x="92" y="210" font-size="12.5" fill="#33332E">413 份种质（82 国）</text>
  <rect x="72" y="230" width="10" height="10" fill="#4DBBD5"/>
  <text x="92" y="240" font-size="12.5" fill="#33332E">36,901 个 SNP（QC 后实际使用）</text>
  <rect x="72" y="260" width="10" height="10" fill="#4DBBD5"/>
  <text x="92" y="270" font-size="12.5" fill="#33332E">34 列表型</text>
  <rect x="72" y="290" width="10" height="10" fill="#4DBBD5"/>
  <text x="92" y="300" font-size="12.5" fill="#33332E">.ped/.map 仅 8.5 MB——</text>
  <text x="92" y="320" font-size="12.5" fill="#33332E">一台笔记本跑完整条 GWAS 链</text>
  <line x1="72" y1="348" x2="344" y2="348" stroke="#E9E9E5"/>
  <text x="72" y="380" font-size="12.5" font-weight="bold" fill="#3C5488">配套答案文件</text>
  <text x="72" y="406" font-size="12.5" fill="#33332E">MixedModel_Pval_all.txt：</text>
  <text x="72" y="430" font-size="12.5" fill="#33332E">全部 SNP × 34 性状的已发表</text>
  <text x="72" y="454" font-size="12.5" fill="#33332E">MLM p 值（23 MB）</text>
  <line x1="72" y1="482" x2="344" y2="482" stroke="#E9E9E5"/>
  <text x="72" y="510" font-size="12" fill="#6B6B66">本讲主线数据的出处</text>
  <text x="72" y="532" font-size="12" fill="#6B6B66">（3.1 案例一：Zhao 等 2011，</text>
  <text x="72" y="554" font-size="12" fill="#6B6B66">Nat Commun，⑪）</text>
  <text x="72" y="596" font-size="11.5" fill="#33332E">自带"标准答案"的数据，</text>
  <text x="72" y="618" font-size="11.5" fill="#33332E">自学时可以随时自查对错。</text>

  <!-- ============ 面板 B：自己的链路 ============ -->
  <rect x="400" y="120" width="340" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="424" y="154" font-size="17" font-weight="bold" fill="#3C5488">你自己跑的链路（⑤5.3–5.7）</text>
  <text x="424" y="176" font-size="12.5" fill="#6B6B66">与 p04 同环境 ngs_phd_popgen</text>
  <line x1="424" y1="190" x2="716" y2="190" stroke="#E9E9E5"/>

  <rect x="430" y="214" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="570" y="240" font-size="12.5" font-weight="bold" fill="#3C5488" text-anchor="middle">plink 质控</text>
  <text x="570" y="262" font-size="10.5" fill="#33332E" text-anchor="middle">maf 0.05 · geno 0.1 · mind 0.1 · hwe 1e-6</text>
  <line x1="570" y1="274" x2="570" y2="292" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="570,300 566,292 574,292" fill="#6B6B66"/>

  <rect x="430" y="302" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="570" y="328" font-size="12.5" font-weight="bold" fill="#3C5488" text-anchor="middle">Q：pca.eigenvec 前 4 个 PC</text>
  <text x="570" y="350" font-size="10.5" fill="#33332E" text-anchor="middle">协变量文件首列补 1 作截距（⑨E3）</text>
  <line x1="570" y1="362" x2="570" y2="380" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="570,388 566,380 574,380" fill="#6B6B66"/>

  <rect x="430" y="390" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="570" y="416" font-size="12.5" font-weight="bold" fill="#3C5488" text-anchor="middle">K：LD 剪枝集 → gemma -gk 1</text>
  <text x="570" y="438" font-size="10.5" fill="#33332E" text-anchor="middle">不要用全标记集，长 LD 区会主导（⑤5.4）</text>
  <line x1="570" y1="450" x2="570" y2="468" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="570,476 566,468 574,468" fill="#6B6B66"/>

  <rect x="430" y="478" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="570" y="504" font-size="12.5" font-weight="bold" fill="#3C5488" text-anchor="middle">gemma -lmm 4</text>
  <text x="570" y="526" font-size="10.5" fill="#33332E" text-anchor="middle">报告固定用 p_wald 并写明（⑤5.5）</text>
  <line x1="570" y1="538" x2="570" y2="556" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="570,564 566,556 574,556" fill="#6B6B66"/>

  <rect x="430" y="566" width="280" height="44" rx="8" fill="#4DBBD5"/>
  <text x="570" y="594" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">自己的 −log10(p_wald)，全 SNP</text>

  <!-- ============ 面板 C：对答案 ============ -->
  <rect x="772" y="120" width="380" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="796" y="154" font-size="17" font-weight="bold" fill="#3C5488">对答案：两份 p 值逐 SNP 对照</text>
  <text x="796" y="176" font-size="12.5" fill="#6B6B66">散点为示意，非真实数据</text>
  <line x1="796" y1="190" x2="1128" y2="190" stroke="#E9E9E5"/>

  <line x1="810" y1="220" x2="810" y2="600" stroke="#33332E" stroke-width="1.5"/>
  <line x1="810" y1="600" x2="1120" y2="600" stroke="#33332E" stroke-width="1.5"/>
  <text x="810" y="210" font-size="11" fill="#6B6B66" text-anchor="middle">自己跑的 −log10 p</text>
  <text x="965" y="622" font-size="11" fill="#6B6B66" text-anchor="middle">已发表 −log10 p（Zhao 等 2011）</text>
  <line x1="820" y1="592" x2="1112" y2="300" stroke="#6B6B66" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="830" cy="572" r="4" fill="#4DBBD5"/>
  <circle cx="854" cy="550" r="4" fill="#4DBBD5"/>
  <circle cx="875" cy="528" r="4" fill="#4DBBD5"/>
  <circle cx="896" cy="507" r="4" fill="#4DBBD5"/>
  <circle cx="922" cy="484" r="4" fill="#4DBBD5"/>
  <circle cx="945" cy="456" r="4" fill="#4DBBD5"/>
  <circle cx="966" cy="437" r="4" fill="#4DBBD5"/>
  <circle cx="994" cy="410" r="4" fill="#4DBBD5"/>
  <circle cx="1013" cy="392" r="4" fill="#4DBBD5"/>
  <circle cx="1040" cy="366" r="4" fill="#4DBBD5"/>
  <circle cx="1058" cy="350" r="4" fill="#4DBBD5"/>
  <circle cx="1084" cy="324" r="4" fill="#4DBBD5"/>
  <circle cx="880" cy="550" r="4" fill="#6B6B66" fill-opacity="0.65"/>
  <circle cx="1005" cy="432" r="4" fill="#6B6B66" fill-opacity="0.65"/>
  <text x="965" y="288" font-size="12.5" font-weight="bold" fill="#00A087" text-anchor="middle">贴对角线 = 复现成功</text>
  <text x="796" y="652" font-size="12" font-weight="bold" fill="#E64B35">系统性偏离 ≠ 数据不行：先查三个实测坑</text>
  <text x="796" y="674" font-size="11" fill="#6B6B66">CR 行尾 · ID 按 NSFTVID 匹配 · 表型走 --pheno（⑤5.1）</text>

  <!-- ============ 底部结语 ============ -->
  <rect x="48" y="696" width="4" height="58" rx="2" fill="#3C5488"/>
  <rect x="48" y="696" width="1104" height="58" rx="6" fill="#FAFAF7"/>
  <text x="66" y="718" font-size="12.5" fill="#33332E">它最大的价值是有已发表答案可对——自学场景下最稀缺的东西（⑤5.1）；先复现别人的结果，再谈自己的发现：</text>
  <text x="66" y="740" font-size="12.5" fill="#33332E">同一个群体里，跑偏的往往不是数据，而是行尾、ID 匹配与表型传递这些"工程细节"（⑨E2/E4）。</text>
  <text x="1152" y="778" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
