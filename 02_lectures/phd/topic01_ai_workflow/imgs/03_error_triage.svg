<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">报错三分法：先归类，再听 AI 的修复建议</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">环境问题 ｜ 数据问题 ｜ 逻辑问题 —— 依据 01_ai_workflow_lecture.md ④4.4</text>
  <!-- 图例：危险度 -->
  <text x="918" y="58" font-size="12" fill="#33332E">AI 建议的危险度：</text>
  <rect x="1026" y="46" width="12" height="12" fill="#00A087"/>
  <text x="1044" y="57" font-size="12" fill="#33332E">低</text>
  <rect x="1068" y="46" width="12" height="12" fill="#F39B7F"/>
  <text x="1086" y="57" font-size="12" fill="#33332E">高</text>
  <rect x="1110" y="46" width="12" height="12" fill="#E64B35"/>
  <text x="1128" y="57" font-size="12" fill="#33332E">最高</text>

  <!-- ============ 列 A：环境问题 ============ -->
  <rect x="48" y="120" width="352" height="440" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="72" y="140" width="4" height="22" rx="2" fill="#00A087"/>
  <text x="86" y="158" font-size="17" font-weight="bold" fill="#3C5488">环境问题</text>
  <text x="72" y="186" font-size="12.5" fill="#33332E">判据：换一台机器 / 换一个环境就消失</text>
  <line x1="72" y1="202" x2="376" y2="202" stroke="#E9E9E5"/>

  <text x="72" y="228" font-size="13" font-weight="bold" fill="#33332E">典型报错</text>
  <text x="72" y="252" font-size="11.5" fill="#3C8DAD">command not found</text>
  <text x="72" y="272" font-size="11.5" fill="#3C8DAD">there is no package called 'DESeq2'</text>
  <text x="72" y="292" font-size="11.5" fill="#3C8DAD">cannot allocate vector of size ...</text>

  <text x="72" y="330" font-size="13" font-weight="bold" fill="#33332E">AI 常给的建议</text>
  <text x="72" y="354" font-size="12.5" fill="#33332E">装包 · 换源 · 加内存</text>
  <rect x="72" y="372" width="196" height="28" rx="14" fill="#00A087"/>
  <text x="170" y="391" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">基本可信——但先核对再执行</text>

  <text x="72" y="436" font-size="13" font-weight="bold" fill="#33332E">什么时候这个建议是错的</text>
  <text x="72" y="462" font-size="12.5" fill="#33332E">「把包降级到某版本」之前，</text>
  <text x="72" y="484" font-size="12.5" fill="#33332E">要先确认不是你的输入有问题。</text>
  <text x="72" y="530" font-size="12" fill="#6B6B66">作业报 Rscript: command not found</text>
  <text x="72" y="550" font-size="12" fill="#6B6B66">＝SGE 不继承登录终端的环境（E7）</text>

  <!-- ============ 列 B：数据问题 ============ -->
  <rect x="424" y="120" width="352" height="440" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="448" y="140" width="4" height="22" rx="2" fill="#F39B7F"/>
  <text x="462" y="158" font-size="17" font-weight="bold" fill="#3C5488">数据问题</text>
  <text x="448" y="186" font-size="12.5" fill="#33332E">判据：换一份输入就消失</text>
  <line x1="448" y1="202" x2="752" y2="202" stroke="#E9E9E5"/>

  <text x="448" y="228" font-size="13" font-weight="bold" fill="#33332E">典型报错</text>
  <text x="448" y="252" font-size="11.5" fill="#3C8DAD">some values in assay</text>
  <text x="448" y="270" font-size="11.5" fill="#3C8DAD">are not integers</text>
  <text x="448" y="292" font-size="11.5" fill="#3C8DAD">missing values not allowed in subscripts</text>

  <text x="448" y="330" font-size="13" font-weight="bold" fill="#33332E">AI 常给的建议</text>
  <text x="448" y="354" font-size="12.5" fill="#33332E">round() · na.rm = TRUE · na.omit()</text>
  <rect x="448" y="372" width="150" height="28" rx="14" fill="#F39B7F"/>
  <text x="523" y="391" font-size="12" font-weight="bold" fill="#33332E" text-anchor="middle">高危</text>

  <text x="448" y="436" font-size="13" font-weight="bold" fill="#33332E">什么时候这个建议是错的</text>
  <text x="448" y="462" font-size="12.5" fill="#33332E">round() 把「你喂了 TPM」这个事实抹掉；</text>
  <text x="448" y="484" font-size="12.5" fill="#33332E">na.rm = TRUE 把「上游合并出错」抹掉。</text>
  <text x="448" y="530" font-size="12" fill="#6B6B66">NA 的数量与位置才是诊断信息，</text>
  <text x="448" y="550" font-size="12" fill="#6B6B66">抹掉它等于销毁证据（E9）</text>

  <!-- ============ 列 C：逻辑问题 ============ -->
  <rect x="800" y="120" width="352" height="440" rx="10" fill="#FFFFFF" stroke="#E64B35" stroke-width="1.5"/>
  <rect x="824" y="140" width="4" height="22" rx="2" fill="#E64B35"/>
  <text x="838" y="158" font-size="17" font-weight="bold" fill="#3C5488">逻辑问题</text>
  <text x="824" y="186" font-size="12.5" fill="#33332E">判据：换机器、换数据都还在</text>
  <line x1="824" y1="202" x2="1128" y2="202" stroke="#E9E9E5"/>

  <text x="824" y="228" font-size="13" font-weight="bold" fill="#33332E">典型报错</text>
  <text x="824" y="252" font-size="11.5" fill="#3C8DAD">the model matrix is not full rank</text>
  <text x="824" y="272" font-size="11.5" fill="#3C8DAD">结果表全是 NA · log2FC 全为 0</text>

  <text x="824" y="310" font-size="13" font-weight="bold" fill="#33332E">AI 常给的建议</text>
  <text x="824" y="334" font-size="12.5" fill="#33332E">删掉某个协变量 · 改设计公式</text>
  <rect x="824" y="352" width="244" height="28" rx="14" fill="#E64B35"/>
  <text x="946" y="371" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">最高危——报错消失 ≠ 问题解决</text>

  <text x="824" y="416" font-size="13" font-weight="bold" fill="#33332E">什么时候这个建议是错的</text>
  <text x="824" y="442" font-size="12.5" fill="#33332E">not full rank 的真实含义是</text>
  <text x="824" y="464" font-size="12.5" fill="#33332E">批次与处理完全混杂（L0-6-Q6 的 2×2 表）</text>
  <text x="824" y="490" font-size="12.5" font-weight="bold" fill="#E64B35">删 batch 让它跑通＝把混杂藏起来</text>
  <text x="824" y="530" font-size="12" fill="#6B6B66">这是设计问题不是代码问题：</text>
  <text x="824" y="550" font-size="12" fill="#6B6B66">报告限制，下一批实验交叉安排（E3）</text>

  <!-- ============ 底部：提问模板 ============ -->
  <rect x="48" y="584" width="1104" height="112" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="72" y="604" width="4" height="20" rx="2" fill="#3C5488"/>
  <text x="86" y="620" font-size="14" font-weight="bold" fill="#3C5488">正确的提问模板——缺一条，AI 的回答质量就明显下降</text>
  <rect x="72"  y="638" width="200" height="40" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="172" y="663" font-size="12" fill="#33332E" text-anchor="middle">① 完整 traceback（不是最后一行）</text>
  <rect x="288" y="638" width="200" height="40" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="388" y="663" font-size="12" fill="#33332E" text-anchor="middle">② sessionInfo / conda list（版本）</text>
  <rect x="504" y="638" width="200" height="40" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="604" y="663" font-size="12" fill="#33332E" text-anchor="middle">③ 输入的 dim / str / head</text>
  <rect x="720" y="638" width="200" height="40" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="820" y="663" font-size="12" fill="#33332E" text-anchor="middle">④ 我已经排除了什么</text>
  <rect x="936" y="638" width="192" height="40" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="1032" y="663" font-size="12" fill="#33332E" text-anchor="middle">⑤ 我期望的输出是什么</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="740" font-size="15" font-weight="bold" fill="#3C5488">AI 的建议若只让报错消失、没有改变任何数字的含义，它多半是错的——报错是唯一免费的质检员。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
