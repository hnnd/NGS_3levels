<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">三步验证法：成本从低到高，覆盖从粗到细</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">维度语义自检 ｜ 已知答案回归测试 ｜ 关键中间量手算复核 —— 依据 01_ai_workflow_lecture.md ④4.3</text>
  <!-- 图例 -->
  <rect x="850" y="46" width="12" height="12" fill="#3C5488"/>
  <text x="868" y="57" font-size="12" fill="#33332E">步骤动作</text>
  <rect x="946" y="46" width="12" height="12" fill="#4DBBD5"/>
  <text x="964" y="57" font-size="12" fill="#33332E">一行实现</text>
  <rect x="1042" y="46" width="12" height="12" fill="#00A087"/>
  <text x="1060" y="57" font-size="12" fill="#33332E">执行时机</text>
  <rect x="850" y="68" width="12" height="12" fill="#E64B35"/>
  <text x="868" y="79" font-size="12" fill="#33332E">关键警示（唯一红区）</text>

  <!-- ============ 左侧成本轴 ============ -->
  <line x1="84" y1="150" x2="84" y2="600" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="84,612 78,600 90,600" fill="#6B6B66"/>
  <text transform="rotate(-90 66 380)" x="66" y="380" font-size="12.5" fill="#6B6B66" text-anchor="middle">成本低 · 覆盖粗　→　成本高 · 覆盖细</text>

  <!-- ============ 步骤 ① ============ -->
  <rect x="110" y="130" width="1040" height="150" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="152" cy="176" r="22" fill="#3C5488"/>
  <text x="152" y="183" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="190" y="170" font-size="17" font-weight="bold" fill="#3C5488">维度与语义自检</text>
  <rect x="352" y="152" width="88" height="24" rx="12" fill="none" stroke="#00A087" stroke-width="1.5"/>
  <text x="396" y="169" font-size="12" font-weight="bold" fill="#00A087" text-anchor="middle">永远做</text>
  <text x="190" y="198" font-size="12.5" fill="#33332E">看形状、类型、取值域、行列名对不对得上——只看数据本身，不跑分析</text>
  <text x="190" y="226" font-size="12" fill="#3C8DAD">dim(cts) · range(cts) · all(colnames(cts) == rownames(coldata))</text>
  <text x="190" y="248" font-size="12" fill="#3C8DAD">table(cts %% 1 == 0)   # 取值是否全为整数</text>
  <rect x="790" y="152" width="330" height="106" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="806" y="178" font-size="12.5" font-weight="bold" fill="#33332E">不通过说明什么</text>
  <text x="806" y="204" font-size="12" fill="#33332E">取值有小数 → 不是 raw counts</text>
  <text x="806" y="228" font-size="12" fill="#33332E">行列名对不上 → 样本错位</text>

  <!-- ============ 步骤 ② ============ -->
  <rect x="110" y="298" width="1040" height="150" rx="10" fill="#FFFFFF" stroke="#E64B35" stroke-width="1.5"/>
  <circle cx="152" cy="344" r="22" fill="#3C5488"/>
  <text x="152" y="351" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="190" y="338" font-size="17" font-weight="bold" fill="#3C5488">已知答案的小样本回归测试</text>
  <rect x="440" y="320" width="150" height="24" rx="12" fill="none" stroke="#00A087" stroke-width="1.5"/>
  <text x="515" y="337" font-size="12" font-weight="bold" fill="#00A087" text-anchor="middle">有已知答案时做</text>
  <text x="190" y="366" font-size="12.5" fill="#33332E">挑出真实差异已知的基因看能否召回；互换组标签看 log2FC 是否整体变号</text>
  <text x="190" y="394" font-size="12" fill="#3C8DAD">sum(res[spike_in, "padj"] &lt; 0.05)    # 召回应 ≥ 18 / 20</text>
  <text x="190" y="416" font-size="12" fill="#3C8DAD">cor(lfc_原, lfc_换标签)              # 应 ≈ −1（符号翻转）</text>
  <rect x="190" y="430" width="4" height="14" rx="2" fill="#E64B35"/>
  <text x="202" y="442" font-size="12.5" font-weight="bold" fill="#E64B35">唯一能抓住「方向反了」这类无症状错误的步骤，也是最容易被跳过的一步</text>
  <rect x="790" y="320" width="330" height="106" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="806" y="346" font-size="12.5" font-weight="bold" fill="#33332E">不通过说明什么</text>
  <text x="806" y="372" font-size="12" fill="#33332E">召回率低 → 流程有实质缺陷</text>
  <text x="806" y="396" font-size="12" fill="#33332E">符号不翻转 → contrast 或参考水平写错</text>

  <!-- ============ 步骤 ③ ============ -->
  <rect x="110" y="466" width="1040" height="150" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="152" cy="512" r="22" fill="#3C5488"/>
  <text x="152" y="519" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="190" y="506" font-size="17" font-weight="bold" fill="#3C5488">关键中间量手算复核</text>
  <rect x="388" y="488" width="206" height="24" rx="12" fill="none" stroke="#00A087" stroke-width="1.5"/>
  <text x="491" y="505" font-size="12" font-weight="bold" fill="#00A087" text-anchor="middle">只对写进论文的数字做</text>
  <text x="190" y="534" font-size="12.5" fill="#33332E">对 1–2 个基因手算 CPM 与 BH 校正边界，核对 resultsNames() 的字面</text>
  <text x="190" y="562" font-size="12" fill="#3C8DAD">resultsNames(dds)   # 字面必须与你想要的方向一致</text>
  <text x="190" y="584" font-size="12" fill="#3C8DAD">min(res$padj)  与  sort(res$pvalue)[1] * nrow(res)  应同量级</text>
  <rect x="790" y="488" width="330" height="106" rx="8" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="806" y="514" font-size="12.5" font-weight="bold" fill="#33332E">不通过说明什么</text>
  <text x="806" y="540" font-size="12" fill="#33332E">名字写着 ctrl_vs_treat 而你以为相反</text>
  <text x="806" y="564" font-size="12" fill="#33332E">→ 第 2 类错误（方向搞反）现形</text>

  <!-- ============ 底部成本提示 ============ -->
  <rect x="110" y="640" width="4" height="52" rx="2" fill="#3C5488"/>
  <rect x="110" y="640" width="1040" height="52" rx="6" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="130" y="662" font-size="12.5" fill="#33332E">第 ② 步要求事先准备一个已知答案——约半小时。这半小时是本讲要说服你付出的成本：</text>
  <text x="130" y="682" font-size="12.5" font-weight="bold" fill="#3C5488">已知答案必须产生于被检验流程之外（spike-in 规则一），阳性之外必须配阴性（规则三）。</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="740" font-size="15" font-weight="bold" fill="#3C5488">「会写代码」与「会判断代码对不对」在 AI 之后已经分家——本讲训练的是后者。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
