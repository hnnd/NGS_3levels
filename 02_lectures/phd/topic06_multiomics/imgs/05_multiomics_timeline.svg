<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">多组学方法四十年：从组成性数据到深度生成模型</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">只画讲义 ⑪ 收录的节点 ｜ bulk 层主力仍是潜因子族 —— 依据 06_multiomics_lecture.md ④4.8–4.10 · ⑪</text>
  <!-- 图例 -->
  <circle cx="932" cy="41" r="7" fill="#3C5488"/>
  <text x="946" y="45" font-size="12" fill="#33332E">统计与网络基础</text>
  <circle cx="932" cy="65" r="7" fill="#00A087"/>
  <text x="946" y="69" font-size="12" fill="#33332E">潜变量整合族（本讲主推）</text>
  <circle cx="932" cy="89" r="7" fill="#F39B7F"/>
  <text x="946" y="93" font-size="12" fill="#33332E">单细胞深度生成模型</text>

  <!-- ============ 主轴 ============ -->
  <line x1="100" y1="430" x2="1112" y2="430" stroke="#3C5488" stroke-width="3"/>
  <polygon points="1130,430 1112,423 1112,437" fill="#3C5488"/>
  <text x="1130" y="452" font-size="11" fill="#6B6B66" text-anchor="end">时间</text>

  <!-- 1982 上（蓝） -->
  <line x1="130" y1="420" x2="130" y2="352" stroke="#3C5488" stroke-width="1.5"/>
  <circle cx="130" cy="430" r="8" fill="#3C5488"/>
  <text x="130" y="338" font-size="15" font-weight="bold" fill="#3C5488" text-anchor="middle">1982</text>
  <text x="130" y="316" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">组成性数据统计</text>
  <text x="130" y="296" font-size="11" fill="#6B6B66" text-anchor="middle">Aitchison：CLR 的</text>
  <text x="130" y="280" font-size="11" fill="#6B6B66" text-anchor="middle">理论根（④4.4）</text>

  <!-- 2007 下（蓝） -->
  <line x1="240" y1="440" x2="240" y2="492" stroke="#3C5488" stroke-width="1.5"/>
  <circle cx="240" cy="430" r="8" fill="#3C5488"/>
  <text x="240" y="512" font-size="15" font-weight="bold" fill="#3C5488" text-anchor="middle">2007</text>
  <text x="240" y="534" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">MSI 注释置信分级</text>
  <text x="240" y="554" font-size="11" fill="#6B6B66" text-anchor="middle">Sumner 等 L1–L4（④4.5）</text>

  <!-- 2008 上（蓝） -->
  <line x1="350" y1="420" x2="350" y2="352" stroke="#3C5488" stroke-width="1.5"/>
  <circle cx="350" cy="430" r="8" fill="#3C5488"/>
  <text x="350" y="338" font-size="15" font-weight="bold" fill="#3C5488" text-anchor="middle">2008</text>
  <text x="350" y="316" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">WGCNA</text>
  <text x="350" y="296" font-size="11" fill="#6B6B66" text-anchor="middle">加权网络 + 无标度准则</text>
  <text x="350" y="280" font-size="11" fill="#6B6B66" text-anchor="middle">（2005 框架，④4.7）</text>

  <!-- 2011 下（蓝） -->
  <line x1="460" y1="440" x2="460" y2="492" stroke="#3C5488" stroke-width="1.5"/>
  <circle cx="460" cy="430" r="8" fill="#3C5488"/>
  <text x="460" y="512" font-size="15" font-weight="bold" fill="#3C5488" text-anchor="middle">2011</text>
  <text x="460" y="534" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">GGM 代谢网络</text>
  <text x="460" y="554" font-size="11" fill="#6B6B66" text-anchor="middle">偏相关重建反应链（④4.9）</text>

  <!-- 2018/2020 上（绿） -->
  <line x1="570" y1="420" x2="570" y2="352" stroke="#00A087" stroke-width="1.5"/>
  <circle cx="570" cy="430" r="8" fill="#00A087"/>
  <text x="570" y="338" font-size="15" font-weight="bold" fill="#00A087" text-anchor="middle">2018 / 2020</text>
  <text x="570" y="316" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">MOFA / MOFA+</text>
  <text x="570" y="296" font-size="11" fill="#6B6B66" text-anchor="middle">跨组学共享潜因子；</text>
  <text x="570" y="280" font-size="11" fill="#6B6B66" text-anchor="middle">+ 版面向多视图小样本（④4.8）</text>

  <!-- 2019 下（绿） -->
  <line x1="680" y1="440" x2="680" y2="492" stroke="#00A087" stroke-width="1.5"/>
  <circle cx="680" cy="430" r="8" fill="#00A087"/>
  <text x="680" y="512" font-size="15" font-weight="bold" fill="#00A087" text-anchor="middle">2019</text>
  <text x="680" y="534" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">DIABLO</text>
  <text x="680" y="554" font-size="11" fill="#6B6B66" text-anchor="middle">有监督整合，与 MOFA 互补（④4.8）</text>

  <!-- 2021 上（橙） -->
  <line x1="790" y1="420" x2="790" y2="352" stroke="#F39B7F" stroke-width="1.5"/>
  <circle cx="790" cy="430" r="8" fill="#F39B7F"/>
  <text x="790" y="338" font-size="15" font-weight="bold" fill="#33332E" text-anchor="middle">2021</text>
  <text x="790" y="316" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">totalVI</text>
  <text x="790" y="296" font-size="11" fill="#6B6B66" text-anchor="middle">深度生成模型入场，</text>
  <text x="790" y="280" font-size="11" fill="#6B6B66" text-anchor="middle">scvi-tools 框架（④4.10）</text>

  <!-- 2022 下（绿） -->
  <line x1="900" y1="440" x2="900" y2="492" stroke="#00A087" stroke-width="1.5"/>
  <circle cx="900" cy="430" r="8" fill="#00A087"/>
  <text x="900" y="512" font-size="15" font-weight="bold" fill="#00A087" text-anchor="middle">2022</text>
  <text x="900" y="534" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">MEFISTO</text>
  <text x="900" y="554" font-size="11" fill="#6B6B66" text-anchor="middle">时间 / 空间协变量因子（④4.8）</text>

  <!-- 2023 上（橙） -->
  <line x1="1010" y1="420" x2="1010" y2="352" stroke="#F39B7F" stroke-width="1.5"/>
  <circle cx="1010" cy="430" r="8" fill="#F39B7F"/>
  <text x="1010" y="338" font-size="15" font-weight="bold" fill="#33332E" text-anchor="middle">2023</text>
  <text x="1010" y="316" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">MultiVI</text>
  <text x="1010" y="296" font-size="11" fill="#6B6B66" text-anchor="middle">天然配对模态 +</text>
  <text x="1010" y="280" font-size="11" fill="#6B6B66" text-anchor="middle">缺失模态插补（④4.10）</text>

  <!-- 2024→ 轴末提示 -->
  <text x="1100" y="404" font-size="11" fill="#6B6B66" text-anchor="end">单细胞多模态时代</text>

  <!-- ============ 底部结语 ============ -->
  <rect x="48" y="640" width="4" height="58" rx="2" fill="#3C5488"/>
  <rect x="48" y="640" width="1104" height="58" rx="6" fill="#FAFAF7"/>
  <text x="66" y="662" font-size="12.5" fill="#33332E">变了的是前提：Multiome 这类平台的配对性由硬件保证——"两层是否同一批样本"在单细胞层面被解决（④4.10）；</text>
  <text x="66" y="684" font-size="12.5" fill="#33332E">bulk 层 15–50 样本的问题，MOFA2 与晚期整合仍是对的工具；数万细胞的 Multiome 数据才轮到 totalVI / MultiVI。</text>
  <text x="1152" y="740" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
