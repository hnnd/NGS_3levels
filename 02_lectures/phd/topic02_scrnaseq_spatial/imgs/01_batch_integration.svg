  <!-- ============ 底部三条纪律 ============ -->
  <rect x="48" y="598" width="4" height="24" rx="2" fill="#3C5488"/>
  <text x="64" y="615" font-size="12.5" fill="#33332E">整合输出的是校正后坐标，不改表达矩阵——差异表达仍要用原始 / 归一化表达值</text>
  <rect x="48" y="632" width="4" height="24" rx="2" fill="#E64B35"/>
  <text x="64" y="649" font-size="12.5" font-weight="bold" fill="#E64B35">“混得越匀越好”是错的判据——过度校正会把处理特异的细胞状态并进邻近簇（§4.7）</text>
  <rect x="48" y="666" width="4" height="24" rx="2" fill="#3C5488"/>
  <text x="64" y="683" font-size="12.5" fill="#33332E">诊断：整合前后各画一次 UMAP，分别按 batch 与 condition 上色；批次×处理完全混杂时，任何整合都救不了</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="740" font-size="15" font-weight="bold" fill="#3C5488">判读永远先于整合：先看清批次效应有多大、混在谁身上，再决定要不要整合。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
