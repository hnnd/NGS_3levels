  <line x1="452" y1="210" x2="452" y2="618" stroke="#6B6B66" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- 轨道 A：注释 -->
  <text x="64" y="178" font-size="11" font-weight="bold" fill="#3C5488">① 注释轨道</text>
  <text x="64" y="194" font-size="9.5" fill="#6B6B66">mygenome.igv.gff</text>
  <path d="M 240 170 L 456 170 L 470 184 L 456 198 L 240 198 Z" fill="#3C5488"/>
  <text x="352" y="188" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">gyrB</text>
  <rect x="640" y="178" width="34" height="12" fill="#3C5488"/>
  <text x="657" y="174" font-size="9" fill="#3C5488" text-anchor="middle">tRNA</text>
  <line x1="48" y1="210" x2="784" y2="210" stroke="#E9E9E5"/>

  <!-- 轨道 B：覆盖度 -->
  <text x="64" y="236" font-size="11" font-weight="bold" fill="#33332E">② 覆盖度轨道</text>
  <text x="64" y="252" font-size="9.5" fill="#6B6B66">柱高 = 测序深度</text>
  <text x="300" y="228" font-size="9.5" fill="#00A087">深度均匀 ≈ 正常</text>
  <text x="480" y="226" font-size="9.5" fill="#E64B35">彩色分层 = 部分 reads 与参考不一致（可疑变异）</text>
  <line x1="452" y1="230" x2="452" y2="256" stroke="#E64B35" stroke-width="1"/>
  <rect x="240" y="250" width="8" height="66" fill="#E9E9E5" stroke="#6B6B66" stroke-width="0.6"/>
