  <text x="64" y="144" font-size="11" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" fill="#33332E">contig_1:12,345–13,456</text>
  <text x="768" y="144" font-size="10" fill="#6B6B66" text-anchor="end">位置框输入 gyrB 可直接跳转</text>

