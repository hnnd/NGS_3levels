  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">IGV 窗口怎么读：每条轨道各看什么</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">参考序列 ｜ 覆盖度 ｜ 比对 —— 依据 07_annotation_igv_lecture.md ④4.3、⑤5.5–5.6</text>
  <!-- 图例 -->
  <rect x="840" y="42" width="12" height="12" fill="#3C5488"/>
  <text x="860" y="52" font-size="12" fill="#33332E">注释特征（GFF 轨道）</text>
  <rect x="840" y="59" width="12" height="12" fill="#E9E9E5" stroke="#6B6B66" stroke-width="0.8"/>
