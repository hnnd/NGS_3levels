<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">注释如何连到病害：TAL effector → SWEET 机理链</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">TAL effector ｜ UPT box ｜ SWEET 糖转运 —— 依据 07_annotation_igv_lecture.md ③3.1</text>
  <!-- 图例 -->
  <rect x="926" y="46" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="57" font-size="12" fill="#33332E">病原 / 结构</text>
  <rect x="926" y="68" width="12" height="12" fill="#4DBBD5"/>
  <text x="946" y="79" font-size="12" fill="#33332E">DNA / 序列</text>
  <rect x="926" y="90" width="12" height="12" fill="#8491B4"/>
  <text x="946" y="101" font-size="12" fill="#33332E">水稻响应</text>
  <rect x="926" y="112" width="12" height="12" fill="#E64B35"/>
  <text x="946" y="123" font-size="12" fill="#33332E">感病（关键终点）</text>
  <rect x="926" y="134" width="12" height="12" fill="#00A087"/>
  <text x="946" y="145" font-size="12" fill="#33332E">抗病对照</text>

  <!-- ============ 分区标签 ============ -->
  <text x="152" y="152" font-size="11.5" fill="#6B6B66" text-anchor="middle">病原端（Xoo 白叶枯病菌）</text>
  <line x1="56" y1="160" x2="248" y2="160" stroke="#E9E9E5" stroke-width="1"/>
  <text x="712" y="152" font-size="11.5" fill="#6B6B66" text-anchor="middle">水稻端（启动子 → 感病表型）</text>
  <line x1="280" y1="160" x2="1144" y2="160" stroke="#E9E9E5" stroke-width="1"/>

  <!-- ============ 机理链 5 节点 ============ -->
  <!-- 节点 1 -->
  <rect x="56" y="180" width="192" height="118" rx="10" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <text x="152" y="208" font-size="14" font-weight="bold" fill="#3C5488" text-anchor="middle">TAL effector 蛋白</text>
  <line x1="68" y1="220" x2="236" y2="220" stroke="#E9E9E5"/>
  <text x="152" y="244" font-size="11" fill="#33332E" text-anchor="middle">Xoo 注入水稻细胞</text>
  <text x="152" y="264" font-size="11" fill="#33332E" text-anchor="middle">冒充转录因子</text>
  <text x="152" y="284" font-size="11" fill="#33332E" text-anchor="middle">中部 34 aa 串联重复</text>
  <line x1="250" y1="239" x2="272" y2="239" stroke="#6B6B66" stroke-width="2"/>
  <polygon points="272,234 272,244 280,239" fill="#6B6B66"/>
  <!-- 节点 2 -->
  <rect x="280" y="180" width="192" height="118" rx="10" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="2"/>
  <text x="376" y="208" font-size="14" font-weight="bold" fill="#3C8DAD" text-anchor="middle">识别启动子 UPT box</text>
  <line x1="292" y1="220" x2="460" y2="220" stroke="#E9E9E5"/>
  <text x="376" y="244" font-size="11" fill="#33332E" text-anchor="middle">结合水稻 SWEET 启动子</text>
  <text x="376" y="264" font-size="11" fill="#33332E" text-anchor="middle">每个重复 2 个可变氨基酸</text>
  <text x="376" y="284" font-size="11" fill="#33332E" text-anchor="middle">对应 1 个特定碱基</text>
  <line x1="474" y1="239" x2="496" y2="239" stroke="#6B6B66" stroke-width="2"/>
  <polygon points="496,234 496,244 504,239" fill="#6B6B66"/>
  <!-- 节点 3 -->
  <rect x="504" y="180" width="192" height="118" rx="10" fill="#FFFFFF" stroke="#8491B4" stroke-width="2"/>
  <text x="600" y="208" font-size="14" font-weight="bold" fill="#8491B4" text-anchor="middle">SWEET 基因表达上调</text>
  <line x1="516" y1="220" x2="684" y2="220" stroke="#E9E9E5"/>
  <text x="600" y="244" font-size="11" fill="#33332E" text-anchor="middle">糖转运基因被激活</text>
  <text x="600" y="264" font-size="11" fill="#33332E" text-anchor="middle">转录水平显著上调</text>
  <text x="600" y="284" font-size="11" fill="#33332E" text-anchor="middle">水稻的“感病基因”</text>
  <line x1="698" y1="239" x2="720" y2="239" stroke="#6B6B66" stroke-width="2"/>
  <polygon points="720,234 720,244 728,239" fill="#6B6B66"/>
  <!-- 节点 4 -->
  <rect x="728" y="180" width="192" height="118" rx="10" fill="#FFFFFF" stroke="#8491B4" stroke-width="2"/>
  <text x="824" y="208" font-size="14" font-weight="bold" fill="#8491B4" text-anchor="middle">糖分外流</text>
  <line x1="740" y1="220" x2="908" y2="220" stroke="#E9E9E5"/>
  <text x="824" y="244" font-size="11" fill="#33332E" text-anchor="middle">糖运到细胞间隙</text>
  <text x="824" y="264" font-size="11" fill="#33332E" text-anchor="middle">恰好喂饱入侵的病菌</text>
  <text x="824" y="284" font-size="11" fill="#33332E" text-anchor="middle">病菌的“营养入口”</text>
  <line x1="922" y1="239" x2="944" y2="239" stroke="#6B6B66" stroke-width="2"/>
  <polygon points="944,234 944,244 952,239" fill="#6B6B66"/>
  <!-- 节点 5（感病终点） -->
  <rect x="952" y="180" width="192" height="118" rx="10" fill="#E64B35" stroke="#E64B35" stroke-width="2"/>
  <text x="1048" y="209" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">感病</text>
  <line x1="964" y1="221" x2="1132" y2="221" stroke="#F5C0B8"/>
  <text x="1048" y="245" font-size="11" fill="#FFFFFF" text-anchor="middle">白叶枯症状显现</text>
  <text x="1048" y="265" font-size="11" fill="#FFFFFF" text-anchor="middle">糖 = 病菌的营养入口</text>
  <text x="1048" y="285" font-size="9.5" fill="#FDEEEA" text-anchor="middle">Chen et al., 2010, Nature</text>

  <!-- ============ 每一环都是注释问题 ============ -->
  <text x="56" y="352" font-size="14" font-weight="bold" fill="#3C5488">这条链的每一环，都是注释问题</text>
  <rect x="56" y="368" width="340" height="100" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="56" y="368" width="4" height="100" rx="2" fill="#3C5488"/>
  <text x="76" y="398" font-size="13" font-weight="bold" fill="#3C5488">① 结构注释：找出 effector 基因</text>
  <text x="76" y="424" font-size="11.5" fill="#33332E">effector 内部大量近乎重复的单元，</text>
  <text x="76" y="444" font-size="11.5" fill="#33332E">预测器极易截断或漏掉</text>
  <rect x="424" y="368" width="340" height="100" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="424" y="368" width="4" height="100" rx="2" fill="#4DBBD5"/>
  <text x="444" y="398" font-size="13" font-weight="bold" fill="#3C8DAD">② 功能注释：叫出它的名字</text>
  <text x="444" y="424" font-size="11.5" fill="#33332E">把 hypothetical protein 变成</text>
  <text x="444" y="444" font-size="11.5" fill="#33332E">TAL effector，识别密码才有用武之地</text>
  <rect x="792" y="368" width="340" height="100" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="792" y="368" width="4" height="100" rx="2" fill="#8491B4"/>
  <text x="812" y="398" font-size="13" font-weight="bold" fill="#8491B4">③ 注准靶点：育种才有靶子</text>
  <text x="812" y="424" font-size="11.5" fill="#33332E">SWEET 坐标与 UPT box 注释准确，</text>
  <text x="812" y="444" font-size="11.5" fill="#33332E">编辑 UPT box 让 effector 认不出来</text>

  <!-- ============ xa13 对照 ============ -->
  <rect x="56" y="496" width="1088" height="96" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="56" y="496" width="4" height="96" rx="2" fill="#00A087"/>
  <text x="76" y="528" font-size="14" font-weight="bold" fill="#00A087">对照：隐性抗病基因 xa13 为什么抗病？</text>
  <text x="76" y="554" font-size="12.5" fill="#33332E">不是蛋白失活——是 SWEET 基因的启动子变了：effector 认不出结合位点，无法再劫持，糖分不外流</text>
  <text x="76" y="578" font-size="12" fill="#6B6B66">注释准到“启动子上的一个结合位点”，就能解释一个主流抗病品种的原理——机理链最后一环，落在注释精度上</text>

  <!-- ============ 结语 ============ -->
  <text x="48" y="648" font-size="15" font-weight="bold" fill="#3C5488">任何一环注释出错，“病原蛋白 → 靶基因 → 育种靶点”的推理链就断了——而且断得无声无息。</text>
  <text x="1152" y="768" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
