<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">破译 TAL 密码的人：一个规律，两条路径</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">Boch ｜ Moscou &amp; Bogdanove ｜ Chen —— 依据 07_annotation_igv_lecture.md ③3.1、⑪参考资料</text>
  <!-- 图例 -->
  <rect x="840" y="42" width="12" height="12" fill="#3C5488"/>
  <text x="860" y="52" font-size="12" fill="#33332E">研究团队卡</text>
  <rect x="840" y="59" width="12" height="12" fill="#00A087"/>
  <text x="860" y="69" font-size="12" fill="#33332E">独立复现（规律可信）</text>
  <rect x="840" y="76" width="12" height="12" fill="#8491B4"/>
  <text x="860" y="86" font-size="12" fill="#33332E">下游证据（SWEET）</text>

  <!-- ============ 三张团队卡 ============ -->
  <rect x="56" y="140" width="352" height="270" rx="10" fill="#FFFFFF" stroke="#3C5488" stroke-width="1.5"/>
  <text x="80" y="176" font-size="15" font-weight="bold" fill="#3C5488">Boch 等</text>
  <text x="80" y="198" font-size="11" fill="#6B6B66">德国团队 ｜ 2009 · Science</text>
  <line x1="80" y1="212" x2="384" y2="212" stroke="#E9E9E5"/>
  <text x="80" y="240" font-size="12" font-weight="bold" fill="#33332E">贡献：实验破译识别密码</text>
  <text x="80" y="266" font-size="11.5" fill="#33332E">TAL effector 每个重复中两个</text>
  <text x="80" y="286" font-size="11.5" fill="#33332E">可变氨基酸，对应一个特定</text>
  <text x="80" y="306" font-size="11.5" fill="#33332E">碱基——蛋白序列因此可以</text>
  <text x="80" y="326" font-size="11.5" fill="#33332E">反过来预测它绑定的启动子。</text>
  <rect x="80" y="352" width="232" height="36" rx="18" fill="#EAF6F9" stroke="#4DBBD5"/>
  <text x="196" y="375" font-size="10.5" fill="#3C8DAD" text-anchor="middle">Breaking the code…</text>

  <!-- 独立发现 徽章 -->
  <rect x="440" y="252" width="176" height="44" rx="22" fill="#E8F5F2" stroke="#00A087" stroke-width="1.5"/>
  <text x="528" y="270" font-size="11" font-weight="bold" fill="#00A087" text-anchor="middle">同年 · 同刊 · 同一规律</text>
  <text x="528" y="288" font-size="10" fill="#00A087" text-anchor="middle">各自独立推出</text>
  <line x1="410" y1="274" x2="438" y2="274" stroke="#00A087" stroke-width="1.5"/>
  <line x1="618" y1="274" x2="646" y2="274" stroke="#00A087" stroke-width="1.5"/>

  <rect x="648" y="140" width="352" height="270" rx="10" fill="#FFFFFF" stroke="#00A087" stroke-width="1.5"/>
  <text x="672" y="176" font-size="15" font-weight="bold" fill="#00A087">Moscou 与 Bogdanove</text>
  <text x="672" y="198" font-size="11" fill="#6B6B66">美国团队 ｜ 2009 · Science（同期）</text>
  <line x1="672" y1="212" x2="976" y2="212" stroke="#E9E9E5"/>
  <text x="672" y="240" font-size="12" font-weight="bold" fill="#33332E">贡献：独立推出同一规律</text>
  <text x="672" y="266" font-size="11.5" fill="#33332E">A simple cipher governs DNA</text>
  <text x="672" y="286" font-size="11.5" fill="#33332E">recognition by TAL effectors——</text>
  <text x="672" y="306" font-size="11.5" fill="#33332E">两个团队各自独立、同一期发表。</text>
  <text x="672" y="326" font-size="11.5" fill="#33332E">独立复现，规律才立得住。</text>
  <rect x="672" y="352" width="200" height="36" rx="18" fill="#E8F5F2" stroke="#00A087"/>
  <text x="772" y="375" font-size="10.5" fill="#00A087" text-anchor="middle">独立复现 = 可信</text>

  <!-- Chen 卡（下方通栏） -->
  <rect x="56" y="434" width="1096" height="130" rx="10" fill="#FFFFFF" stroke="#8491B4" stroke-width="1.5"/>
  <text x="80" y="468" font-size="15" font-weight="bold" fill="#8491B4">Chen 等</text>
  <text x="170" y="468" font-size="11" fill="#6B6B66">2010 · Nature</text>
  <line x1="80" y1="482" x2="1128" y2="482" stroke="#E9E9E5"/>
  <text x="80" y="508" font-size="12" font-weight="bold" fill="#33332E">贡献：证明 SWEET 糖转运基因是病原的"营养入口"</text>
  <text x="80" y="534" font-size="11.5" fill="#33332E">SWEET 被 TAL effector 激活后把糖运到细胞间隙，恰好喂饱病菌——识别密码（上两张卡）与感病机理，在这条证据上汇合。</text>

  <!-- ============ 结语 ============ -->
  <rect x="56" y="592" width="1096" height="88" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="56" y="592" width="4" height="88" rx="2" fill="#3C5488"/>
  <text x="80" y="622" font-size="13" font-weight="bold" fill="#3C5488">密码 → 预测 → 靶点：这条推理链的每一环都踩在注释上</text>
  <text x="80" y="648" font-size="11.5" fill="#33332E">拿到 effector 蛋白序列即可预测 UPT box、定位靶基因；注释准到启动子上的结合位点，</text>
  <text x="80" y="668" font-size="11.5" fill="#33332E">才能解释 xa13 这类主流抗病品种——功能注释把 hypothetical protein 变成 TAL effector，密码才有用武之地。</text>
  <text x="56" y="712" font-size="10" fill="#6B6B66">研究者肖像无公有领域合规来源，故以贡献卡呈现；生卒年等未注明处不作断言。</text>
  <text x="1152" y="778" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
