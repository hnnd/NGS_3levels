  <circle cx="759" cy="320" r="4" fill="#3C5488"/>
  <circle cx="656" cy="435" r="4" fill="#3C5488"/>
  <!-- Flye 散点 -->
  <circle cx="857" cy="468" r="4" fill="#F39B7F"/>
  <circle cx="889" cy="370" r="4" fill="#F39B7F"/>
  <circle cx="921" cy="419" r="4" fill="#F39B7F"/>
  <circle cx="953" cy="337" r="4" fill="#F39B7F"/>
  <circle cx="873" cy="501" r="4" fill="#F39B7F"/>
  <circle cx="905" cy="386" r="4" fill="#F39B7F"/>
  <circle cx="937" cy="452" r="4" fill="#F39B7F"/>
  <circle cx="968" cy="370" r="4" fill="#F39B7F"/>
  <circle cx="897" cy="304" r="4" fill="#F39B7F"/>
  <circle cx="929" cy="485" r="4" fill="#F39B7F"/>
  <circle cx="984" cy="403" r="4" fill="#F39B7F"/>
  <circle cx="865" cy="353" r="4" fill="#F39B7F"/>
  <circle cx="945" cy="435" r="4" fill="#F39B7F"/>
  <circle cx="913" cy="320" r="4" fill="#F39B7F"/>
  <!-- 几何高亮圈 -->
  <circle cx="735" cy="435" r="9" fill="none" stroke="#00A087" stroke-width="2"/>

  <!-- 标度图例（图内） -->
  <text x="1020" y="250" font-size="10" fill="#6B6B66">Assembler</text>
  <rect x="1020" y="258" width="12" height="12" fill="#3C5488"/>
  <text x="1038" y="268" font-size="11" fill="#33332E">Canu</text>
  <rect x="1020" y="278" width="12" height="12" fill="#F39B7F"/>
  <text x="1038" y="288" font-size="11" fill="#33332E">Flye</text>

  <!-- 引线：五要素 -> 图上部位 -->
  <line x1="428" y1="194" x2="514" y2="176" stroke="#4DBBD5" stroke-width="1.4"/>
  <circle cx="514" cy="176" r="2.5" fill="#4DBBD5"/>
  <line x1="428" y1="296" x2="554" y2="590" stroke="#3C5488" stroke-width="1.4"/>
  <circle cx="554" cy="590" r="2.5" fill="#3C5488"/>
  <line x1="428" y1="398" x2="722" y2="430" stroke="#00A087" stroke-width="1.4"/>
  <circle cx="722" cy="430" r="2.5" fill="#00A087"/>
  <polyline points="428,500 470,500 470,656 996,656 996,300" fill="none" stroke="#D9785A" stroke-width="1.4"/>
  <polygon points="996,290 992,300 1000,300" fill="#D9785A"/>
  <line x1="428" y1="602" x2="548" y2="610" stroke="#8491B4" stroke-width="1.4"/>
  <circle cx="548" cy="610" r="2.5" fill="#8491B4"/>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
