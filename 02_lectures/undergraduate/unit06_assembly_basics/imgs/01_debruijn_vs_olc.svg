<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">两条组装路线：de Bruijn 图 vs OLC</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">k-mer 切碎走图 ｜ read 重叠拼接 —— 依据 06_assembly_basics_lecture.md ④4.4–4.5</text>
  <!-- 图例 -->
  <rect x="926" y="46" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="57" font-size="12" fill="#33332E">节点 / 走线</text>
  <rect x="926" y="68" width="12" height="12" fill="#4DBBD5"/>
  <text x="946" y="79" font-size="12" fill="#33332E">序列 / read</text>
  <rect x="926" y="90" width="12" height="12" fill="#E64B35"/>
  <text x="946" y="101" font-size="12" fill="#33332E">重复区断点</text>

  <!-- ============ 面板 A：de Bruijn 图 ============ -->
  <rect x="48" y="120" width="530" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="154" font-size="17" font-weight="bold" fill="#3C5488">de Bruijn 图（DBG）：切碎再走迷宫</text>
  <text x="72" y="176" font-size="12.5" fill="#6B6B66">碎片统统剪成统一尺寸的 k-mer，再在图上走一条欧拉路径</text>
  <line x1="72" y1="192" x2="554" y2="192" stroke="#E9E9E5"/>

  <text x="72" y="218" font-size="12" font-weight="bold" fill="#33332E">① 一条 read，滑动切成 k-mer（示例 k=5）</text>
  <!-- read 碱基条 -->
  <rect x="72" y="226" width="24" height="24" rx="4" fill="#00A087"/><text x="84" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">A</text>
  <rect x="97" y="226" width="24" height="24" rx="4" fill="#8491B4"/><text x="109" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">T</text>
  <rect x="122" y="226" width="24" height="24" rx="4" fill="#F39B7F"/><text x="134" y="243" font-size="11" fill="#33332E" text-anchor="middle">G</text>
  <rect x="147" y="226" width="24" height="24" rx="4" fill="#4DBBD5"/><text x="159" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">C</text>
  <rect x="172" y="226" width="24" height="24" rx="4" fill="#00A087"/><text x="184" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">A</text>
  <rect x="197" y="226" width="24" height="24" rx="4" fill="#8491B4"/><text x="209" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">T</text>
  <rect x="222" y="226" width="24" height="24" rx="4" fill="#F39B7F"/><text x="234" y="243" font-size="11" fill="#33332E" text-anchor="middle">G</text>
  <rect x="247" y="226" width="24" height="24" rx="4" fill="#4DBBD5"/><text x="259" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">C</text>
  <rect x="272" y="226" width="24" height="24" rx="4" fill="#00A087"/><text x="284" y="243" font-size="11" fill="#FFFFFF" text-anchor="middle">A</text>
  <!-- k-mer 窗口 -->
  <rect x="68" y="222" width="131" height="32" rx="4" fill="none" stroke="#3C5488" stroke-width="1.5"/>
  <text x="320" y="243" font-size="11" fill="#6B6B66">碱基色编码</text>
  <rect x="392" y="231" width="14" height="14" rx="3" fill="#00A087"/>
  <text x="399" y="242" font-size="9" fill="#FFFFFF" text-anchor="middle">A</text>
  <rect x="412" y="231" width="14" height="14" rx="3" fill="#4DBBD5"/>
  <text x="419" y="242" font-size="9" fill="#FFFFFF" text-anchor="middle">C</text>
  <rect x="432" y="231" width="14" height="14" rx="3" fill="#F39B7F"/>
  <text x="439" y="242" font-size="9" fill="#33332E" text-anchor="middle">G</text>
  <rect x="452" y="231" width="14" height="14" rx="3" fill="#8491B4"/>
  <text x="459" y="242" font-size="9" fill="#FFFFFF" text-anchor="middle">T</text>
  <text x="72" y="272" font-size="11" fill="#3C5488">窗口每次右移 1 位：L=9、k=5 → 5 个 k-mer（第 1 个与第 5 个相同，计数 +1）</text>
  <text x="72" y="294" font-size="11" fill="#6B6B66">切碎这个动作主动丢掉了 read 内部的长程连接信息——这是 DBG 断在重复区的根源</text>

  <line x1="150" y1="302" x2="150" y2="316" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="145,316 155,316 150,323" fill="#6B6B66"/>

  <text x="72" y="340" font-size="12" font-weight="bold" fill="#33332E">② 建图：路口 = (k−1)-mer，单行道 = k-mer（小方块）</text>
  <!-- 节点与边 -->
  <line x1="129" y1="376" x2="210" y2="376" stroke="#3C5488" stroke-width="1.5"/>
  <polygon points="210,371 210,381 218,376" fill="#3C5488"/>
  <rect x="167" y="370" width="12" height="12" rx="2" fill="#4DBBD5"/>
  <line x1="254" y1="376" x2="335" y2="376" stroke="#3C5488" stroke-width="1.5"/>
  <polygon points="335,371 335,381 343,376" fill="#3C5488"/>
  <rect x="292" y="370" width="12" height="12" rx="2" fill="#4DBBD5"/>
  <line x1="379" y1="376" x2="460" y2="376" stroke="#3C5488" stroke-width="1.5"/>
  <polygon points="460,371 460,381 468,376" fill="#3C5488"/>
  <rect x="417" y="370" width="12" height="12" rx="2" fill="#4DBBD5"/>
  <circle cx="110" cy="376" r="17" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <text x="110" y="380" font-size="9.5" fill="#3C5488" text-anchor="middle">ATGC</text>
  <circle cx="235" cy="376" r="17" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <text x="235" y="380" font-size="9.5" fill="#3C5488" text-anchor="middle">TGCA</text>
  <circle cx="360" cy="376" r="17" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <text x="360" y="380" font-size="9.5" fill="#3C5488" text-anchor="middle">GCAT</text>
  <circle cx="485" cy="376" r="17" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <text x="485" y="380" font-size="9.5" fill="#3C5488" text-anchor="middle">CATG</text>
  <path d="M 485 395 C 480 434, 115 434, 110 397" fill="none" stroke="#3C5488" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="105,403 115,403 110,394" fill="#3C5488"/>
  <text x="297" y="432" font-size="10.5" fill="#6B6B66" text-anchor="middle">第 4 个 k-mer（CATGC）走回起点：欧拉路径 = 每条单行道恰好走一遍</text>

  <text x="72" y="462" font-size="12" font-weight="bold" fill="#33332E">③ 重复区变“环岛”：所有路径汇入又分出</text>
  <!-- 重复区结构 -->
  <circle cx="110" cy="516" r="14" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <line x1="124" y1="516" x2="166" y2="516" stroke="#3C5488" stroke-width="1.5"/>
  <polygon points="166,512 166,520 173,516" fill="#3C5488"/>
  <rect x="173" y="498" width="130" height="36" rx="8" fill="#FDEEEA" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="238" y="521" font-size="11.5" fill="#E64B35" text-anchor="middle">重复 repeat &gt; k</text>
  <line x1="303" y1="512" x2="378" y2="501" stroke="#3C5488" stroke-width="1.5"/>
  <polygon points="378,497 384,505 376,507" fill="#3C5488"/>
  <line x1="303" y1="522" x2="378" y2="537" stroke="#3C5488" stroke-width="1.5"/>
  <polygon points="378,539 376,531 384,531" fill="#3C5488"/>
  <circle cx="394" cy="498" r="13" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <circle cx="394" cy="540" r="13" fill="#FFFFFF" stroke="#3C5488" stroke-width="2"/>
  <text x="416" y="502" font-size="10.5" fill="#6B6B66">出口 A</text>
  <text x="416" y="544" font-size="10.5" fill="#6B6B66">出口 B</text>
  <text x="72" y="568" font-size="12" fill="#E64B35">出口选哪个无法确定 → contig 在此断开</text>

  <text x="72" y="632" font-size="11.5" fill="#33332E">输入：read 多而短、准确率高（Illumina）｜代表：SPAdes / Velvet / SOAPdenovo</text>
  <text x="72" y="654" font-size="11.5" fill="#33332E">瓶颈：图的规模（内存）｜重复区：只能靠 k 值与配对信息猜</text>

  <!-- ============ 面板 B：OLC ============ -->
  <rect x="622" y="120" width="530" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="646" y="154" font-size="17" font-weight="bold" fill="#3C5488">OLC：Overlap–Layout–Consensus 拼拼图</text>
  <text x="646" y="176" font-size="12.5" fill="#6B6B66">read 保持完整，拿起一片沿边缘找能接上的下一片</text>
  <line x1="646" y1="192" x2="1128" y2="192" stroke="#E9E9E5"/>

  <text x="646" y="218" font-size="12" font-weight="bold" fill="#33332E">① 两两比对找重叠</text>
  <rect x="646" y="226" width="310" height="20" rx="4" fill="#4DBBD5"/>
  <text x="801" y="240" font-size="10.5" fill="#FFFFFF" text-anchor="middle">read A</text>
  <rect x="836" y="254" width="290" height="20" rx="4" fill="#4DBBD5"/>
  <text x="981" y="268" font-size="10.5" fill="#FFFFFF" text-anchor="middle">read B</text>
  <rect x="836" y="222" width="120" height="56" rx="4" fill="none" stroke="#3C5488" stroke-width="1.5"/>
  <text x="896" y="292" font-size="10.5" fill="#3C8DAD" text-anchor="middle">重叠 Overlap：两端能接上</text>
  <line x1="890" y1="298" x2="890" y2="312" stroke="#6B6B66" stroke-width="1.5"/>
  <polygon points="885,312 895,312 890,319" fill="#6B6B66"/>
  <rect x="646" y="324" width="480" height="22" rx="4" fill="#3C5488"/>
  <text x="886" y="339" font-size="11" fill="#FFFFFF" text-anchor="middle">Layout：按重叠排出顺序 → 连成 contig</text>
  <text x="646" y="366" font-size="11.5" fill="#33332E">Consensus：同一区域多片覆盖，少数服从多数定序列（Canu：纠错 → 修剪 → 组装）</text>

  <text x="646" y="394" font-size="12" font-weight="bold" fill="#33332E">② 重复区断点：能不能读穿是关键</text>
  <rect x="646" y="404" width="120" height="22" rx="4" fill="#4DBBD5"/>
  <text x="706" y="419" font-size="10" fill="#FFFFFF" text-anchor="middle">独特</text>
  <rect x="780" y="400" width="180" height="30" rx="8" fill="#FDEEEA" stroke="#E64B35" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="870" y="420" font-size="11" fill="#E64B35" text-anchor="middle">重复 repeat（~5 kb）</text>
  <rect x="974" y="404" width="120" height="22" rx="4" fill="#4DBBD5"/>
  <text x="1034" y="419" font-size="10" fill="#FFFFFF" text-anchor="middle">独特</text>
  <rect x="810" y="442" width="120" height="14" rx="3" fill="#FFFFFF" stroke="#3C8DAD" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="646" y="476" font-size="11" fill="#6B6B66">150 bp 短 read：完全落在重复内部，两端看到的都是重复本身</text>
  <rect x="676" y="488" width="430" height="16" rx="4" fill="#00A087"/>
  <text x="891" y="500" font-size="10" fill="#FFFFFF" text-anchor="middle">15 kb 长 read：左独特 + 重复 + 右独特，一条读穿</text>
  <text x="646" y="528" font-size="12" fill="#E64B35">repeat 比所有 read 都长：没有任何一条能同时看到两侧 → 只能断开</text>
  <text x="646" y="556" font-size="11.5" fill="#6B6B66">细菌 rRNA 操纵子约 5 kb、常有 5–10 个拷贝——15 kb 的 PacBio read 可以直接读穿</text>

  <text x="646" y="632" font-size="11.5" fill="#33332E">输入：read 少而长、可容错（PacBio / Nanopore）｜代表：Canu / Falcon</text>
  <text x="646" y="654" font-size="11.5" fill="#33332E">瓶颈：两两比对（时间）｜重复区：靠 read 长度直接跨越</text>

  <!-- ============ 底部结语 ============ -->
  <rect x="48" y="700" width="4" height="64" rx="2" fill="#3C5488"/>
  <rect x="48" y="700" width="1104" height="64" rx="6" fill="#FAFAF7"/>
  <text x="72" y="726" font-size="15" font-weight="bold" fill="#3C5488">一段重复序列，只要它比你的 read 长，任何算法都无法确定它两侧该怎么连。</text>
  <text x="72" y="750" font-size="12.5" fill="#33332E">DBG 在“重复 &gt; k”处断，OLC 在“重复 &gt; read”处断——重复越长，两条路线都越难跨越。</text>
  <text x="1152" y="768" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
