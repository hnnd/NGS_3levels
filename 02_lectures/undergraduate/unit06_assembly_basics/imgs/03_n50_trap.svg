<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">N50 / L50：算得出连续性，算不出正确性</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">累计过半的那一条 ｜ N50 更高但组装更差的反例 —— 依据 06_assembly_basics_lecture.md ⑥6.3 ｜ ⑩1</text>
  <!-- 图例 -->
  <rect x="926" y="46" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="57" font-size="12" fill="#33332E">contig</text>
  <rect x="1014" y="46" width="12" height="12" fill="#00A087"/>
  <text x="1034" y="57" font-size="12" fill="#33332E">恰好过半那条</text>
  <rect x="926" y="68" width="12" height="12" fill="#F39B7F"/>
  <text x="946" y="79" font-size="12" fill="#33332E">错误连接处</text>
  <rect x="1076" y="68" width="12" height="12" fill="#E64B35"/>
  <text x="1096" y="79" font-size="12" fill="#33332E">警示</text>

  <!-- ============ 左面板：N50 怎么算 ============ -->
  <rect x="48" y="120" width="530" height="450" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="152" font-size="16" font-weight="bold" fill="#3C5488">N50 怎么算：从长到短累计过半</text>
  <text x="72" y="174" font-size="11.5" fill="#6B6B66">5 条 contig：100 / 80 / 50 / 40 / 30 kb，总长 300 kb（⑥6.3）</text>

  <!-- 柱状图 -->
  <rect x="100" y="240" width="70" height="230" fill="#3C5488"/>
  <rect x="192" y="286" width="70" height="184" fill="#00A087"/>
  <rect x="284" y="355" width="70" height="115" fill="#3C5488"/>
  <rect x="376" y="378" width="70" height="92" fill="#3C5488"/>
  <rect x="468" y="401" width="70" height="69" fill="#3C5488"/>
  <text x="135" y="230" font-size="11.5" font-weight="bold" fill="#3C5488" text-anchor="middle">100</text>
  <text x="227" y="276" font-size="11.5" font-weight="bold" fill="#00A087" text-anchor="middle">80</text>
  <text x="319" y="345" font-size="11.5" font-weight="bold" fill="#3C5488" text-anchor="middle">50</text>
  <text x="411" y="368" font-size="11.5" font-weight="bold" fill="#3C5488" text-anchor="middle">40</text>
  <text x="503" y="391" font-size="11.5" font-weight="bold" fill="#3C5488" text-anchor="middle">30</text>
  <line x1="88" y1="470" x2="556" y2="470" stroke="#6B6B66" stroke-width="1.5"/>
  <text x="72" y="416" font-size="10.5" fill="#6B6B66">kb</text>
  <!-- 累计行 -->
  <text x="72" y="494" font-size="10.5" fill="#6B6B66">累计</text>
  <text x="135" y="494" font-size="10.5" fill="#6B6B66" text-anchor="middle">100</text>
  <text x="227" y="494" font-size="10.5" font-weight="bold" fill="#00A087" text-anchor="middle">180</text>
  <text x="319" y="494" font-size="10.5" fill="#6B6B66" text-anchor="middle">230</text>
  <text x="411" y="494" font-size="10.5" fill="#6B6B66" text-anchor="middle">270</text>
  <text x="503" y="494" font-size="10.5" fill="#6B6B66" text-anchor="middle">300</text>

  <!-- N50 标注 -->
  <path d="M 330 240 L 250 268 L 236 282" fill="none" stroke="#00A087" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="330" y="196" width="224" height="70" rx="8" fill="#E4F3EF" stroke="#00A087" stroke-width="1.5"/>
  <text x="344" y="220" font-size="12" fill="#33332E">累计 180 ≥ 总长一半 150</text>
  <text x="344" y="240" font-size="12.5" font-weight="bold" fill="#00A087">→ 第 2 条即 N50 = 80 kb</text>
  <text x="344" y="258" font-size="11.5" fill="#33332E">L50 = 用了 2 条</text>

  <text x="72" y="536" font-size="11.5" fill="#6B6B66">从长到短累加：100（不够）→ 180（够了）——加到哪条越过一半，哪条的长度就是 N50</text>

  <!-- ============ 右面板：反例 ============ -->
  <rect x="602" y="120" width="550" height="450" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="626" y="152" font-size="16" font-weight="bold" fill="#3C5488">反例：N50 翻倍，组装反而错</text>
  <text x="626" y="174" font-size="11.5" fill="#6B6B66">N50 只回答「够不够长」，不回答「拼对了没有」（⑥6.3）</text>

  <!-- 真实 -->
  <text x="626" y="206" font-size="11.5" fill="#6B6B66">真实基因组：两条独立染色体，各 2 Mb</text>
  <rect x="626" y="216" width="190" height="22" fill="#3C5488"/>
  <text x="721" y="231" font-size="10.5" fill="#FFFFFF" text-anchor="middle">染色体 1 · 2 Mb</text>
  <rect x="626" y="244" width="190" height="22" fill="#3C5488"/>
  <text x="721" y="259" font-size="10.5" fill="#FFFFFF" text-anchor="middle">染色体 2 · 2 Mb</text>

  <!-- 组装 A -->
  <text x="626" y="300" font-size="12.5" font-weight="bold" fill="#33332E">组装 A（正确）：2 条 contig，总长 4 Mb</text>
  <rect x="626" y="310" width="190" height="20" fill="#3C5488"/>
  <rect x="626" y="336" width="190" height="20" fill="#3C5488"/>
  <rect x="880" y="310" width="240" height="46" rx="8" fill="#E4F3EF" stroke="#00A087" stroke-width="1.5"/>
  <text x="1000" y="330" font-size="12.5" font-weight="bold" fill="#00A087" text-anchor="middle">N50 = 2 Mb</text>
  <text x="1000" y="348" font-size="11" fill="#33332E" text-anchor="middle">与真实一致：对</text>

  <!-- 组装 B -->
  <text x="626" y="392" font-size="12.5" font-weight="bold" fill="#33332E">组装 B（错误）：在重复区把两条连成一条 4 Mb</text>
  <rect x="626" y="402" width="230" height="20" fill="#3C5488"/>
  <rect x="766" y="402" width="80" height="20" fill="#F39B7F"/>
  <rect x="880" y="399" width="240" height="46" rx="8" fill="#FDF2F0" stroke="#E64B35" stroke-width="1.5"/>
  <text x="1000" y="419" font-size="12.5" font-weight="bold" fill="#E64B35" text-anchor="middle">N50 = 4 Mb</text>
  <text x="1000" y="437" font-size="11" fill="#33332E" text-anchor="middle">数字更好看：错</text>
  <text x="626" y="444" font-size="11" fill="#33332E">橙色段 = 重复区：判断失误处（misassembly）</text>

  <text x="626" y="496" font-size="15" font-weight="bold" fill="#3C5488">B 的 N50 是 A 的两倍，但 B 是错的。</text>
  <text x="626" y="522" font-size="11.5" fill="#6B6B66">这正是「N50 更高但组装更差」的具体情形（⑥6.5 情形二的真实版本）</text>

  <!-- ============ 底部：无参考时的四件套 ============ -->
  <rect x="48" y="590" width="1104" height="150" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="620" font-size="13.5" font-weight="bold" fill="#3C5488">本项目是未知菌株：没有参考，QUAST 的 # misassemblies 一栏是空的——不能只看 N50 做决定，必须四件互相独立的证据：</text>
  <rect x="72" y="636" width="258" height="64" rx="8" fill="#FAFAF7"/>
  <text x="88" y="660" font-size="11.5" font-weight="bold" fill="#3C5488">① BUSCO 完整性（C / S / D）</text>
  <text x="88" y="682" font-size="11" fill="#6B6B66">基因都缺了，contig 再长也没用</text>
  <rect x="346" y="636" width="258" height="64" rx="8" fill="#FAFAF7"/>
  <text x="362" y="660" font-size="11.5" font-weight="bold" fill="#3C5488">② 总长 vs GenomeScope 估计</text>
  <text x="362" y="682" font-size="11" fill="#6B6B66">明显偏小 = 塌缩；偏大 = 冗余 / 污染</text>
  <rect x="620" y="636" width="258" height="64" rx="8" fill="#FAFAF7"/>
  <text x="636" y="660" font-size="11.5" font-weight="bold" fill="#3C5488">③ Flye assembly_info.txt</text>
  <text x="636" y="682" font-size="11" fill="#6B6B66">circ.=Y 环状标记与每条覆盖度</text>
  <rect x="894" y="636" width="234" height="64" rx="8" fill="#FAFAF7"/>
  <text x="910" y="660" font-size="11.5" font-weight="bold" fill="#3C5488">④ 回贴覆盖度均匀性</text>
  <text x="910" y="682" font-size="11" fill="#6B6B66">u05 的 samtools depth：断点处骤降</text>
  <text x="72" y="726" font-size="12" fill="#33332E">动手算（⑩-1）：6 条 contig 500 / 300 / 200 / 150 / 100 / 50 kb，若把最长两条错误连成一条 800 kb——N50 与 L50 各变成多少？</text>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
