<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">MAPQ = 0 意味着什么：匹配满分，定位五选一</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">多重比对 ｜ 位置唯一性 ｜ 只看比对率不够 —— 依据 05_alignment_bam_lecture.md ④4.6 ｜ ⑥6.1 ｜ ⑥6.3</text>
  <!-- 图例 -->
  <rect x="926" y="40" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="51" font-size="12" fill="#33332E">参考基因组</text>
  <rect x="1040" y="40" width="12" height="12" fill="#4DBBD5"/>
  <text x="1060" y="51" font-size="12" fill="#33332E">read</text>
  <rect x="926" y="62" width="12" height="12" fill="#F39B7F"/>
  <text x="946" y="73" font-size="12" fill="#33332E">重复拷贝</text>
  <rect x="1040" y="62" width="12" height="12" fill="#E64B35"/>
  <text x="1060" y="73" font-size="12" fill="#33332E">关键警示</text>

  <!-- ============ 左面板：唯一位置 ============ -->
  <rect x="48" y="120" width="530" height="420" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="152" font-size="17" font-weight="bold" fill="#3C5488">情形一：全基因组只有一个好位置</text>
  <text x="72" y="174" font-size="12.5" fill="#6B6B66">次优位置明显更差 → 位置唯一（④4.4 打分取最高）</text>
  <line x1="72" y1="190" x2="554" y2="190" stroke="#E9E9E5"/>

  <!-- 参考条 -->
  <text x="72" y="224" font-size="11" fill="#6B6B66">参考基因组</text>
  <rect x="72" y="232" width="482" height="28" rx="4" fill="#3C5488"/>
  <!-- read -->
  <rect x="190" y="232" width="110" height="28" fill="#4DBBD5"/>
  <line x1="200" y1="246" x2="290" y2="246" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="190" y="286" font-size="11" fill="#3C8DAD">read：100 bp 完美匹配</text>
  <!-- 其他位置都不行 -->
  <line x1="415" y1="260" x2="415" y2="274" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="360" y="274" width="110" height="22" fill="none" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="368" y1="285" x2="406" y2="285" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="424" y1="285" x2="460" y2="285" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="415" y="316" font-size="11" fill="#6B6B66" text-anchor="middle">其余位置：错配 / indel，明显更差</text>

  <!-- 结论 -->
  <rect x="72" y="336" width="482" height="76" rx="8" fill="#E4F3EF" stroke="#00A087" stroke-width="1.5"/>
  <text x="90" y="364" font-size="14" font-weight="bold" fill="#00A087">MAPQ 60（bwa 上限）</text>
  <text x="90" y="390" font-size="12.5" fill="#33332E">放错概率 ≤ 百万分之一；-q 30 ≈ 放宽到千分之一</text>
  <text x="72" y="448" font-size="12" fill="#33332E">bowtie2 摘要里的对应读法（⑥6.1）：</text>
  <text x="72" y="472" font-size="12.5" font-weight="bold" fill="#3C8DAD">aligned concordantly exactly 1 time</text>
  <text x="72" y="494" font-size="11.5" fill="#6B6B66">方向、距离都对且位置唯一——最健康的类别</text>

  <!-- ============ 右面板：重复 5 拷贝 ============ -->
  <rect x="602" y="120" width="550" height="420" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="626" y="152" font-size="17" font-weight="bold" fill="#3C5488">情形二：重复序列 5 个拷贝</text>
  <text x="626" y="174" font-size="12.5" fill="#6B6B66">5 个位置同样好 → 软件随机挑一个（④4.6）</text>
  <line x1="626" y1="190" x2="1128" y2="190" stroke="#E9E9E5"/>

  <!-- 参考条 + 5 个重复拷贝 -->
  <text x="626" y="224" font-size="11" fill="#6B6B66">参考基因组</text>
  <rect x="626" y="232" width="478" height="28" rx="4" fill="#3C5488"/>
  <rect x="642"  y="232" width="70" height="28" fill="#F39B7F"/>
  <rect x="728"  y="232" width="70" height="28" fill="#F39B7F"/>
  <rect x="814"  y="232" width="70" height="28" fill="#F39B7F"/>
  <rect x="900"  y="232" width="70" height="28" fill="#F39B7F"/>
  <rect x="986"  y="232" width="70" height="28" fill="#F39B7F"/>
  <text x="677" y="251" font-size="10.5" fill="#33332E" text-anchor="middle">拷贝 1</text>
  <text x="763" y="251" font-size="10.5" fill="#33332E" text-anchor="middle">拷贝 2</text>
  <text x="849" y="251" font-size="10.5" fill="#33332E" text-anchor="middle">拷贝 3</text>
  <text x="935" y="251" font-size="10.5" fill="#33332E" text-anchor="middle">拷贝 4</text>
  <text x="1021" y="251" font-size="10.5" fill="#33332E" text-anchor="middle">拷贝 5</text>
  <text x="1084" y="251" font-size="10.5" fill="#FAFAF7" text-anchor="middle">…</text>

  <!-- read：实线在拷贝3，虚线影在其余 -->
  <rect x="814" y="286" width="70" height="24" fill="#4DBBD5"/>
  <text x="849" y="302" font-size="10.5" fill="#FFFFFF" text-anchor="middle">read</text>
  <text x="642" y="302" font-size="10.5" fill="#6B6B66">同样好 →</text>
  <rect x="642" y="286" width="70" height="24" fill="none" stroke="#4DBBD5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="728" y="286" width="70" height="24" fill="none" stroke="#4DBBD5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="900" y="286" width="70" height="24" fill="none" stroke="#4DBBD5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="986" y="286" width="70" height="24" fill="none" stroke="#4DBBD5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="1074" y="302" font-size="10.5" fill="#6B6B66">五选一</text>

  <!-- 结论 -->
  <rect x="626" y="330" width="478" height="76" rx="8" fill="#FDF2F0" stroke="#E64B35" stroke-width="1.5"/>
  <text x="644" y="358" font-size="14" font-weight="bold" fill="#E64B35">MAPQ 0：匹配满分，定位零分</text>
  <text x="644" y="384" font-size="12.5" fill="#33332E">碱基可以全是 Q40——包裹完好救不了地址含糊（④4.6）</text>
  <text x="626" y="446" font-size="12" fill="#33332E">bowtie2 的对应读法（⑥6.1）：</text>
  <text x="626" y="470" font-size="12.5" font-weight="bold" fill="#3C8DAD">aligned concordantly &gt;1 times</text>
  <text x="626" y="492" font-size="11.5" fill="#6B6B66">占比高 → 参考里重复序列多，或有冗余序列</text>

  <!-- ============ 底部反例条 ============ -->
  <rect x="48" y="568" width="1104" height="180" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="600" font-size="15" font-weight="bold" fill="#E64B35">反例——「看着正常其实错了」：比对率 99.2%，但 40% 的 read MAPQ = 0（⑥6.3）</text>
  <text x="72" y="626" font-size="12.5" fill="#33332E">近一半 read 落在无法区分的重复区：常见于参考里混进冗余序列，或组装结果没做单倍型去重——下游变异检测会大面积失效。</text>
  <rect x="72" y="642" width="524" height="36" rx="6" fill="#FAFAF7"/>
  <text x="86" y="665" font-size="12" fill="#33332E">samtools view x.bam | awk '$5==0' | wc -l   # 多少 read 放错风险高</text>
  <rect x="620" y="642" width="508" height="36" rx="6" fill="#FAFAF7"/>
  <text x="634" y="665" font-size="12" fill="#33332E">samtools view x.bam | awk '{print $5}' | sort -n | uniq -c   # MAPQ 分布</text>
  <text x="72" y="712" font-size="12.5" fill="#33332E">只看 mapped % 不够，必须同时看 MAPQ 分布；过滤先用 -q 30 拦一道，次优记录是 secondary（FLAG 256，⑥6.2）。</text>
  <text x="72" y="730" font-size="11.5" fill="#6B6B66">u08 回贴自己的组装时，这一招用来找「深度翻倍 + 一片 MAPQ 0」的可疑区域（③3.4 ｜ ⑩-4）</text>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
