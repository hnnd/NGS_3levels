  <rect x="88" y="434" width="64" height="24" rx="3" fill="#3C5488"/><rect x="156" y="434" width="64" height="24" rx="3" fill="#3C5488"/><rect x="224" y="434" width="64" height="24" rx="3" fill="#3C5488"/><rect x="292" y="434" width="64" height="24" rx="3" fill="#FFFFFF" stroke="#E9E9E5"/><rect x="360" y="434" width="64" height="24" rx="3" fill="#3C5488"/><rect x="428" y="434" width="64" height="24" rx="3" fill="#FFFFFF" stroke="#E9E9E5"/>
