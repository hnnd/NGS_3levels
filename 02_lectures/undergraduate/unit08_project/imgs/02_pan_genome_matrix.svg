  <line x1="504" y1="210" x2="504" y2="430" stroke="#00A087" stroke-width="2.5"/>
  <line x1="498" y1="210" x2="504" y2="210" stroke="#00A087" stroke-width="2.5"/>
  <line x1="498" y1="430" x2="504" y2="430" stroke="#00A087" stroke-width="2.5"/>
  <text x="514" y="316" font-size="13" font-weight="bold" fill="#00A087">Core</text>
  <text x="514" y="334" font-size="10" fill="#6B6B66">全部菌株共有</text>
  <line x1="504" y1="438" x2="504" y2="654" stroke="#F39B7F" stroke-width="2.5"/>
  <line x1="498" y1="438" x2="504" y2="438" stroke="#F39B7F" stroke-width="2.5"/>
  <line x1="498" y1="654" x2="504" y2="654" stroke="#F39B7F" stroke-width="2.5"/>
  <text x="514" y="540" font-size="13" font-weight="bold" fill="#33332E">Accessory</text>
  <text x="514" y="558" font-size="10" fill="#6B6B66">shell + cloud</text>
  <text x="514" y="576" font-size="10" fill="#6B6B66">部分菌株才有</text>
  <text x="72" y="672" font-size="10" fill="#6B6B66">示意矩阵；行已按 core → shell → cloud 分组排列</text>

  <!-- ============ 右面板：怎么读 ============ -->
  <rect x="632" y="124" width="520" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="656" y="154" font-size="15" font-weight="bold" fill="#3C5488">怎么读这张矩阵</text>
  <rect x="656" y="170" width="472" height="100" rx="8" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="656" y="170" width="4" height="100" rx="2" fill="#00A087"/>
  <text x="674" y="196" font-size="12.5" font-weight="bold" fill="#3C5488">Core：所有（或 ≥99%）菌株共有</text>
  <text x="674" y="220" font-size="11" fill="#33332E">物种的"身份"与基本代谢都写在</text>
  <text x="674" y="240" font-size="11" fill="#33332E">这一部分里——它定义"这个种是什么"。</text>
  <rect x="656" y="286" width="472" height="100" rx="8" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="656" y="286" width="4" height="100" rx="2" fill="#F39B7F"/>
  <text x="674" y="312" font-size="12.5" font-weight="bold" fill="#3C5488">Accessory（shell + cloud）：部分菌株才有</text>
  <text x="674" y="336" font-size="11" fill="#33332E">耐药、毒力、噬菌体、环境适应写在这里，</text>
  <text x="674" y="356" font-size="11" fill="#33332E">也是菌株间表型差异的主要来源。</text>
  <rect x="656" y="402" width="472" height="132" rx="8" fill="#FFFFFF" stroke="#E64B35" stroke-width="1.5"/>
  <text x="674" y="428" font-size="12.5" font-weight="bold" fill="#E64B35">核心占比的两个极端，都要先怀疑取样</text>
  <text x="674" y="450" font-size="11" fill="#33332E">占比高（&gt; 80%）：亲缘近或菌株数太少——本项目</text>
  <text x="674" y="468" font-size="11" fill="#33332E">5–6 个基因组几乎必然发生，是取样效应，不是生物学结论；</text>
  <text x="674" y="486" font-size="11" fill="#33332E">占比低（&lt; 50%）：先怀疑混入非同种基因组，</text>
  <text x="674" y="504" font-size="11" fill="#33332E">回查 M4 的 ANI。</text>
  <rect x="656" y="550" width="472" height="114" rx="8" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="674" y="576" font-size="12.5" font-weight="bold" fill="#3C5488">产物与反例</text>
  <text x="674" y="598" font-size="11" fill="#33332E">Roary 产出 gene_presence_absence.csv；若核心只有几百个</text>
  <text x="674" y="616" font-size="11" fill="#33332E">而泛基因组上万 → 混入别的物种，或某基因组注释失败</text>
  <text x="674" y="634" font-size="11" fill="#33332E">产出了空 .gff——先查 annotations/ 里每个 .gff 的行数。</text>
  <text x="656" y="688" font-size="10" fill="#6B6B66">与 u07 衔接：Roary 的唯一输入是 Prokka 的 .gff 原件。</text>

  <!-- ============ 结语与页脚 ============ -->
  <text x="48" y="748" font-size="13.5" font-weight="bold" fill="#3C5488">泛基因组把"哪个基因在群体中存在、缺失、正在扩散"变成一份可逐年对比的清单。</text>
  <text x="1152" y="778" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
