  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">泛基因组：核心与附属，一张矩阵看懂</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">gene presence–absence ｜ core / accessory —— 依据 08_project_lecture.md ⑥6.5、③</text>
  <!-- 图例 -->
  <rect x="840" y="42" width="12" height="12" fill="#3C5488"/>
  <text x="860" y="52" font-size="12" fill="#33332E">该菌株有此基因</text>
  <rect x="840" y="59" width="12" height="12" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="860" y="69" font-size="12" fill="#33332E">没有此基因</text>
  <rect x="840" y="76" width="12" height="12" fill="#00A087"/>
  <text x="860" y="86" font-size="12" fill="#33332E">Core（共有）</text>
  <rect x="840" y="93" width="12" height="12" fill="#F39B7F"/>
  <text x="860" y="103" font-size="12" fill="#33332E">Accessory（部分才有）</text>
  <rect x="840" y="110" width="12" height="12" fill="#E64B35"/>
  <text x="860" y="120" font-size="12" fill="#33332E">易错点</text>

