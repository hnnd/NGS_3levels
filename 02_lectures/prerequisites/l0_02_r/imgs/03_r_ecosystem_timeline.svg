<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">R 生态三十年：从奥克兰到 tidyverse</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">1993 诞生 ｜ CRAN ｜ 分层图形语法 ｜ 原生管道 —— 依据 l0_02 步骤 0 工具现状 与 参考资料 文献</text>
  <!-- 图例 -->
  <rect x="926" y="44" width="12" height="12" fill="#E64B35"/>
  <text x="944" y="54" font-size="12" fill="#33332E">起点事件</text>
  <rect x="926" y="62" width="12" height="12" fill="#3C5488"/>
  <text x="944" y="72" font-size="12" fill="#33332E">语言里程碑</text>
  <rect x="926" y="80" width="12" height="12" fill="#8491B4"/>
  <text x="944" y="90" font-size="12" fill="#33332E">本课在用的生态</text>

  <!-- ============ 主轴 ============ -->
  <line x1="84" y1="430" x2="1112" y2="430" stroke="#3C5488" stroke-width="2"/>
  <polygon points="1124,430 1110,424 1110,436" fill="#3C5488"/>

  <!-- 1993 R 诞生（上） -->
  <circle cx="130" cy="430" r="7" fill="#E64B35"/>
  <text x="130" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1993</text>
  <text x="130" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">R 诞生</text>
  <text x="130" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">Ihaka 与 Gentleman</text>
  <text x="130" y="346" font-size="11" fill="#6B6B66" text-anchor="middle">新西兰奥克兰大学</text>

  <!-- 1997 CRAN（下） -->
  <circle cx="295" cy="430" r="7" fill="#3C5488"/>
  <text x="295" y="466" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1997</text>
  <text x="295" y="488" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">CRAN 上线</text>
  <text x="295" y="508" font-size="11" fill="#6B6B66" text-anchor="middle">R 包的集中仓库</text>
  <text x="295" y="524" font-size="11" fill="#6B6B66" text-anchor="middle">R Core 团队组成</text>

  <!-- 2000 R 1.0.0（上） -->
  <circle cx="460" cy="430" r="7" fill="#3C5488"/>
  <text x="460" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">2000</text>
  <text x="460" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">R 1.0.0 发布</text>
  <text x="460" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">2 月 29 日，正式版</text>

  <!-- 2010 分层语法（下） -->
  <circle cx="625" cy="430" r="7" fill="#8491B4"/>
  <text x="625" y="466" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">2010</text>
  <text x="625" y="488" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">《分层图形语法》</text>
  <text x="625" y="508" font-size="11" fill="#6B6B66" text-anchor="middle">Wickham 发表</text>
  <text x="625" y="524" font-size="11" fill="#6B6B66" text-anchor="middle">ggplot2 的设计蓝图</text>

  <!-- 2019 tidyverse（上） -->
  <circle cx="790" cy="430" r="7" fill="#8491B4"/>
  <text x="790" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">2019</text>
  <text x="790" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">tidyverse 论文发表</text>
  <text x="790" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">readr · dplyr · ggplot2</text>
  <text x="790" y="346" font-size="11" fill="#6B6B66" text-anchor="middle">成套协作的工作流</text>

  <!-- 2021 原生管道（下） -->
  <circle cx="955" cy="430" r="7" fill="#8491B4"/>
  <text x="955" y="466" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">2021</text>
  <text x="955" y="488" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">原生管道 |&gt;</text>
  <text x="955" y="508" font-size="11" fill="#6B6B66" text-anchor="middle">R 4.1 起 x |&gt; f(y)</text>
  <text x="955" y="524" font-size="11" fill="#6B6B66" text-anchor="middle">等价于 f(x, y)</text>

  <!-- 2026 现在（上） -->
  <circle cx="1090" cy="430" r="7" fill="#3C5488"/>
  <text x="1090" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">2026</text>
  <text x="1090" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">R 4.6 系列</text>
  <text x="1090" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">2026-08 实查 CRAN</text>
  <text x="1090" y="346" font-size="11" fill="#6B6B66" text-anchor="middle">可重复报告转向 Quarto</text>

  <!-- 刻度 -->
  <line x1="130" y1="410" x2="130" y2="423" stroke="#E64B35" stroke-width="2"/>
  <line x1="295" y1="437" x2="295" y2="450" stroke="#3C5488" stroke-width="2"/>
  <line x1="460" y1="410" x2="460" y2="423" stroke="#3C5488" stroke-width="2"/>
  <line x1="625" y1="437" x2="625" y2="450" stroke="#8491B4" stroke-width="2"/>
  <line x1="790" y1="410" x2="790" y2="423" stroke="#8491B4" stroke-width="2"/>
  <line x1="955" y1="437" x2="955" y2="450" stroke="#8491B4" stroke-width="2"/>
  <line x1="1090" y1="410" x2="1090" y2="423" stroke="#3C5488" stroke-width="2"/>

  <!-- ============ 底部结语 ============ -->
  <rect x="80" y="580" width="1040" height="110" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="80" y="580" width="4" height="110" rx="2" fill="#3C5488"/>
  <text x="104" y="612" font-size="14" font-weight="bold" fill="#3C5488">两个和写代码有关的现状</text>
  <text x="104" y="638" font-size="12.5" fill="#33332E">装了 ≠ 加载了：install.packages() 一次就够，library() 每个新会话都要重来——could not find function 多半是它。</text>
  <text x="104" y="662" font-size="12.5" fill="#6B6B66">可重复报告正从 Rmd 向 Quarto 换代：存量照常渲染，新特性开发已集中在 Quarto（详见本科 u02 讲义 §4.9）。</text>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
