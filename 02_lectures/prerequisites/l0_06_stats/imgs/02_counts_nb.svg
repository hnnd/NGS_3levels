  <text x="951" y="441" font-size="11.5" font-weight="bold" fill="#3C5488">26 倍</text>
  <text x="736" y="470" font-size="11.5" fill="#33332E" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">&#956; &gt; 1 000</text>
  <rect x="906" y="456" width="166" height="16" rx="4" fill="#E64B35"/>
  <text x="1078" y="469" font-size="11.5" font-weight="bold" fill="#E64B35">166 倍</text>
  <rect x="712" y="500" width="440" height="200" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="736" y="532" font-size="17" font-weight="bold" fill="#3C5488">三条推论</text>
  <line x1="736" y1="546" x2="1128" y2="546" stroke="#E9E9E5"/>
  <text x="736" y="570" font-size="11.5" fill="#33332E"><tspan font-weight="bold" fill="#3C5488">&#9312;</tspan> 原始 counts 不要直接喂给 t 检验——离散、右偏、方差随均值长。</text>
  <text x="736" y="592" font-size="11.5" fill="#33332E"><tspan font-weight="bold" fill="#3C5488">&#9313;</tspan> 不要先转 CPM/TPM 再 t：DESeq2 / edgeR 要<tspan font-weight="bold">原始整数 counts</tspan>，</text>
  <text x="752" y="610" font-size="11.5" fill="#33332E">文库大小由 size factor 在模型内部处理。</text>
  <text x="736" y="632" font-size="11.5" fill="#33332E"><tspan font-weight="bold" fill="#3C5488">&#9314;</tspan> log2(normalized+1) / vst 只用于<tspan font-weight="bold">可视化、聚类、PCA</tspan>。</text>
  <text x="736" y="662" font-size="11" fill="#6B6B66">DESeq2 / edgeR 的核心工作量 = 估计每个基因的 &#945;；n=3 时单基因估</text>
  <text x="736" y="680" font-size="11" fill="#6B6B66">不准，所以要跨基因「借信息」（收缩 / empirical Bayes）。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
