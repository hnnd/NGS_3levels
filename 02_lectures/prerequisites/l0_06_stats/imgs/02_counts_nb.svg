  <text x="736" y="152" font-size="17" font-weight="bold" fill="#3C5488">两个分布，两种方差</text>
  <line x1="736" y1="166" x2="1128" y2="166" stroke="#E9E9E5"/>
  <text x="736" y="196" font-size="14" font-weight="bold" fill="#3C8DAD">泊松：Var = &#956;</text>
  <text x="736" y="217" font-size="11.5" fill="#6B6B66">只描述技术抽样波动（同一文库测两次的差别）</text>
  <text x="736" y="247" font-size="14" font-weight="bold" fill="#3C5488">负二项：Var = &#956; + &#945;&#183;&#956;&#178;</text>
  <text x="736" y="268" font-size="11.5" fill="#33332E">&#956; 项 = 抽样噪声（低表达时主导）；&#945;&#183;&#956;&#178; 项 = 生物学变异（高表达时主导）</text>
  <rect x="712" y="310" width="440" height="170" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="736" y="342" font-size="17" font-weight="bold" fill="#3C5488">方差 / 均值 之比（&#945; = 0.1，演示 2）</text>
