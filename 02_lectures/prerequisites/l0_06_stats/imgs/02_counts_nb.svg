  <text x="930" y="385" font-size="11.5" font-weight="bold" fill="#3C5488">1.3 倍</text>
  <text x="736" y="414" font-size="11.5" fill="#33332E" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">&#956; &#8712; (10, 100]</text>
  <rect x="906" y="400" width="19" height="16" rx="4" fill="#3C5488"/>
  <text x="931" y="413" font-size="11.5" font-weight="bold" fill="#3C5488">3.5 倍</text>
  <text x="736" y="442" font-size="11.5" fill="#33332E" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">&#956; &#8712; (100, 1 000]</text>
