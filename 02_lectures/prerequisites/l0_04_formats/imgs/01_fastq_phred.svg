<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">FASTQ：一条记录，严格四行</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">四行结构 ｜ Phred+33 质量解码 —— 依据 l0_04 §2、§3</text>
  <!-- 碱基色图例 -->
  <text x="920" y="57" font-size="11.5" fill="#6B6B66">碱基色编码</text>
  <rect x="996" y="46" width="14" height="14" rx="3" fill="#00A087"/>
  <text x="1003" y="57" font-size="9" fill="#FFFFFF" text-anchor="middle">A</text>
  <rect x="1016" y="46" width="14" height="14" rx="3" fill="#4DBBD5"/>
  <text x="1023" y="57" font-size="9" fill="#FFFFFF" text-anchor="middle">C</text>
  <rect x="1036" y="46" width="14" height="14" rx="3" fill="#F39B7F"/>
  <text x="1043" y="57" font-size="9" fill="#33332E" text-anchor="middle">G</text>
  <rect x="1056" y="46" width="14" height="14" rx="3" fill="#8491B4"/>
  <text x="1063" y="57" font-size="9" fill="#FFFFFF" text-anchor="middle">T</text>

  <!-- ============ 左面板：四行结构 ============ -->
  <rect x="48" y="120" width="680" height="580" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="156" font-size="17" font-weight="bold" fill="#3C5488">四行各是什么</text>
  <line x1="72" y1="172" x2="704" y2="172" stroke="#E9E9E5"/>

  <!-- 行 1 -->
  <circle cx="82" cy="212" r="9" fill="#3C5488"/>
  <text x="82" y="216" font-size="11" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="100" y="216" font-size="12.5" fill="#33332E" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">@A00519:263:HKJTLDSXY:1:1101:5701:1000 1:N:0:ATCACGAT</text>
  <text x="100" y="236" font-size="11.5" fill="#6B6B66">'@' 开头：工具判断「是不是 FASTQ」的唯一依据；首个空格前是 ID</text>

  <!-- 行 2 -->
  <circle cx="82" cy="262" r="9" fill="#3C5488"/>
  <text x="82" y="266" font-size="11" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="100" y="266" font-size="12.5" fill="#3C8DAD" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">GATCGGAAGAGCACACGTCTGAACTCCAGTCACATCACGATCTCGTATGCC</text>
  <text x="100" y="286" font-size="11.5" fill="#6B6B66">碱基序列（read 本身）</text>

  <!-- 行 3 -->
  <circle cx="82" cy="312" r="9" fill="#3C5488"/>
  <text x="82" y="316" font-size="11" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="100" y="316" font-size="12.5" fill="#33332E" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">+</text>
  <text x="100" y="336" font-size="11.5" fill="#6B6B66">分隔符（可重复 read 名，通常为空）</text>

  <!-- 行 4 -->
  <circle cx="82" cy="362" r="9" fill="#3C5488"/>
  <text x="82" y="366" font-size="11" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="100" y="366" font-size="12.5" fill="#33332E" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">FFFFFF:FFFFFFFFFFFFFF,FFFFFFFFFFFFFF:FF,F#FFFFF:FFF</text>
  <text x="100" y="386" font-size="11.5" fill="#6B6B66">质量串：长度必须等于 ②，逐字符编码该碱基的错误概率</text>

  <!-- 对应关系放大镜：第 38–46 位 -->
  <line x1="72" y1="404" x2="704" y2="404" stroke="#E9E9E5"/>
  <text x="72" y="428" font-size="13" font-weight="bold" fill="#33332E">② 与 ④ 同一位置一一对应（放大第 38–46 位）</text>
  <!-- 碱基块 -->
  <rect x="100" y="440" width="26" height="26" rx="4" fill="#4DBBD5"/><text x="113" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">C</text>
  <rect x="130" y="440" width="26" height="26" rx="4" fill="#F39B7F"/><text x="143" y="458" font-size="12" fill="#33332E" text-anchor="middle">G</text>
  <rect x="160" y="440" width="26" height="26" rx="4" fill="#00A087"/><text x="173" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">A</text>
  <rect x="190" y="440" width="26" height="26" rx="4" fill="#8491B4"/><text x="203" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">T</text>
  <rect x="220" y="440" width="26" height="26" rx="4" fill="#4DBBD5"/><text x="233" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">C</text>
  <rect x="250" y="440" width="26" height="26" rx="4" fill="#8491B4"/><text x="263" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">T</text>
  <rect x="280" y="440" width="26" height="26" rx="4" fill="#4DBBD5"/><text x="293" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">C</text>
  <rect x="310" y="440" width="26" height="26" rx="4" fill="#F39B7F"/><text x="323" y="458" font-size="12" fill="#33332E" text-anchor="middle">G</text>
  <rect x="340" y="440" width="26" height="26" rx="4" fill="#8491B4"/><text x="353" y="458" font-size="12" fill="#FFFFFF" text-anchor="middle">T</text>
  <!-- 质量字符 -->
  <text x="113" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="143" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="173" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">,</text>
  <text x="203" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="233" y="486" font-size="13" font-weight="bold" fill="#E64B35" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">#</text>
  <text x="263" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="293" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="323" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="353" y="486" font-size="13" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="100" y="510" font-size="11.5" fill="#33332E">第 42 位：<tspan font-weight="bold" fill="#E64B35">'#' → ASCII 35 → Q = 2 → P ≈ 0.63</tspan>，这个碱基六成概率是错的</text>
  <text x="100" y="530" font-size="11.5" fill="#6B6B66">数 read 数用「总行数 ÷ 4」；grep -c '^@' 会多数——'@' 的 ASCII 64 = Q31，是合法质量字符</text>

  <!-- FASTA vs FASTQ 迷你对照 -->
  <line x1="72" y1="550" x2="704" y2="550" stroke="#E9E9E5"/>
  <text x="72" y="576" font-size="13" font-weight="bold" fill="#3C5488">FASTA vs FASTQ</text>
  <text x="250" y="576" font-size="13" font-weight="bold" fill="#3C5488" text-anchor="middle">FASTA</text>
  <text x="490" y="576" font-size="13" font-weight="bold" fill="#3C8DAD" text-anchor="middle">FASTQ</text>
  <line x1="72" y1="586" x2="704" y2="586" stroke="#E9E9E5"/>
  <text x="72" y="608" font-size="12.5" fill="#6B6B66">起始字符</text>
  <text x="250" y="608" font-size="12.5" fill="#33332E" text-anchor="middle">'>' 开头</text>
  <text x="490" y="608" font-size="12.5" fill="#33332E" text-anchor="middle">'@' 开头</text>
  <line x1="72" y1="618" x2="704" y2="618" stroke="#E9E9E5"/>
  <text x="72" y="640" font-size="12.5" fill="#6B6B66">质量值</text>
  <text x="250" y="640" font-size="12.5" fill="#33332E" text-anchor="middle">无</text>
  <text x="490" y="640" font-size="12.5" fill="#33332E" text-anchor="middle">有（第 ④ 行）</text>
  <line x1="72" y1="650" x2="704" y2="650" stroke="#E9E9E5"/>
  <text x="72" y="672" font-size="12.5" fill="#6B6B66">数条数</text>
  <text x="250" y="672" font-size="12.5" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">grep -c '^>'</text>
  <text x="490" y="672" font-size="12.5" fill="#33332E" text-anchor="middle">总行数 ÷ 4</text>

  <!-- ============ 右面板：Phred 解码 ============ -->
  <rect x="752" y="120" width="400" height="580" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="776" y="156" font-size="17" font-weight="bold" fill="#3C5488">Phred 质量分数解码</text>
  <line x1="776" y1="172" x2="1128" y2="172" stroke="#E9E9E5"/>

  <rect x="776" y="188" width="352" height="66" rx="6" fill="#FAFAF7"/>
  <text x="792" y="218" font-size="19" font-weight="bold" fill="#3C5488">Q = −10 · log<tspan dy="5" font-size="13">10</tspan><tspan dy="-5"> (P)</tspan></text>
  <text x="792" y="242" font-size="12.5" fill="#33332E">质量字符的 ASCII = Q + 33（Phred+33）</text>

  <text x="776" y="282" font-size="11.5" fill="#6B6B66">为什么从 33 起编码：ASCII 0–32 是控制字符，</text>
  <text x="776" y="300" font-size="11.5" fill="#6B6B66">不能安全印进文本文件。</text>

  <!-- 换算表 -->
  <text x="820" y="334" font-size="12" font-weight="bold" fill="#6B6B66" text-anchor="middle">字符</text>
  <text x="900" y="334" font-size="12" font-weight="bold" fill="#6B6B66" text-anchor="middle">ASCII</text>
  <text x="980" y="334" font-size="12" font-weight="bold" fill="#6B6B66" text-anchor="middle">Q</text>
  <text x="1075" y="334" font-size="12" font-weight="bold" fill="#6B6B66" text-anchor="middle">错误率 P</text>
  <line x1="776" y1="342" x2="1128" y2="342" stroke="#E9E9E5"/>
  <text x="820" y="365" font-size="12.5" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">!</text>
  <text x="900" y="365" font-size="12.5" fill="#33332E" text-anchor="middle">33</text>
  <text x="980" y="365" font-size="12.5" fill="#33332E" text-anchor="middle">0</text>
  <text x="1075" y="365" font-size="12.5" fill="#33332E" text-anchor="middle">1.0</text>
  <rect x="776" y="374" width="352" height="24" fill="#FDECE8"/>
  <text x="820" y="391" font-size="12.5" fill="#E64B35" text-anchor="middle" font-weight="bold" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">#</text>
  <text x="900" y="391" font-size="12.5" fill="#33332E" text-anchor="middle">35</text>
  <text x="980" y="391" font-size="12.5" fill="#33332E" text-anchor="middle">2</text>
  <text x="1075" y="391" font-size="12.5" fill="#33332E" text-anchor="middle">0.63</text>
  <rect x="776" y="400" width="352" height="24" fill="#E2F3F0"/>
  <text x="820" y="417" font-size="12.5" fill="#00A087" text-anchor="middle" font-weight="bold" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">5</text>
  <text x="900" y="417" font-size="12.5" fill="#33332E" text-anchor="middle">53</text>
  <text x="980" y="417" font-size="12.5" fill="#33332E" text-anchor="middle" font-weight="bold">20</text>
  <text x="1075" y="417" font-size="12.5" fill="#33332E" text-anchor="middle">0.01</text>
  <rect x="776" y="426" width="352" height="24" fill="#E2F3F0"/>
  <text x="820" y="443" font-size="12.5" fill="#00A087" text-anchor="middle" font-weight="bold" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">?</text>
  <text x="900" y="443" font-size="12.5" fill="#33332E" text-anchor="middle">63</text>
  <text x="980" y="443" font-size="12.5" fill="#33332E" text-anchor="middle" font-weight="bold">30</text>
  <text x="1075" y="443" font-size="12.5" fill="#33332E" text-anchor="middle">0.001</text>
  <text x="820" y="469" font-size="12.5" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">F</text>
  <text x="900" y="469" font-size="12.5" fill="#33332E" text-anchor="middle">70</text>
  <text x="980" y="469" font-size="12.5" fill="#33332E" text-anchor="middle">37</text>
  <text x="1075" y="469" font-size="12.5" fill="#33332E" text-anchor="middle">0.0002</text>
  <text x="820" y="495" font-size="12.5" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">I</text>
  <text x="900" y="495" font-size="12.5" fill="#33332E" text-anchor="middle">73</text>
  <text x="980" y="495" font-size="12.5" fill="#33332E" text-anchor="middle">40</text>
  <text x="1075" y="495" font-size="12.5" fill="#33332E" text-anchor="middle">0.0001</text>
  <text x="820" y="521" font-size="12.5" fill="#33332E" text-anchor="middle" font-family="'Noto Sans Mono','DejaVu Sans Mono',monospace">J</text>
  <text x="900" y="521" font-size="12.5" fill="#33332E" text-anchor="middle">74</text>
  <text x="980" y="521" font-size="12.5" fill="#33332E" text-anchor="middle">41</text>
  <text x="1075" y="521" font-size="12.5" fill="#33332E" text-anchor="middle">0.00008</text>

  <!-- 锚点 -->
  <rect x="776" y="540" width="4" height="50" rx="2" fill="#3C5488"/>
  <rect x="776" y="540" width="352" height="50" rx="6" fill="#FAFAF7"/>
  <text x="792" y="562" font-size="12.5" font-weight="bold" fill="#33332E">记三个锚点就够</text>
  <text x="792" y="581" font-size="12" fill="#33332E">Q20 = 1% 错误 · Q30 = 0.1% 错误 · '#' = 「别信这个碱基」</text>

  <!-- Phred+64 警示 -->
  <rect x="776" y="606" width="352" height="78" rx="6" fill="#FDECE8" stroke="#E64B35" stroke-width="1"/>
  <text x="792" y="630" font-size="12.5" font-weight="bold" fill="#E64B35">陷阱：Phred+64（2011 年前 Illumina 1.3–1.7）</text>
  <text x="792" y="650" font-size="11.5" fill="#33332E">同一个 I：Phred+64 下是 Q9，不是 Q40</text>
  <text x="792" y="668" font-size="11.5" fill="#33332E">识别：质量行大量小写 a–h，几乎没有 !–5</text>

  <!-- 页脚 -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
