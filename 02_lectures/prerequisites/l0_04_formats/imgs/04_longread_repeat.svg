<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">组装为什么偏好长读长：把重复区「连锚带 flank」包住</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">重复拷贝无法区分 ｜ 长读唯一锚定 —— 依据 l0_04 §1</text>

  <!-- ============ 上面板：基因组上的重复 ============ -->
  <rect x="48" y="120" width="1104" height="270" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="152" font-size="17" font-weight="bold" fill="#3C5488">细菌基因组：重复序列是组装的主要断点</text>
  <line x1="72" y1="166" x2="1128" y2="166" stroke="#E9E9E5"/>

  <!-- 基因组线 -->
  <line x1="96" y1="262" x2="1108" y2="262" stroke="#3C5488" stroke-width="3"/>
  <!-- 重复拷贝 -->
  <rect x="180" y="248" width="120" height="28" rx="5" fill="#F39B7F"/>
  <rect x="530" y="248" width="120" height="28" rx="5" fill="#F39B7F"/>
  <rect x="880" y="248" width="120" height="28" rx="5" fill="#F39B7F"/>
  <text x="240" y="238" font-size="10.5" fill="#33332E" text-anchor="middle">rRNA 操纵子 ≈5 kb</text>
  <text x="590" y="238" font-size="10.5" fill="#33332E" text-anchor="middle">另一拷贝（序列几乎相同）</text>
  <text x="940" y="238" font-size="10.5" fill="#33332E" text-anchor="middle">又一拷贝</text>
  <text x="395" y="290" font-size="11" fill="#6B6B66" text-anchor="middle">独特序列</text>
  <text x="745" y="290" font-size="11" fill="#6B6B66" text-anchor="middle">独特序列</text>
  <text x="1050" y="290" font-size="11" fill="#6B6B66" text-anchor="middle">独特序列</text>

  <text x="72" y="330" font-size="12.5" fill="#33332E">rRNA 操纵子约 5 kb、有 5–10 个拷贝，拷贝之间序列几乎相同；IS 元件（0.7–2.5 kb）同理。</text>
  <text x="72" y="354" font-size="12.5" fill="#33332E">短 read 若整条落在拷贝内部，每个拷贝对它来说「看起来都一样对」。</text>

  <!-- ============ 左下面板：短读 ============ -->
  <rect x="48" y="414" width="528" height="300" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="448" font-size="17" font-weight="bold" fill="#3C5488">短读 150 bp：无法判断属于哪个拷贝</text>
  <line x1="72" y1="462" x2="552" y2="462" stroke="#E9E9E5"/>

  <!-- 三个拷贝 -->
  <rect x="96" y="510" width="140" height="30" rx="5" fill="#F39B7F"/>
  <rect x="242" y="510" width="140" height="30" rx="5" fill="#F39B7F"/>
  <rect x="388" y="510" width="140" height="30" rx="5" fill="#F39B7F"/>
  <text x="166" y="558" font-size="11" fill="#6B6B66" text-anchor="middle">拷贝 1</text>
  <text x="312" y="558" font-size="11" fill="#6B6B66" text-anchor="middle">拷贝 2</text>
  <text x="458" y="558" font-size="11" fill="#6B6B66" text-anchor="middle">拷贝 3</text>

  <!-- 短读：在拷贝2内部为实心，在拷贝1/3为虚影 -->
  <rect x="112" y="516" width="108" height="18" rx="4" fill="none" stroke="#4DBBD5" stroke-dasharray="4 3" stroke-width="1.5"/>
  <rect x="258" y="516" width="108" height="18" rx="4" fill="#4DBBD5"/>
  <rect x="404" y="516" width="108" height="18" rx="4" fill="none" stroke="#4DBBD5" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="312" y="494" font-size="12" font-weight="bold" fill="#3C8DAD" text-anchor="middle">同一条短读，三个拷贝都能整条放下</text>

  <rect x="72" y="588" width="480" height="66" rx="6" fill="#FDECE8" stroke="#E64B35" stroke-width="1"/>
  <text x="88" y="614" font-size="12.5" font-weight="bold" fill="#E64B35">它属于拷贝 1、2 还是 3？无法判断</text>
  <text x="88" y="636" font-size="12" fill="#33332E">组装器无法延伸 → 组装在此断开，contig 碎片化</text>

  <!-- ============ 右下面板：长读 ============ -->
  <rect x="600" y="414" width="552" height="300" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="624" y="448" font-size="17" font-weight="bold" fill="#3C5488">长读 15 kb：连同两侧独特序列一起包住</text>
  <line x1="624" y1="462" x2="1128" y2="462" stroke="#E9E9E5"/>

  <!-- 长读条 -->
  <rect x="644" y="490" width="420" height="20" rx="4" fill="#4DBBD5"/>
  <text x="854" y="504" font-size="11.5" fill="#FFFFFF" text-anchor="middle">长读 15 kb</text>
  <!-- 基因组：独特-重复-独特 -->
  <line x1="644" y1="546" x2="784" y2="546" stroke="#3C5488" stroke-width="3"/>
  <rect x="784" y="532" width="140" height="28" rx="5" fill="#F39B7F"/>
  <line x1="924" y1="546" x2="1064" y2="546" stroke="#3C5488" stroke-width="3"/>
  <text x="714" y="566" font-size="10.5" fill="#6B6B66" text-anchor="middle">独特序列</text>
  <text x="854" y="566" font-size="10.5" fill="#33332E" text-anchor="middle">重复拷贝 ≈5 kb</text>
  <text x="994" y="566" font-size="10.5" fill="#6B6B66" text-anchor="middle">独特序列</text>
  <!-- 锚定标注 -->
  <line x1="644" y1="510" x2="644" y2="540" stroke="#00A087" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="1064" y1="510" x2="1064" y2="540" stroke="#00A087" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="854" y="596" font-size="12.5" font-weight="bold" fill="#00A087" text-anchor="middle">read 两端落在独特序列上 → 这个拷贝被唯一锚定</text>

  <rect x="624" y="616" width="504" height="60" rx="6" fill="#FAFAF7"/>
  <text x="640" y="638" font-size="12.5" font-weight="bold" fill="#33332E">引用准确率必须标注版本（Nanopore 尤其）</text>
  <text x="640" y="658" font-size="11.5" fill="#6B6B66">HiFi &gt;99.9%（错误随机）· CLR 约 85–90% · Nanopore 强依赖化学与 basecaller 版本</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="748" font-size="15" font-weight="bold" fill="#3C5488">拼完成图、跨重复结构 → 长读；海量样本重测序、RNA-seq → 短读。没有最好的平台，只有配得上问题的平台。</text>
  <text x="1152" y="772" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
