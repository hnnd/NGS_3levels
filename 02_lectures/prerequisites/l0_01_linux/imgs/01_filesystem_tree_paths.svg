<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">文件系统是一棵倒着长的树</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">绝对路径 · 门牌号 ｜ 相对路径 · 口头指路 —— 依据 l0_01 核心内容 §1</text>
  <!-- 图例 -->
  <rect x="926" y="44" width="12" height="12" fill="#3C5488"/>
  <text x="944" y="54" font-size="12" fill="#33332E">目录 / 结构</text>
  <rect x="926" y="62" width="12" height="12" fill="#4DBBD5"/>
  <text x="944" y="72" font-size="12" fill="#33332E">路径 / 指路</text>
  <rect x="926" y="80" width="12" height="12" fill="#00A087"/>
  <text x="944" y="90" font-size="12" fill="#33332E">你在这里</text>
  <rect x="926" y="98" width="12" height="12" fill="#E64B35"/>
  <text x="944" y="108" font-size="12" fill="#33332E">易错点</text>

  <!-- ============ 面板 A：目录树 ============ -->
  <rect x="48" y="120" width="690" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="156" font-size="17" font-weight="bold" fill="#3C5488">只有一个根 /，没有 C 盘 D 盘</text>
  <text x="72" y="178" font-size="12.5" fill="#6B6B66">所有磁盘都挂在这棵树上；节点 = 目录，下面是本课真实用到的分支</text>
  <line x1="72" y1="192" x2="714" y2="192" stroke="#E9E9E5"/>

  <!-- 边 -->
  <line x1="382" y1="240" x2="130" y2="290" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="382" y1="240" x2="285" y2="290" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="382" y1="240" x2="417" y2="290" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="382" y1="240" x2="570" y2="290" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="285" y1="320" x2="285" y2="370" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="417" y1="320" x2="417" y2="370" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="570" y1="320" x2="586" y2="370" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="417" y1="400" x2="417" y2="450" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="586" y1="400" x2="601" y2="450" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="417" y1="480" x2="425" y2="530" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="425" y1="560" x2="285" y2="610" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="425" y1="560" x2="378" y2="610" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="425" y1="560" x2="477" y2="610" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="425" y1="560" x2="578" y2="610" stroke="#3C5488" stroke-width="1.5"/>
  <line x1="425" y1="560" x2="673" y2="610" stroke="#3C5488" stroke-width="1.5"/>

  <!-- 节点 -->
  <rect x="360" y="210" width="44" height="30" rx="6" fill="#3C5488"/>
  <text x="382" y="230" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">/</text>
  <text x="416" y="230" font-size="12" fill="#6B6B66">唯一的根（没有 C 盘 D 盘）</text>

  <rect x="100" y="290" width="60" height="30" rx="6" fill="#F39B7F"/>
  <text x="130" y="310" font-size="12" fill="#33332E" text-anchor="middle">etc</text>
  <rect x="250" y="290" width="70" height="30" rx="6" fill="#3C5488"/>
  <text x="285" y="310" font-size="12" fill="#FFFFFF" text-anchor="middle">home</text>
  <rect x="390" y="290" width="54" height="30" rx="6" fill="#3C5488"/>
  <text x="417" y="310" font-size="12" fill="#FFFFFF" text-anchor="middle">d3</text>
  <rect x="540" y="290" width="60" height="30" rx="6" fill="#3C5488"/>
  <text x="570" y="310" font-size="12" fill="#FFFFFF" text-anchor="middle">data</text>

  <rect x="236" y="370" width="98" height="30" rx="6" fill="#3C5488"/>
  <text x="285" y="390" font-size="12" fill="#FFFFFF" text-anchor="middle">wangys</text>
  <rect x="380" y="370" width="74" height="30" rx="6" fill="#3C5488"/>
  <text x="417" y="390" font-size="12" fill="#FFFFFF" text-anchor="middle">scratch</text>
  <rect x="556" y="370" width="60" height="30" rx="6" fill="#3C5488"/>
  <text x="586" y="390" font-size="12" fill="#FFFFFF" text-anchor="middle">lab</text>

  <rect x="374" y="450" width="86" height="30" rx="6" fill="#3C5488"/>
  <text x="417" y="470" font-size="12" fill="#FFFFFF" text-anchor="middle">wangys</text>
  <rect x="570" y="450" width="62" height="30" rx="6" fill="#3C5488"/>
  <text x="601" y="470" font-size="12" fill="#FFFFFF" text-anchor="middle">ngs</text>

  <rect x="394" y="530" width="62" height="30" rx="6" fill="#3C5488"/>
  <text x="425" y="550" font-size="12" fill="#FFFFFF" text-anchor="middle">ngs</text>
  <rect x="388" y="524" width="74" height="42" rx="8" fill="none" stroke="#00A087" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="470" y="550" font-size="12" font-weight="bold" fill="#00A087">你在这里</text>

  <rect x="256" y="610" width="58" height="30" rx="6" fill="#3C5488"/>
  <text x="285" y="630" font-size="12" fill="#FFFFFF" text-anchor="middle">fq</text>
  <rect x="344" y="610" width="68" height="30" rx="6" fill="#3C5488"/>
  <text x="378" y="630" font-size="12" fill="#FFFFFF" text-anchor="middle">assem</text>
  <rect x="442" y="610" width="70" height="30" rx="6" fill="#3C5488"/>
  <text x="477" y="630" font-size="12" fill="#FFFFFF" text-anchor="middle">results</text>
  <rect x="542" y="610" width="72" height="30" rx="6" fill="#3C5488"/>
  <text x="578" y="630" font-size="12" fill="#FFFFFF" text-anchor="middle">scripts</text>
  <rect x="644" y="610" width="58" height="30" rx="6" fill="#3C5488"/>
  <text x="673" y="630" font-size="12" fill="#FFFFFF" text-anchor="middle">logs</text>

  <!-- 相对路径：从 assem 指向 fq -->
  <line x1="340" y1="625" x2="320" y2="625" stroke="#4DBBD5" stroke-width="2"/>
  <polygon points="314,625 322,621 322,629" fill="#4DBBD5"/>
  <text x="336" y="604" font-size="11.5" font-weight="bold" fill="#3C8DAD" text-anchor="end">../fq</text>
  <text x="240" y="664" font-size="10.5" fill="#6B6B66">相对路径 = 口头指路：站在 assem 里，../fq 才指到 fq；换个出发点，含义就变</text>

  <!-- 绝对路径注释 -->
  <text x="70" y="462" font-size="12.5" font-weight="bold" fill="#3C8DAD">绝对路径 = 门牌号，站在哪都指同一处</text>
  <text x="70" y="484" font-size="12" fill="#3C8DAD">/d3/scratch/wangys/ngs</text>

  <!-- 家目录徽标 -->
  <text x="285" y="430" font-size="15" font-weight="bold" fill="#3C8DAD" text-anchor="middle">~</text>
  <text x="285" y="446" font-size="10.5" fill="#6B6B66" text-anchor="middle">家目录：只放脚本与配置</text>

  <!-- 只读数据分支 -->
  <rect x="556" y="494" width="132" height="22" rx="4" fill="#F39B7F"/>
  <text x="622" y="509" font-size="11" fill="#33332E" text-anchor="middle">只读公共数据</text>
  <text x="622" y="538" font-size="10.5" fill="#6B6B66" text-anchor="middle">全班共用：别往里写，别 cp 走</text>

  <!-- ============ 面板 B：符号与固定路径 ============ -->
  <rect x="762" y="120" width="390" height="560" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="786" y="156" font-size="17" font-weight="bold" fill="#3C5488">四个符号 + 三条固定路径</text>
  <text x="786" y="178" font-size="12.5" fill="#6B6B66">先把符号背下来，路径报错少一半</text>
  <line x1="786" y1="192" x2="1128" y2="192" stroke="#E9E9E5"/>

  <rect x="786" y="210" width="28" height="28" rx="6" fill="#3C5488"/>
  <text x="800" y="230" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">~</text>
  <text x="826" y="225" font-size="12.5" font-weight="bold" fill="#33332E">家目录</text>
  <text x="826" y="243" font-size="11" fill="#6B6B66">= /home/你的用户名，配额小</text>

  <rect x="786" y="258" width="28" height="28" rx="6" fill="#3C5488"/>
  <text x="800" y="278" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">.</text>
  <text x="826" y="273" font-size="12.5" font-weight="bold" fill="#33332E">当前目录</text>
  <text x="826" y="291" font-size="11" fill="#6B6B66">相对路径的出发点</text>

  <rect x="786" y="306" width="28" height="28" rx="6" fill="#3C5488"/>
  <text x="800" y="326" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">..</text>
  <text x="826" y="321" font-size="12.5" font-weight="bold" fill="#33332E">上一层</text>
  <text x="826" y="339" font-size="11" fill="#6B6B66">cd .. 回去；../fq 指兄弟目录</text>

  <rect x="786" y="354" width="28" height="28" rx="6" fill="#3C5488"/>
  <text x="800" y="374" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-</text>
  <text x="826" y="369" font-size="12.5" font-weight="bold" fill="#33332E">上一次待的目录</text>
  <text x="826" y="387" font-size="11" fill="#6B6B66">cd - 切回去，像遥控器“回看”</text>

  <text x="786" y="424" font-size="13" font-weight="bold" fill="#3C5488">本课三条固定路径</text>

  <rect x="786" y="436" width="342" height="52" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="786" y="436" width="4" height="52" rx="2" fill="#F39B7F"/>
  <text x="800" y="458" font-size="12" fill="#3C5488">/data/lab/ngs</text>
  <text x="800" y="476" font-size="10.5" fill="#6B6B66">公共数据与参考库：别写、别 cp 走</text>
  <rect x="1086" y="452" width="36" height="20" rx="4" fill="#F39B7F"/>
  <text x="1104" y="466" font-size="10.5" fill="#33332E" text-anchor="middle">只读</text>

  <rect x="786" y="500" width="342" height="52" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="786" y="500" width="4" height="52" rx="2" fill="#00A087"/>
  <text x="800" y="522" font-size="12" fill="#3C5488">/d3/scratch/${USER}/</text>
  <text x="800" y="540" font-size="10.5" fill="#6B6B66">个人工作区：计算都在这里做（约 50 GB）</text>
  <rect x="1086" y="516" width="36" height="20" rx="4" fill="#00A087"/>
  <text x="1104" y="530" font-size="10.5" fill="#FFFFFF" text-anchor="middle">常用</text>

  <rect x="786" y="564" width="342" height="52" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="786" y="564" width="4" height="52" rx="2" fill="#3C5488"/>
  <text x="800" y="586" font-size="12" fill="#3C5488">~ ＝ 家目录</text>
  <text x="800" y="604" font-size="10.5" fill="#6B6B66">只放脚本与配置，别在这里跑分析</text>
  <rect x="1086" y="580" width="36" height="20" rx="4" fill="#3C5488"/>
  <text x="1104" y="594" font-size="10.5" fill="#FFFFFF" text-anchor="middle">轻用</text>

  <rect x="786" y="628" width="342" height="40" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="786" y="628" width="4" height="40" rx="2" fill="#E64B35"/>
  <text x="800" y="644" font-size="12" font-weight="bold" fill="#E64B35">易错：Linux 严格区分大小写</text>
  <text x="800" y="661" font-size="11.5" fill="#33332E">/D3/Scratch ≠ /d3/scratch，是两个目录</text>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
