<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">命令行工具简史：从贝尔实验室到你的终端</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">Unix 1969 ｜ GNU · Linux ｜ 本课工具的来历 —— 依据 l0_01 参考资料 与 步骤 1 工具现状</text>
  <!-- 图例 -->
  <rect x="926" y="44" width="12" height="12" fill="#E64B35"/>
  <text x="944" y="54" font-size="12" fill="#33332E">起点事件</text>
  <rect x="926" y="62" width="12" height="12" fill="#3C5488"/>
  <text x="944" y="72" font-size="12" fill="#33332E">系统里程碑</text>
  <rect x="926" y="80" width="12" height="12" fill="#8491B4"/>
  <text x="944" y="90" font-size="12" fill="#33332E">本课在用的工具</text>

  <!-- ============ 主轴 ============ -->
  <line x1="84" y1="430" x2="1112" y2="430" stroke="#3C5488" stroke-width="2"/>
  <polygon points="1124,430 1110,424 1110,436" fill="#3C5488"/>

  <!-- 1969 Unix（起点，上） -->
  <circle cx="120" cy="430" r="7" fill="#E64B35"/>
  <text x="120" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1969</text>
  <text x="120" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">Unix 诞生</text>
  <text x="120" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">贝尔实验室</text>
  <text x="120" y="346" font-size="11" fill="#6B6B66" text-anchor="middle">Thompson · Ritchie</text>

  <!-- 1983 GNU（下） -->
  <circle cx="254" cy="430" r="7" fill="#3C5488"/>
  <text x="254" y="466" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1983</text>
  <text x="254" y="488" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">GNU 计划宣布</text>
  <text x="254" y="508" font-size="11" fill="#6B6B66" text-anchor="middle">Stallman 发起</text>
  <text x="254" y="524" font-size="11" fill="#6B6B66" text-anchor="middle">自由软件的起点</text>

  <!-- 1989 bash（上） -->
  <circle cx="388" cy="430" r="7" fill="#8491B4"/>
  <text x="388" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1989</text>
  <text x="388" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">bash 首次发布</text>
  <text x="388" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">GNU 项目的 shell</text>
  <text x="388" y="346" font-size="11" fill="#6B6B66" text-anchor="middle">至今是 Linux 默认</text>

  <!-- 1991 Linux（下） -->
  <circle cx="522" cy="430" r="7" fill="#3C5488"/>
  <text x="522" y="466" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1991</text>
  <text x="522" y="488" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">Linux 内核</text>
  <text x="522" y="508" font-size="11" fill="#6B6B66" text-anchor="middle">Torvalds 发布 0.01</text>
  <text x="522" y="524" font-size="11" fill="#6B6B66" text-anchor="middle">与 GNU 合成全系统</text>

  <!-- 1996 rsync（上） -->
  <circle cx="656" cy="430" r="7" fill="#8491B4"/>
  <text x="656" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1996</text>
  <text x="656" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">rsync 首版</text>
  <text x="656" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">增量同步、断点续传</text>
  <text x="656" y="346" font-size="11" fill="#6B6B66" text-anchor="middle">本课步骤 6 取结果用它</text>

  <!-- 1999 OpenSSH（下） -->
  <circle cx="790" cy="430" r="7" fill="#8491B4"/>
  <text x="790" y="466" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">1999</text>
  <text x="790" y="488" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">OpenSSH 首版</text>
  <text x="790" y="508" font-size="11" fill="#6B6B66" text-anchor="middle">加密远程登录</text>
  <text x="790" y="524" font-size="11" fill="#6B6B66" text-anchor="middle">ssh / scp 的实现</text>

  <!-- 2007 tmux（上） -->
  <circle cx="924" cy="430" r="7" fill="#8491B4"/>
  <text x="924" y="404" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">2007</text>
  <text x="924" y="382" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">tmux 首版</text>
  <text x="924" y="362" font-size="11" fill="#6B6B66" text-anchor="middle">会话保活、断线不死</text>
  <text x="924" y="346" font-size="11" fill="#6B6B66" text-anchor="middle">screen 的现代继任</text>

  <!-- 2023 Ed25519（下） -->
  <circle cx="1058" cy="430" r="7" fill="#8491B4"/>
  <text x="1058" y="466" font-size="16" font-weight="bold" fill="#3C5488" text-anchor="middle">2023</text>
  <text x="1058" y="488" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">Ed25519 成为默认</text>
  <text x="1058" y="508" font-size="11" fill="#6B6B66" text-anchor="middle">OpenSSH 9.5 起</text>
  <text x="1058" y="524" font-size="11" fill="#6B6B66" text-anchor="middle">本课推荐密钥类型</text>

  <!-- 连接刻度 -->
  <line x1="120" y1="410" x2="120" y2="423" stroke="#E64B35" stroke-width="2"/>
  <line x1="254" y1="437" x2="254" y2="450" stroke="#3C5488" stroke-width="2"/>
  <line x1="388" y1="410" x2="388" y2="423" stroke="#8491B4" stroke-width="2"/>
  <line x1="522" y1="437" x2="522" y2="450" stroke="#3C5488" stroke-width="2"/>
  <line x1="656" y1="410" x2="656" y2="423" stroke="#8491B4" stroke-width="2"/>
  <line x1="790" y1="437" x2="790" y2="450" stroke="#8491B4" stroke-width="2"/>
  <line x1="924" y1="410" x2="924" y2="423" stroke="#8491B4" stroke-width="2"/>
  <line x1="1058" y1="437" x2="1058" y2="450" stroke="#8491B4" stroke-width="2"/>

  <!-- ============ 底部结语 ============ -->
  <rect x="80" y="580" width="1040" height="110" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <rect x="80" y="580" width="4" height="110" rx="2" fill="#3C5488"/>
  <text x="104" y="612" font-size="14" font-weight="bold" fill="#3C5488">为什么要看这条线</text>
  <text x="104" y="638" font-size="12.5" fill="#33332E">速查表里的每条命令都是这条线上的成熟工具：行为稳定、有官方手册、报错原文可以拿去搜索。</text>
  <text x="104" y="662" font-size="12.5" fill="#6B6B66">注意：macOS 自带 bash 停在 3.2，“本机能跑、服务器报错”的一种来源就在这里（l0_01 实录）。</text>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
