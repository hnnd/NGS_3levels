<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">一切皆文本流：管道与重定向</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">三条传送带 stdin / stdout / stderr ｜ &gt; 覆盖 · &gt;&gt; 追加 · 2&gt;&amp;1 并流 —— 依据 l0_01 核心内容 §2</text>
  <!-- 图例 -->
  <rect x="926" y="44" width="12" height="12" fill="#3C5488"/>
  <text x="944" y="54" font-size="12" fill="#33332E">工具 / 命令</text>
  <rect x="926" y="62" width="12" height="12" fill="#4DBBD5"/>
  <text x="944" y="72" font-size="12" fill="#33332E">数据流（stdout·stdin）</text>
  <rect x="926" y="80" width="12" height="12" fill="#E64B35"/>
  <text x="944" y="90" font-size="12" fill="#33332E">报错流 stderr</text>
  <rect x="926" y="98" width="12" height="12" fill="#F39B7F"/>
  <text x="944" y="108" font-size="12" fill="#33332E">终端 / 屏幕</text>

  <!-- ============ 面板 A：流水线 ============ -->
  <rect x="48" y="120" width="1104" height="230" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="152" font-size="16" font-weight="bold" fill="#3C5488">每个工具只做一件事，| 把它们串成流水线</text>
  <text x="72" y="174" font-size="12.5" fill="#6B6B66">示例（l0_01 步骤 3）：数出 A01_L001 这份 FASTQ 里有多少条 read</text>
  <line x1="72" y1="188" x2="1128" y2="188" stroke="#E9E9E5"/>

  <rect x="96" y="212" width="176" height="56" rx="8" fill="#FAFAF7" stroke="#6B6B66"/>
  <text x="184" y="236" font-size="11.5" fill="#33332E" text-anchor="middle">A01_L001_R1</text>
  <text x="184" y="254" font-size="11.5" fill="#33332E" text-anchor="middle">.fastq.gz</text>
  <line x1="276" y1="240" x2="322" y2="240" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="330,240 320,235 320,245" fill="#4DBBD5"/>
  <text x="299" y="228" font-size="15" fill="#3C5488" text-anchor="middle">|</text>

  <rect x="330" y="212" width="110" height="56" rx="8" fill="#3C5488"/>
  <text x="385" y="246" font-size="14" fill="#FFFFFF" text-anchor="middle">zcat</text>
  <line x1="444" y1="240" x2="490" y2="240" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="498,240 488,235 488,245" fill="#4DBBD5"/>
  <text x="468" y="228" font-size="15" fill="#3C5488" text-anchor="middle">|</text>

  <rect x="500" y="212" width="110" height="56" rx="8" fill="#3C5488"/>
  <text x="555" y="246" font-size="14" fill="#FFFFFF" text-anchor="middle">wc -l</text>
  <line x1="614" y1="240" x2="660" y2="240" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="668,240 658,235 658,245" fill="#4DBBD5"/>
  <text x="638" y="228" font-size="15" fill="#3C5488" text-anchor="middle">|</text>

  <rect x="670" y="212" width="210" height="56" rx="8" fill="#3C5488"/>
  <text x="775" y="246" font-size="12.5" fill="#FFFFFF" text-anchor="middle">awk '{print $1/4}'</text>
  <line x1="884" y1="240" x2="930" y2="240" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="938,240 928,235 928,245" fill="#4DBBD5"/>
  <text x="858" y="228" font-size="15" fill="#3C5488" text-anchor="middle">|</text>

  <rect x="940" y="212" width="172" height="56" rx="8" fill="#FFFFFF" stroke="#4DBBD5" stroke-width="2"/>
  <text x="1026" y="238" font-size="13" font-weight="bold" fill="#3C5488" text-anchor="middle">23 条 read</text>
  <text x="1026" y="256" font-size="10.5" fill="#6B6B66" text-anchor="middle">行数 ÷ 4</text>

  <text x="72" y="302" font-size="11.5" fill="#6B6B66">zcat 解压 → wc -l 数行 → awk ÷ 4（FASTQ 每条记录固定 4 行）：每段只做一件事，成品就是下一段的进料</text>
  <text x="72" y="326" font-size="11.5" fill="#6B6B66">命令替换 $(...) 把命令的输出当值用；tee 既打印到屏幕又写进文件——本课步骤 3 数 read 数用的就是这套</text>

  <!-- ============ 面板 B：三条传送带 ============ -->
  <rect x="48" y="380" width="540" height="290" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="414" font-size="16" font-weight="bold" fill="#3C5488">每条命令有三条传送带</text>
  <text x="72" y="436" font-size="12.5" fill="#6B6B66">stdin(0) 进料 ｜ stdout(1) 成品 ｜ stderr(2) 报错</text>
  <line x1="72" y1="450" x2="564" y2="450" stroke="#E9E9E5"/>

  <text x="144" y="496" font-size="11.5" fill="#3C8DAD">stdin · 0 进料</text>
  <line x1="148" y1="510" x2="246" y2="510" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="254,510 244,505 244,515" fill="#4DBBD5"/>
  <rect x="254" y="486" width="140" height="48" rx="8" fill="#3C5488"/>
  <text x="324" y="516" font-size="13" fill="#FFFFFF" text-anchor="middle">任一工具</text>
  <line x1="398" y1="510" x2="496" y2="510" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="504,510 494,505 494,515" fill="#4DBBD5"/>
  <text x="398" y="496" font-size="11.5" fill="#3C8DAD">stdout · 1 成品</text>

  <line x1="324" y1="534" x2="324" y2="548" stroke="#E64B35" stroke-width="2.5" stroke-dasharray="5 3"/>
  <polygon points="324,556 319,546 329,546" fill="#E64B35"/>
  <text x="338" y="550" font-size="11.5" fill="#E64B35">stderr · 2 报错：走的是另一条带</text>
  <rect x="274" y="556" width="100" height="30" rx="6" fill="#FAFAF7" stroke="#F39B7F"/>
  <text x="324" y="576" font-size="11.5" fill="#33332E" text-anchor="middle">终端 / 屏幕</text>

  <rect x="72" y="606" width="30" height="26" rx="6" fill="#3C5488"/>
  <text x="87" y="624" font-size="13" fill="#FFFFFF" text-anchor="middle">&gt;</text>
  <text x="114" y="624" font-size="12.5" fill="#33332E">覆盖写入——原内容没了，慎用</text>
  <rect x="72" y="640" width="30" height="26" rx="6" fill="#3C5488"/>
  <text x="87" y="658" font-size="11" fill="#FFFFFF" text-anchor="middle">&gt;&gt;</text>
  <text x="114" y="658" font-size="12.5" fill="#33332E">追加写入——接在文件末尾</text>

  <!-- ============ 面板 C：报错去哪了 ============ -->
  <rect x="608" y="380" width="544" height="290" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="632" y="414" font-size="16" font-weight="bold" fill="#3C5488">报错走的是另一条带子</text>
  <text x="632" y="436" font-size="12.5" fill="#6B6B66">flye ... &gt; run.log 之后，run.log 里并没有报错</text>
  <line x1="632" y1="450" x2="1128" y2="450" stroke="#E9E9E5"/>

  <!-- 左场景：只重定向 stdout -->
  <text x="632" y="478" font-size="12" font-weight="bold" fill="#3C5488">flye ... &gt; run.log</text>
  <rect x="632" y="490" width="228" height="38" rx="8" fill="#FAFAF7" stroke="#6B6B66"/>
  <text x="746" y="514" font-size="11.5" fill="#33332E" text-anchor="middle">flye -i reads -o out</text>
  <line x1="700" y1="528" x2="700" y2="542" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="700,548 695,538 705,538" fill="#4DBBD5"/>
  <rect x="652" y="548" width="116" height="32" rx="6" fill="#FAFAF7" stroke="#3C5488"/>
  <text x="710" y="569" font-size="11.5" fill="#33332E" text-anchor="middle">run.log</text>
  <polyline points="792,528 792,542 850,542" fill="none" stroke="#E64B35" stroke-width="2.5" stroke-dasharray="5 3"/>
  <polygon points="858,542 848,537 848,547" fill="#E64B35"/>
  <rect x="816" y="548" width="80" height="32" rx="6" fill="#FAFAF7" stroke="#F39B7F"/>
  <text x="856" y="569" font-size="11.5" fill="#33332E" text-anchor="middle">屏幕</text>
  <text x="632" y="606" font-size="11.5" fill="#E64B35">报错只在屏幕一闪而过，没进文件</text>

  <!-- 右场景：2>&1 -->
  <text x="892" y="478" font-size="12" font-weight="bold" fill="#3C5488">flye ... &gt; run.log 2&gt;&amp;1</text>
  <rect x="892" y="490" width="228" height="38" rx="8" fill="#FAFAF7" stroke="#6B6B66"/>
  <text x="1006" y="514" font-size="11.5" fill="#33332E" text-anchor="middle">flye -i reads -o out</text>
  <line x1="952" y1="528" x2="952" y2="542" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="952,548 947,538 957,538" fill="#4DBBD5"/>
  <rect x="904" y="548" width="116" height="32" rx="6" fill="#FAFAF7" stroke="#3C5488"/>
  <text x="962" y="569" font-size="11.5" fill="#33332E" text-anchor="middle">run.log</text>
  <polyline points="1052,528 1052,542 1010,542" fill="none" stroke="#E64B35" stroke-width="2.5" stroke-dasharray="5 3"/>
  <polygon points="1002,542 1012,537 1012,547" fill="#E64B35"/>
  <text x="892" y="606" font-size="11.5" fill="#00A087">报错和输出都进日志，排错不缺线索</text>

  <text x="632" y="646" font-size="11.5" fill="#6B6B66">作业脚本统一写 #$ -j y：stderr 并进 stdout，只留一个日志（§5）</text>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
