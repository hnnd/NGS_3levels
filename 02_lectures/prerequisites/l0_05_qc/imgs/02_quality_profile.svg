  <text x="772" y="596" font-size="12" font-weight="bold" fill="#33332E">--cut_mean_quality 别设 30</text>
  <text x="772" y="614" font-size="11" fill="#6B6B66">Q20 = 1% 错误率已是常规下限，30 切太狠</text>
