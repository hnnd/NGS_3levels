  <text x="756" y="194" font-size="12.5" font-weight="bold" fill="#3C5488">3' 端：相位偏移（phasing / pre-phasing）</text>
  <text x="756" y="216" font-size="11.5" fill="#33332E">一个簇里上千个分子理论同步合成；每轮</text>
  <text x="756" y="234" font-size="11.5" fill="#33332E">都有极少数掉队或抢跑，误差逐轮累积——</text>
  <text x="756" y="252" font-size="11.5" fill="#33332E">到 140 轮，荧光成了混合色。</text>
