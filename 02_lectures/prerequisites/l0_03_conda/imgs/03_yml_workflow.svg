<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">从手写 yml 到可复现环境</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">试解先行 ｜ --no-builds 导出 ｜ 重建验证 —— 依据 l0_03 上机操作 步骤 1–4（自测 P1）与 §3</text>
  <!-- 图例 -->
  <rect x="926" y="44" width="12" height="12" fill="#3C5488"/>
  <text x="944" y="54" font-size="12" fill="#33332E">步骤 / 命令</text>
  <rect x="926" y="62" width="12" height="12" fill="#F39B7F"/>
  <text x="944" y="72" font-size="12" fill="#33332E">提醒</text>
  <rect x="926" y="80" width="12" height="12" fill="#00A087"/>
  <text x="944" y="90" font-size="12" fill="#33332E">检查 / 达标</text>
  <rect x="926" y="98" width="12" height="12" fill="#E64B35"/>
  <text x="944" y="108" font-size="12" fill="#33332E">易错点</text>

  <!-- ============ 步骤 1：手写 yml ============ -->
  <rect x="48" y="140" width="200" height="280" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="72" cy="166" r="12" fill="#3C5488"/>
  <text x="72" y="171" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="92" y="171" font-size="13.5" font-weight="bold" fill="#3C5488">手写最小 yml</text>
  <rect x="60" y="188" width="176" height="146" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="70" y="206" font-size="9.5" fill="#33332E">name: l0_test</text>
  <text x="70" y="222" font-size="9.5" fill="#33332E">channels:</text>
  <text x="70" y="238" font-size="9.5" fill="#3C8DAD">  - conda-forge</text>
  <text x="70" y="254" font-size="9.5" fill="#33332E">  - bioconda</text>
  <text x="70" y="270" font-size="9.5" fill="#33332E">  - defaults</text>
  <text x="70" y="286" font-size="9.5" fill="#33332E">dependencies:</text>
  <text x="70" y="302" font-size="9.5" fill="#33332E">  - samtools</text>
  <text x="70" y="318" font-size="9.5" fill="#33332E">  - bwa</text>
  <text x="60" y="356" font-size="10.5" fill="#6B6B66">conda-forge 必须排在 bioconda 前</text>
  <text x="60" y="376" font-size="10.5" fill="#6B6B66">环境名由 name: 决定</text>

  <!-- ============ 步骤 2：试解 ============ -->
  <rect x="274" y="140" width="200" height="280" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="298" cy="166" r="12" fill="#3C5488"/>
  <text x="298" y="171" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="318" y="171" font-size="13.5" font-weight="bold" fill="#3C5488">先试解不真装</text>
  <rect x="286" y="188" width="176" height="70" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="296" y="208" font-size="9.5" fill="#33332E">conda env create -f</text>
  <text x="296" y="224" font-size="9.5" fill="#33332E">  environment.yml</text>
  <text x="296" y="240" font-size="9.5" fill="#33332E">  --dry-run</text>
  <text x="286" y="284" font-size="10.5" fill="#6B6B66">课程 yml 尚未做过 solve 验证</text>
  <rect x="286" y="298" width="120" height="22" rx="4" fill="#F39B7F"/>
  <text x="346" y="313" font-size="10.5" fill="#33332E" text-anchor="middle">包名可能已改</text>
  <text x="286" y="344" font-size="10" fill="#33332E">jellyfish → kmer-jellyfish</text>
  <text x="286" y="362" font-size="10" fill="#33332E">checkm → checkm-genome</text>
  <text x="286" y="388" font-size="10" fill="#6B6B66">conda search -c bioconda 查真名</text>

  <!-- ============ 步骤 3：建 & 验证 ============ -->
  <rect x="500" y="140" width="200" height="280" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="524" cy="166" r="12" fill="#3C5488"/>
  <text x="524" y="171" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="544" y="171" font-size="13.5" font-weight="bold" fill="#3C5488">建环境并验证</text>
  <rect x="512" y="188" width="176" height="86" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="522" y="208" font-size="9.5" fill="#33332E">conda env create</text>
  <text x="522" y="224" font-size="9.5" fill="#33332E">  -f environment.yml</text>
  <text x="522" y="240" font-size="9.5" fill="#33332E">conda activate l0_test</text>
  <text x="522" y="256" font-size="9.5" fill="#33332E">which samtools</text>
  <rect x="512" y="292" width="152" height="22" rx="4" fill="#00A087"/>
  <text x="588" y="307" font-size="10.5" fill="#FFFFFF" text-anchor="middle">which 指向本环境 ✓</text>
  <text x="512" y="340" font-size="10.5" fill="#6B6B66">必须指向 .../envs/l0_test/bin/</text>
  <text x="512" y="360" font-size="10.5" fill="#6B6B66">conda list bwa 交叉确认</text>

  <!-- ============ 步骤 4：导出 ============ -->
  <rect x="726" y="140" width="200" height="280" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="750" cy="166" r="12" fill="#3C5488"/>
  <text x="750" y="171" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="770" y="171" font-size="13.5" font-weight="bold" fill="#3C5488">--no-builds 导出</text>
  <rect x="738" y="188" width="176" height="70" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="748" y="208" font-size="9.5" fill="#33332E">conda env export</text>
  <text x="748" y="224" font-size="9.5" fill="#33332E">  --no-builds</text>
  <text x="748" y="240" font-size="9.5" fill="#33332E">  &gt; environment.yml</text>
  <text x="738" y="284" font-size="10.5" fill="#6B6B66">交作业、报告附录用这份：</text>
  <text x="738" y="304" font-size="10.5" fill="#6B6B66">去掉 build 号，跨平台可重建</text>
  <rect x="738" y="322" width="176" height="70" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="748" y="342" font-size="9.5" fill="#6B6B66">全量含 build → 同平台复刻</text>
  <text x="748" y="360" font-size="9.5" fill="#00A087">--no-builds → 本课用 ✓</text>
  <text x="748" y="378" font-size="9.5" fill="#6B6B66">--from-history → 只列你装的</text>

  <!-- ============ 步骤 5：重建验证 ============ -->
  <rect x="952" y="140" width="200" height="280" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <circle cx="976" cy="166" r="12" fill="#3C5488"/>
  <text x="976" y="171" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="996" y="171" font-size="13.5" font-weight="bold" fill="#3C5488">重建验证后交付</text>
  <rect x="964" y="188" width="176" height="86" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <text x="974" y="208" font-size="9.5" fill="#33332E">conda env create</text>
  <text x="974" y="224" font-size="9.5" fill="#33332E">  -n l0_test_copy</text>
  <text x="974" y="240" font-size="9.5" fill="#33332E">  -f environment.yml</text>
  <text x="974" y="256" font-size="9.5" fill="#33332E">conda env list</text>
  <text x="964" y="300" font-size="10.5" fill="#6B6B66">核对了再删副本，省配额：</text>
  <text x="964" y="320" font-size="10" fill="#33332E">conda env remove -n l0_test_copy</text>
  <text x="964" y="350" font-size="10.5" fill="#33332E">换机器、换集群，同一条路</text>
  <text x="964" y="370" font-size="10.5" fill="#6B6B66">这就是“可复现”的最小闭环</text>

  <!-- ============ 步骤间箭头 ============ -->
  <line x1="250" y1="280" x2="266" y2="280" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="274,280 264,275 264,285" fill="#4DBBD5"/>
  <line x1="476" y1="280" x2="492" y2="280" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="500,280 490,275 490,285" fill="#4DBBD5"/>
  <line x1="702" y1="280" x2="718" y2="280" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="726,280 716,275 716,285" fill="#4DBBD5"/>
  <line x1="928" y1="280" x2="944" y2="280" stroke="#4DBBD5" stroke-width="2.5"/>
  <polygon points="952,280 942,275 942,285" fill="#4DBBD5"/>

  <!-- ============ 下左：三种导出 ============ -->
  <rect x="48" y="450" width="640" height="230" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="72" y="482" font-size="16" font-weight="bold" fill="#3C5488">三种导出，用途不同（§3）</text>
  <line x1="72" y1="496" x2="664" y2="496" stroke="#E9E9E5"/>

  <rect x="72" y="510" width="592" height="44" rx="6" fill="#FAFAF7"/>
  <text x="84" y="530" font-size="11" fill="#3C5488">conda env export</text>
  <text x="84" y="546" font-size="9.5" fill="#6B6B66">（全量）</text>
  <text x="290" y="538" font-size="11" fill="#33332E">全量含 build 号</text>
  <text x="430" y="538" font-size="11" fill="#33332E">同架构同平台，精确复刻</text>

  <rect x="72" y="562" width="592" height="44" rx="6" fill="#FAFAF7"/>
  <text x="84" y="582" font-size="11" fill="#3C5488">…--no-builds</text>
  <text x="84" y="598" font-size="9.5" fill="#6B6B66">（去 build 号）</text>
  <text x="290" y="582" font-size="11" fill="#33332E">跨平台可重建</text>
  <text x="430" y="582" font-size="11" fill="#33332E">交作业 / 报告附录</text>
  <rect x="580" y="574" width="60" height="20" rx="4" fill="#00A087"/>
  <text x="610" y="588" font-size="10.5" fill="#FFFFFF" text-anchor="middle">本课用</text>

  <rect x="72" y="614" width="592" height="44" rx="6" fill="#FAFAF7"/>
  <text x="84" y="634" font-size="11" fill="#3C5488">…--from-history</text>
  <text x="84" y="650" font-size="9.5" fill="#6B6B66">（按安装记录）</text>
  <text x="290" y="638" font-size="11" fill="#33332E">只列你显式装的</text>
  <text x="430" y="638" font-size="11" fill="#33332E">改干净 / 新 yml 起点</text>

  <!-- ============ 下右：环境名易错 ============ -->
  <rect x="712" y="450" width="440" height="230" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>
  <text x="736" y="482" font-size="16" font-weight="bold" fill="#E64B35">易错：环境名 ≠ 文件名</text>
  <line x1="736" y1="496" x2="1128" y2="496" stroke="#E9E9E5"/>
  <text x="736" y="524" font-size="11.5" fill="#33332E">env_ug_annotation.yml 里 name: 是 ngs_ug_annot</text>
  <text x="736" y="550" font-size="11.5" fill="#33332E">照文件名去激活 → EnvironmentNameNotFound</text>
  <text x="736" y="576" font-size="11.5" fill="#6B6B66">环境名只由 yml 里的 name: 决定，与文件名无关</text>
  <rect x="736" y="596" width="200" height="26" rx="6" fill="#00A087"/>
  <text x="836" y="614" font-size="11.5" fill="#FFFFFF" text-anchor="middle">conda env list 看真名</text>
  <text x="736" y="652" font-size="11" fill="#6B6B66">建完先 conda env list，别照文件名猜</text>

  <!-- ============ 页脚 ============ -->
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
