<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">从培养到条码：16S 扩增子的范式之路</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">1977 rRNA 系统发育 ｜ 2006 高通量标签 ｜ 2016 ASV —— 依据 06_amplicon_lecture.md ③④4.6 与 ⑪</text>
  <!-- 图例（两列） -->
  <rect x="926" y="40" width="12" height="12" fill="#3C5488"/>
  <text x="946" y="50" font-size="12" fill="#33332E">概念奠基</text>
  <rect x="926" y="64" width="12" height="12" fill="#4DBBD5"/>
  <text x="946" y="74" font-size="12" fill="#33332E">测定技术</text>
  <rect x="1058" y="40" width="12" height="12" fill="#00A087"/>
  <text x="1078" y="50" font-size="12" fill="#33332E">标准与框架</text>
  <rect x="1058" y="64" width="12" height="12" fill="#F39B7F"/>
  <text x="1078" y="74" font-size="12" fill="#33332E">ASV 范式</text>

  <!-- ============ 主面板 ============ -->
  <rect x="48" y="120" width="1104" height="540" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>

  <!-- 主轴 -->
  <line x1="100" y1="400" x2="1100" y2="400" stroke="#33332E" stroke-width="2"/>
  <polygon points="1100,394 1100,406 1112,400" fill="#33332E"/>

  <!-- 1977 上 · navy -->
  <line x1="130" y1="392" x2="130" y2="338" stroke="#3C5488" stroke-width="1.5"/>
  <circle cx="130" cy="400" r="7" fill="#3C5488"/>
  <text x="130" y="330" font-size="15" font-weight="bold" fill="#3C5488" text-anchor="middle">1977</text>
  <text x="130" y="308" font-size="11" fill="#33332E" text-anchor="middle">16S rRNA 指纹比较微生物，</text>
  <text x="130" y="292" font-size="11" fill="#33332E" text-anchor="middle">发现古菌（Woese &amp; Fox）</text>

  <!-- 1985 下 · teal -->
  <line x1="248" y1="408" x2="248" y2="452" stroke="#4DBBD5" stroke-width="1.5"/>
  <circle cx="248" cy="400" r="7" fill="#4DBBD5"/>
  <text x="248" y="472" font-size="15" font-weight="bold" fill="#3C8DAD" text-anchor="middle">1985</text>
  <text x="248" y="492" font-size="11" fill="#33332E" text-anchor="middle">通用引物快速测定 16S</text>
  <text x="248" y="508" font-size="11" fill="#33332E" text-anchor="middle">（Lane et al., PNAS）</text>

  <!-- 1990 上 · navy -->
  <line x1="366" y1="392" x2="366" y2="338" stroke="#3C5488" stroke-width="1.5"/>
  <circle cx="366" cy="400" r="7" fill="#3C5488"/>
  <text x="366" y="330" font-size="15" font-weight="bold" fill="#3C5488" text-anchor="middle">1990</text>
  <text x="366" y="308" font-size="11" fill="#33332E" text-anchor="middle">三域正式命名；环境克隆文库</text>
  <text x="366" y="292" font-size="11" fill="#33332E" text-anchor="middle">直接读海水细菌 16S（免培养）</text>

  <!-- 2006 下 · teal -->
  <line x1="484" y1="408" x2="484" y2="452" stroke="#4DBBD5" stroke-width="1.5"/>
  <circle cx="484" cy="400" r="7" fill="#4DBBD5"/>
  <text x="484" y="472" font-size="15" font-weight="bold" fill="#3C8DAD" text-anchor="middle">2006</text>
  <text x="484" y="492" font-size="11" fill="#33332E" text-anchor="middle">454 高通量标签测序：</text>
  <text x="484" y="508" font-size="11" fill="#33332E" text-anchor="middle">深海「稀有生物圈」</text>

  <!-- 2011 上 · green -->
  <line x1="602" y1="392" x2="602" y2="338" stroke="#00A087" stroke-width="1.5"/>
  <circle cx="602" cy="400" r="7" fill="#00A087"/>
  <text x="602" y="330" font-size="15" font-weight="bold" fill="#00A087" text-anchor="middle">2011</text>
  <text x="602" y="308" font-size="11" fill="#33332E" text-anchor="middle">V4（515F/806R）成为</text>
  <text x="602" y="292" font-size="11" fill="#33332E" text-anchor="middle">标准区段（EMP 路线）</text>

  <!-- 2016 下 · orange -->
  <line x1="720" y1="408" x2="720" y2="452" stroke="#F39B7F" stroke-width="1.5"/>
  <circle cx="720" cy="400" r="7" fill="#F39B7F"/>
  <text x="720" y="472" font-size="15" font-weight="bold" fill="#C0684B" text-anchor="middle">2016</text>
  <text x="720" y="492" font-size="11" fill="#33332E" text-anchor="middle">DADA2：从数据本身学</text>
  <text x="720" y="508" font-size="11" fill="#33332E" text-anchor="middle">错误模型，推断 ASV</text>

  <!-- 2017 上 · orange -->
  <line x1="838" y1="392" x2="838" y2="338" stroke="#F39B7F" stroke-width="1.5"/>
  <circle cx="838" cy="400" r="7" fill="#F39B7F"/>
  <text x="838" y="330" font-size="15" font-weight="bold" fill="#C0684B" text-anchor="middle">2017</text>
  <text x="838" y="308" font-size="11" fill="#33332E" text-anchor="middle">「精确序列变体应取代 OTU」</text>
  <text x="838" y="292" font-size="11" fill="#33332E" text-anchor="middle">（ISME J 观点论文）</text>

  <!-- 2019 下 · green -->
  <line x1="956" y1="408" x2="956" y2="452" stroke="#00A087" stroke-width="1.5"/>
  <circle cx="956" cy="400" r="7" fill="#00A087"/>
  <text x="956" y="472" font-size="15" font-weight="bold" fill="#00A087" text-anchor="middle">2019</text>
  <text x="956" y="492" font-size="11" fill="#33332E" text-anchor="middle">QIIME 2：可复现微生物组</text>
  <text x="956" y="508" font-size="11" fill="#33332E" text-anchor="middle">数据科学框架</text>

  <!-- 2024-25 上 · teal -->
  <line x1="1074" y1="392" x2="1074" y2="338" stroke="#4DBBD5" stroke-width="1.5"/>
  <circle cx="1074" cy="400" r="7" fill="#4DBBD5"/>
  <text x="1074" y="330" font-size="15" font-weight="bold" fill="#3C8DAD" text-anchor="middle">2024–25</text>
  <text x="1074" y="308" font-size="11" fill="#33332E" text-anchor="middle">全长 16S（PacBio HiFi / ONT）</text>
  <text x="1074" y="292" font-size="11" fill="#33332E" text-anchor="middle">分辨率推进到种 / 株</text>

  <!-- 阶段注记 -->
  <text x="600" y="574" font-size="12" fill="#6B6B66" text-anchor="middle">先解决「不培养也能认出谁」→ 再解决「一次看几千个样本」→ 再解决「数得准」→ 现在解决「认得细」</text>
  <text x="1100" y="600" font-size="11" fill="#6B6B66" text-anchor="end">年份（间距示意，不按比例）</text>

  <!-- ============ 底部结语与页脚 ============ -->
  <text x="48" y="728" font-size="15" font-weight="bold" fill="#3C5488">每一步都在把「谁在」数得更准：从必须培养，到标签测序，到单碱基分辨的序列本身。</text>
  <text x="48" y="754" font-size="11" fill="#6B6B66">年份取文献发表年（讲义 ⑪ 文献 1–3、12–13 与公认科学史实）；全长 16S 的边界见 ④4.6。</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
