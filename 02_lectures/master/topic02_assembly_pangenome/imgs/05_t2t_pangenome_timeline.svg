<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Noto Sans CJK SC, Noto Sans CJK JP, PingFang SC, sans-serif">
  <!-- ============ 底与标题 ============ -->
  <rect width="1200" height="800" fill="#FAFAF7"/>
  <text x="48" y="64" font-size="26" font-weight="bold" fill="#3C5488">从单一参考到 T2T 与泛基因组时代</text>
  <text x="48" y="92" font-size="14" fill="#6B6B66">组装完成图标准 ｜ 泛基因组基础设施 —— 依据 02_assembly_pangenome_lecture.md §3.1 / §4.9</text>
  <!-- 图例 -->
  <rect x="896" y="30" width="12" height="12" fill="#F39B7F"/>
  <text x="916" y="40" font-size="12" fill="#33332E">概念提出</text>
  <rect x="1004" y="30" width="12" height="12" fill="#4DBBD5"/>
  <text x="1024" y="40" font-size="12" fill="#33332E">群体数据资源</text>
  <rect x="896" y="52" width="12" height="12" fill="#E64B35"/>
  <text x="916" y="62" font-size="12" fill="#33332E">标准改写</text>
  <rect x="1004" y="52" width="12" height="12" fill="#00A087"/>
  <text x="1024" y="62" font-size="12" fill="#33332E">图参考基础设施</text>

  <!-- ============ 面板 ============ -->
  <rect x="48" y="118" width="1104" height="546" rx="10" fill="#FFFFFF" stroke="#E9E9E5"/>

  <!-- 时间轴 -->
  <line x1="72" y1="400" x2="1096" y2="400" stroke="#3C5488" stroke-width="3"/>
  <polygon points="1096,393 1110,400 1096,407" fill="#3C5488"/>

  <!-- 起点块：单一参考时代 -->
  <rect x="64" y="348" width="146" height="104" rx="8" fill="#F0F0EC" stroke="#E9E9E5"/>
  <text x="137" y="380" font-size="11" fill="#6B6B66" text-anchor="middle">此前</text>
  <text x="137" y="404" font-size="13" font-weight="bold" fill="#33332E" text-anchor="middle">单一参考时代</text>
  <text x="137" y="428" font-size="10.5" fill="#6B6B66" text-anchor="middle">一个物种一个坐标系</text>

  <!-- 连接杆 -->
  <line x1="333" y1="368" x2="333" y2="380" stroke="#F39B7F" stroke-width="1.5"/>
  <line x1="565" y1="400" x2="565" y2="442" stroke="#4DBBD5" stroke-width="1.5"/>
  <line x1="797" y1="368" x2="797" y2="380" stroke="#E64B35" stroke-width="1.5"/>
  <line x1="1029" y1="400" x2="1029" y2="442" stroke="#00A087" stroke-width="1.5"/>

  <!-- 节点 -->
  <circle cx="333" cy="400" r="7" fill="#F39B7F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="565" cy="400" r="7" fill="#4DBBD5" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="797" cy="400" r="7" fill="#E64B35" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="1029" cy="400" r="7" fill="#00A087" stroke="#FFFFFF" stroke-width="2"/>

  <!-- ============ 2005（上） ============ -->
  <rect x="224" y="224" width="218" height="144" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="226" y="230" width="4" height="132" rx="2" fill="#F39B7F"/>
  <text x="242" y="253" font-size="15" font-weight="bold" fill="#33332E">2005</text>
  <text x="242" y="277" font-size="13" font-weight="bold" fill="#33332E">泛基因组概念提出</text>
  <text x="242" y="302" font-size="11.5" fill="#33332E">Tettelin 等 · 无乳链球菌</text>
  <text x="242" y="320" font-size="11.5" fill="#33332E">pan-genome：基因组集合</text>
  <text x="242" y="338" font-size="11.5" fill="#33332E">并非固定不变</text>
  <text x="242" y="358" font-size="11" fill="#6B6B66">（讲义文献 11）</text>

  <!-- ============ 2018（下） ============ -->
  <rect x="456" y="442" width="218" height="144" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="458" y="448" width="4" height="132" rx="2" fill="#4DBBD5"/>
  <text x="474" y="471" font-size="15" font-weight="bold" fill="#3C8DAD">2018</text>
  <text x="474" y="495" font-size="13" font-weight="bold" fill="#33332E">水稻 3K 泛基因组</text>
  <text x="474" y="520" font-size="11.5" fill="#33332E">3010 份栽培稻重测序</text>
  <text x="474" y="538" font-size="11.5" fill="#33332E">变异图谱与 PAV 刻画</text>
  <text x="474" y="556" font-size="11.5" fill="#33332E">66 份稻种从头组装</text>
  <text x="474" y="576" font-size="11" fill="#6B6B66">（Wang 2018 · Zhao 2018）</text>

  <!-- ============ 2022（上，红） ============ -->
  <rect x="688" y="224" width="218" height="144" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="690" y="230" width="4" height="132" rx="2" fill="#E64B35"/>
  <text x="706" y="253" font-size="15" font-weight="bold" fill="#E64B35">2022</text>
  <text x="706" y="277" font-size="13" font-weight="bold" fill="#33332E">T2T-CHM13</text>
  <text x="706" y="302" font-size="11.5" fill="#33332E">首个无缺口人类基因组</text>
  <text x="706" y="320" font-size="11.5" fill="#33332E">着丝粒与节段重复首次可读</text>
  <text x="706" y="338" font-size="11" fill="#6B6B66">（Nurk 2022 · Science）</text>
  <text x="706" y="358" font-size="12" font-weight="bold" fill="#E64B35">「完成图」标准被改写</text>

  <!-- ============ 2023（下） ============ -->
  <rect x="920" y="442" width="218" height="144" rx="6" fill="#FAFAF7" stroke="#E9E9E5"/>
  <rect x="922" y="448" width="4" height="132" rx="2" fill="#00A087"/>
  <text x="938" y="471" font-size="15" font-weight="bold" fill="#00A087">2023</text>
  <text x="938" y="495" font-size="13" font-weight="bold" fill="#33332E">HPRC 图形泛基因组</text>
  <text x="938" y="520" font-size="11.5" fill="#33332E">94 条单倍型草案发布</text>
  <text x="938" y="538" font-size="11.5" fill="#33332E">（目标 350 份 · Liao 2023）</text>
  <text x="938" y="556" font-size="11.5" fill="#33332E">图上比对缓解 reference</text>
  <text x="938" y="574" font-size="11.5" fill="#33332E">bias 偏倚（讲义 §4.9）</text>

  <!-- ============ 底部结语 ============ -->
  <text x="48" y="704" font-size="15" font-weight="bold" fill="#3C5488">十年前的问题是「选哪个参考基因组」，今天开始变成「选或建图参考」。</text>
  <text x="48" y="728" font-size="11.5" fill="#6B6B66">T2T 与图参考把旧 draft 的「错接」与「缺段」重新翻出来——跨研究比较组装指标，必须锁定参考版本与评估工具。（§4.9）</text>
  <text x="1152" y="766" font-size="11" fill="#6B6B66" text-anchor="end">课程插图 · 多彩生物教学风 · 2026-09</text>
</svg>
