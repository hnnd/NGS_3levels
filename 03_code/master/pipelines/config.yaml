# ============================================
# 文件名称：config.yaml
# 功能描述：m08 最小 Snakemake 流程的全部可变参数
# 作者：王运生
# 日期：2026-08-29
# ============================================
#
# 约定：Snakefile 里不出现任何具体路径、样本名、线程数与阈值，
#       它们全部在这里。换数据集 = 只改这个文件。

# ---- 输入 ----------------------------------------------------------------
# 样本清单：制表符分隔，必须含 sample / fq1 / fq2 / condition 四列
samples_tsv: "samples.tsv"

# 参考转录组 FASTA（salmon index 的输入）
transcriptome: "data/ref/transcripts.fa"

# ---- 资源 ----------------------------------------------------------------
# 每条 rule 的线程数。集群上按 -c/--cores 的总量自动排队，不必手工分配。
threads:
  fastp: 4
  salmon_index: 4
  salmon_quant: 4

# ---- 工具参数 ------------------------------------------------------------
# 写在这里而不是写死在 shell 里：审稿人问"你的过滤阈值是多少"时，
# 这个文件就是答案，而且它随 git 一起被版本化。
fastp:
  qualified_quality_phred: 20   # 单碱基合格质量线（Q20）
  length_required: 36           # 过滤后短于此长度的 read 丢弃
  extra: "--detect_adapter_for_pe"

salmon:
  libtype: "A"                  # A = 让 salmon 自己判断文库类型
  extra: "--validateMappings --seqBias"
  index_kmer: 31                # 转录本较短时需调小（见讲义 ⑨-6）

# ---- 报告 ----------------------------------------------------------------
report:
  title: "m08 最小流程 · 可重复分析报告"
  author: "请改成你自己的名字"
  # 报告里要固定复述的前序分析阈值（可重复性的核心记录，见讲义 ⑦）
  thresholds_note: "本示例流程只做定量，不做差异表达；若接 m04 的 DESeq2，请在此写明 padj 与 |log2FC| 阈值。"
